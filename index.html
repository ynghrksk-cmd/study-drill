<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4F1EA">
<title>中1数学ドリル</title>
<style>
  /* ============================================================
     色の意味は固定する（毎回同じ意味で出てくると、見ただけでわかる）
       正解＝青 / まちがい＝オレンジ / 大事なきまり＝蛍光ペンの黄色 / 次に押すボタン＝こい紺
     赤と緑の組み合わせは使わない（色覚のタイプによって見分けにくいため）
     ============================================================ */
  :root{
    color-scheme:light;
    --bg:#F4F1EA;        /* 紙のような、まぶしすぎない地の色 */
    --surface:#FFFDF9;   /* カード */
    --surface-2:#ECE7DC; /* キーの押した色など */
    --line:#DAD3C5;
    --grid:rgba(60,90,130,.09);
    --ink:#1E2833;       /* 文字（地の色とのコントラスト 約13:1） */
    --ink-2:#5A6472;     /* 補足の文字 */
    --faint:#A39C8E;     /* 入力前の「—」など */
    --pen:#22313F;       /* 手書きの線（えんぴつの色） */
    --primary:#1E2833;   /* 次に押すボタン */
    --ok:#2463A8;        /* 正解 */
    --ok-soft:#E2ECF8;
    --ng:#B8570E;        /* まちがい（赤を使わず、あせりをさそわない） */
    --ng-soft:#FAEBDC;
    --mark:#FFE27A;      /* 大事なきまり */
    --focus:#2463A8;
    --l3:#7FA9D6;        /* 習得マップ「できている」 */
    --l5:#2463A8;        /* 習得マップ「身についた」 */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  [hidden]{display:none!important;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic",system-ui,sans-serif;
    display:flex;justify-content:center;
    overscroll-behavior:none;
    touch-action:manipulation;
    -webkit-text-size-adjust:100%;
  }
  #app{
    width:100%;max-width:480px;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;min-height:100%;
  }
  .num{
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-variant-numeric:tabular-nums;
  }
  button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;}
  button:focus-visible{outline:3px solid var(--focus);outline-offset:2px;}

  /* ---- トップ ---- */
  .title{font-size:1.3rem;font-weight:800;letter-spacing:.04em;margin:8px 0 6px;}
  .lead{color:var(--ink-2);font-size:.9rem;line-height:1.8;margin:0 0 20px;}
  .menu{display:flex;flex-direction:column;gap:10px;}
  .unit{
    background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:16px 18px;text-align:left;display:flex;align-items:center;gap:14px;
    box-shadow:0 1px 2px rgba(30,40,51,.05);
  }
  .unit:active{background:var(--surface-2);}
  .unit b{font-size:1.02rem;font-weight:700;display:block;}
  .unit span{font-size:.8rem;color:var(--ink-2);display:block;margin-top:4px;line-height:1.5;}
  .unit .mark{
    width:40px;height:40px;flex:none;margin:0;border-radius:10px;background:var(--ok-soft);
    display:grid;place-items:center;font-size:1.2rem;font-weight:700;color:var(--ok);
  }
  .unit .badge{
    display:inline-block;margin:0 0 0 8px;padding:1px 8px;border-radius:999px;vertical-align:2px;
    background:var(--mark);color:var(--ink);font-size:.7rem;font-weight:700;
  }
  .count{
    display:flex;align-items:center;gap:8px;margin:22px 0 6px;
    font-size:.84rem;color:var(--ink-2);
  }
  .count button{
    border:1px solid var(--line);border-radius:999px;padding:7px 15px;
    font-size:.84rem;color:var(--ink-2);background:var(--surface);
  }
  .count button[aria-pressed="true"]{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:700;}
  .top-row{display:flex;justify-content:space-between;align-items:center;gap:12px;}
  .switches{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;}
  .switch{
    flex:none;padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);
    color:var(--ink-2);font-size:.8rem;font-weight:600;text-decoration:none;
  }
  .tip{
    margin:18px 0 0;padding:12px 14px;border-radius:12px;border:1px dashed var(--line);
    background:var(--surface);color:var(--ink-2);font-size:.82rem;line-height:1.8;
  }

  /* ---- 出題 ---- */
  #app.is-quiz{
    height:100vh;height:100dvh;min-height:0;
    padding-top:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom));
    -webkit-user-select:none;user-select:none;
  }
  .bar{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:.82rem;color:var(--ink-2);}
  .bar .quit{padding:5px 12px;border:1px solid var(--line);border-radius:999px;font-size:.78rem;color:var(--ink-2);background:var(--surface);}
  /* 進み具合は1問ずつの区切りで見せる（ゴールが近づくほどやる気が出やすい） */
  .dots{display:flex;gap:4px;margin-top:10px;flex:none;}
  .dots i{flex:1;height:6px;border-radius:3px;background:var(--surface-2);transition:background .3s;}
  .dots i.done{background:#A7AEB8;}
  .dots i.now{background:var(--ink);}
  .main{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;margin-top:10px;}
  .left{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;}
  /* 問題はカードにのせて、いちばん目がいくようにする */
  .q{
    text-align:center;font-size:clamp(1.6rem,7vw,2.4rem);font-weight:700;line-height:1.3;
    letter-spacing:.01em;padding:10px 14px;
    background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(30,40,51,.05);
  }
  .q small{
    display:block;font-size:.85rem;font-weight:500;color:var(--ink-2);margin-bottom:4px;letter-spacing:.02em;
    font-family:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
  }
  .q.word{text-align:left;font-size:1.08rem;font-weight:500;line-height:1.9;letter-spacing:.03em;padding:12px 16px;}
  .q.word .tag{
    display:inline-block;margin-right:8px;padding:1px 9px;border-radius:999px;vertical-align:2px;
    background:var(--surface-2);color:var(--ink-2);font-size:.72rem;font-weight:700;letter-spacing:0;
  }
  .nw{white-space:nowrap;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;}
  .work{flex:1;min-height:150px;display:flex;flex-direction:column;overflow:hidden;}
  .head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.8rem;color:var(--ink-2);}
  .work .head{padding:6px 6px 6px 12px;border-bottom:1px solid var(--line);}
  .tools{display:flex;gap:6px;}
  .tools button{padding:6px 12px;border:1px solid var(--line);border-radius:999px;font-size:.76rem;color:var(--ink-2);background:var(--surface);}
  .tools button[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:700;}
  .ink{position:relative;flex:1;min-height:0;touch-action:none;-webkit-touch-callout:none;}
  .ink canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
  /* 計算スペースは方眼（式の行や位がそろえやすい） */
  .work .ink{
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:28px 28px;
  }

  .right{flex:none;display:flex;flex-direction:column;gap:8px;min-height:0;}
  .answer{display:flex;flex-direction:column;gap:8px;}
  .ans-row{display:flex;align-items:center;gap:10px;}
  .ans-row .pre{font-size:1.5rem;font-weight:700;color:var(--ink-2);flex:none;}
  .ans-row .suf{font-size:1.2rem;font-weight:700;color:var(--ink-2);flex:none;}
  .ans{flex:1;height:96px;}
  .ans::after{content:'';position:absolute;left:16px;right:16px;bottom:22%;border-bottom:2px dashed var(--line);pointer-events:none;}
  .ans .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);font-size:.9rem;pointer-events:none;}
  .read{display:flex;align-items:baseline;justify-content:space-between;gap:12px;min-height:2.6rem;padding:0 4px;}
  .read .label{font-size:.82rem;color:var(--ink-2);}
  .read .val{font-size:2rem;font-weight:700;min-width:2.2ch;text-align:right;border-bottom:3px solid var(--line);padding:0 6px 2px;flex:none;}
  .read .val.empty{color:var(--faint);}
  .read.ok .val{border-color:var(--ok);color:var(--ok);}
  .read.ok .label{color:var(--ok);font-size:1.05rem;font-weight:700;}

  /* ---- テンキー（手書きの予備なので、目立ちすぎないように） ---- */
  .keys{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;}
  .keys button{
    background:var(--surface);border:1px solid var(--line);border-radius:10px;
    height:44px;font-size:1.25rem;font-weight:600;color:var(--ink);
  }
  .keys button:active{background:var(--surface-2);}
  .go{
    flex:none;width:100%;min-height:54px;padding:6px 14px;border-radius:14px;
    background:var(--primary);color:#fff;font-size:1.05rem;font-weight:700;line-height:1.35;
  }
  .go:disabled{background:var(--surface-2);color:var(--faint);}
  .go.ok{background:var(--ok);color:#fff;}
  .go.step{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--primary);}
  .go.next{background:var(--primary);color:#fff;}

  /* ---- 解説 ---- */
  .right.explaining{flex:0 1 auto;max-height:64%;}
  .explain{
    flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--ng);border-radius:14px;
  }
  .ex-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 14px;}
  .ex-top .mine{font-size:.85rem;color:var(--ink-2);}
  .ex-top .mine b{color:var(--ng);font-size:1.15rem;margin-left:6px;}
  .ex-top .correct{font-size:.95rem;font-weight:700;}
  .ex-top .correct b{color:var(--ok);font-size:1.6rem;margin-left:6px;}
  .hint{margin:10px 0 0;padding:9px 12px;border-radius:10px;background:var(--ng-soft);font-size:.88rem;line-height:1.75;}
  .hint b{font-weight:700;}
  .ex-h{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px;}
  .ex-h h3{font-size:.82rem;color:var(--ink-2);font-weight:700;margin:0;}
  .ex-h .all{font-size:.8rem;color:var(--ok);font-weight:600;padding:4px 6px;}
  .steps{list-style:none;margin:0;padding:0;counter-reset:st;display:flex;flex-direction:column;gap:14px;}
  .steps li{counter-increment:st;position:relative;padding-left:34px;animation:rise .25s ease-out;}
  .steps li::before{
    content:counter(st);position:absolute;left:0;top:3px;width:24px;height:24px;border-radius:50%;
    background:var(--primary);color:#fff;font-size:.8rem;font-weight:700;display:grid;place-items:center;
  }
  .steps p{margin:0;font-size:.95rem;line-height:1.85;}
  /* 大事なきまりは蛍光ペン（毎回同じ見た目にして、目に入りやすくする） */
  .steps b{
    font-weight:700;padding:0 2px;
    background:linear-gradient(transparent 58%,var(--mark) 58%);
    -webkit-box-decoration-break:clone;box-decoration-break:clone;
  }
  .steps .m{display:inline-block;margin-top:6px;padding:6px 12px;border-radius:8px;background:var(--bg);font-size:1.2rem;font-weight:600;line-height:1.65;}
  .steps .m span{display:block;}
  /* 数直線の図 */
  .fig{margin:8px 0 0;max-width:440px;}
  .fig figcaption{font-size:.76rem;color:var(--ink-2);margin-bottom:2px;}
  .nl{display:block;width:100%;height:auto;}
  .nl .axis,.nl .tick{stroke:var(--ink-2);stroke-width:1.5;}
  .nl .guide{stroke:var(--line);stroke-width:1.5;stroke-dasharray:4 3;}
  .nl .a1{stroke:var(--ink);stroke-width:3;}
  .nl .h1{fill:var(--ink);}
  .nl .a2{stroke:var(--ok);stroke-width:3;}
  .nl .h2{fill:var(--ok);}
  .nl text{font-family:"Helvetica Neue",Arial,sans-serif;font-size:15px;text-anchor:middle;fill:var(--ink-2);}
  .nl text.s1{fill:var(--ink);font-weight:700;}
  .nl text.s2,.nl text.ans{fill:var(--ok);font-weight:700;}
  @keyframes rise{from{opacity:0;transform:translateY(4px);}}

  /* ---- 結果 ---- */
  .score{text-align:center;padding:26px 0 6px;}
  .score .big{font-size:4.2rem;font-weight:800;line-height:1;}
  .score .big u{text-decoration:none;font-size:1.6rem;color:var(--ink-2);}
  .score .msg{margin:14px auto 0;max-width:30em;font-size:.95rem;line-height:1.85;}
  .score .sub{color:var(--ink-2);font-size:.8rem;margin-top:6px;}
  .review{margin:18px 0 6px;display:flex;flex-direction:column;gap:8px;}
  .review h2{font-size:.84rem;color:var(--ink-2);font-weight:700;margin:0 0 2px;}
  .row{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ng);border-radius:12px;}
  .row summary{
    list-style:none;cursor:pointer;padding:11px 14px;display:flex;justify-content:space-between;
    align-items:center;gap:12px;font-size:1rem;
  }
  .row summary::-webkit-details-marker{display:none;}
  .row summary small{display:block;font-size:.75rem;font-weight:400;color:var(--ink-2);}
  .row summary .wq{font-size:.9rem;line-height:1.7;}
  .row .mine{font-size:.8rem;color:var(--ink-2);text-align:right;line-height:1.5;flex:none;}
  .row .mine b{display:block;color:var(--ok);font-size:1.05rem;font-weight:700;}
  .row .open{display:block;color:var(--ok);font-size:.74rem;font-weight:600;}
  .row[open] .open{visibility:hidden;}
  .row-ex{padding:12px 14px 14px;border-top:1px solid var(--line);}
  .acts{margin-top:auto;padding-top:20px;display:flex;flex-direction:column;gap:9px;}
  .acts button{
    height:54px;border-radius:14px;font-size:.98rem;font-weight:700;
    background:var(--primary);color:#fff;
  }
  .acts button.ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink);font-weight:600;}

  /* ---- iPad などの大きい画面 ---- */
  @media (min-width:700px){
    #app{max-width:620px;padding:32px 28px calc(28px + env(safe-area-inset-bottom));}
    #app.is-quiz{max-width:780px;padding-top:18px;padding-bottom:calc(16px + env(safe-area-inset-bottom));}
    .title{font-size:1.6rem;}
    .lead{font-size:1rem;}
    .unit{padding:20px 22px;}
    .unit b{font-size:1.2rem;}
    .unit span{font-size:.92rem;}
    .unit .mark{width:48px;height:48px;font-size:1.45rem;}
    .unit .badge{font-size:.8rem;}
    .count,.count button{font-size:.95rem;}
    .count button{padding:10px 20px;}
    .tip{font-size:.95rem;}
    .switch{font-size:.92rem;padding:8px 18px;}
    .bar{font-size:.95rem;}
    .bar .quit{padding:8px 16px;font-size:.9rem;}
    .dots i{height:8px;}
    .main{gap:12px;margin-top:12px;}
    .left{gap:12px;}
    .q{font-size:2.8rem;padding:14px 18px;}
    .q small{font-size:1.05rem;}
    .q.word{font-size:1.32rem;padding:16px 20px;}
    .q.word .tag{font-size:.82rem;}
    .head{font-size:.92rem;}
    .tools{gap:8px;}
    .tools button{padding:8px 16px;font-size:.9rem;}
    .work .ink{background-size:32px 32px;}
    .ans{height:120px;}
    .ans-row .pre{font-size:2rem;}
    .ans-row .suf{font-size:1.5rem;}
    .read .label{font-size:.95rem;}
    .read.ok .label{font-size:1.25rem;}
    .read .val{font-size:2.4rem;}
    .keys{grid-template-columns:repeat(12,1fr);gap:8px;}
    .keys button{height:54px;font-size:1.5rem;}
    .go{min-height:62px;font-size:1.2rem;}
    .explain{padding:18px 22px;}
    .ex-top .mine{font-size:.95rem;}
    .ex-top .correct{font-size:1.05rem;}
    .ex-top .correct b{font-size:1.9rem;}
    .hint{font-size:1.02rem;}
    .ex-h h3,.ex-h .all{font-size:.95rem;}
    .steps{gap:18px;}
    .steps li{padding-left:40px;}
    .steps li::before{width:28px;height:28px;font-size:.9rem;}
    .steps p{font-size:1.08rem;}
    .steps .m{font-size:1.4rem;}
    .fig{max-width:520px;}
    .fig figcaption{font-size:.85rem;}
    .score .big{font-size:5.5rem;}
    .score .msg{font-size:1.08rem;}
    .score .sub{font-size:.92rem;}
    .review h2{font-size:.95rem;}
    .row summary{font-size:1.25rem;padding:14px 18px;}
    .row summary small{font-size:.85rem;}
    .row summary .wq{font-size:1.02rem;}
    .row .mine{font-size:.9rem;}
    .row .mine b{font-size:1.2rem;}
    .row-ex{padding:14px 18px 18px;}
    .acts button{height:64px;font-size:1.1rem;}
  }
  /* iPad 横向き：左に問題と計算スペース、右に答えと解説 */
  @media (min-width:1000px) and (orientation:landscape){
    #app.is-quiz{max-width:1200px;}
    .main{flex-direction:row;gap:16px;}
    .left{flex:1.4;min-width:0;}
    .q{font-size:2.4rem;}
    .right{flex:1;min-width:0;}
    .right.explaining{flex:1;max-height:none;}
    .ans{height:140px;}
    .keys{grid-template-columns:repeat(3,1fr);}
    .keys button{height:52px;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}

  /* ---- 復習ボックス（5つのアプリで共通）---- */
  .review-btn{
    width:100%;margin:0 0 14px;padding:16px 18px;border-radius:14px;text-align:left;
    background:var(--primary);color:#fff;display:flex;align-items:center;gap:14px;
    box-shadow:0 1px 2px rgba(30,40,51,.08);
  }
  .review-btn:active{opacity:.85;}
  .review-btn .mark{
    width:40px;height:40px;flex:none;border-radius:10px;background:rgba(255,255,255,.18);
    display:grid;place-items:center;font-size:1.2rem;font-weight:700;
  }
  .review-btn b{display:block;font-size:1.02rem;font-weight:700;}
  .review-btn i{display:block;font-style:normal;font-size:.8rem;opacity:.85;margin-top:4px;line-height:1.5;}
  .review-none{
    margin:0 0 14px;padding:12px 16px;border-radius:12px;background:var(--ok-soft);
    color:var(--ok);font-size:.86rem;font-weight:700;line-height:1.7;
  }
  .review-none i{display:block;font-style:normal;color:var(--ink-2);font-weight:400;margin-top:2px;font-size:.82rem;}
  .box-state{
    margin:14px 0 0;padding:11px 14px;border-radius:12px;background:var(--surface);
    border:1px solid var(--line);font-size:.82rem;color:var(--ink-2);line-height:1.8;
  }
  .box-state b{color:var(--ink);}
  .tag-again{
    padding:3px 10px;border-radius:999px;background:var(--mark);color:var(--ink);
    font-size:.72rem;font-weight:700;letter-spacing:.02em;
  }
  .again-note{
    margin:10px 0 0;padding:9px 12px;border-radius:10px;background:var(--ok-soft);
    color:var(--ok);font-size:.84rem;font-weight:700;line-height:1.7;
  }
  @media (min-width:700px){
    .review-btn{padding:20px 22px;}
    .review-btn .mark{width:48px;height:48px;font-size:1.45rem;}
    .review-btn b{font-size:1.2rem;}
    .review-btn i{font-size:.92rem;}
    .review-none,.review-none i,.box-state{font-size:.95rem;}
    .tag-again{font-size:.82rem;}
    .again-note{font-size:.95rem;}
  }

  /* ---- レベル（きほん／おうよう）5つのアプリで共通 ---- */
  .tag-adv{
    padding:3px 10px;border-radius:999px;background:var(--primary);color:#fff;
    font-size:.72rem;font-weight:700;letter-spacing:.02em;
  }
  .lv-note{
    margin:10px 0 0;padding:10px 13px;border-radius:12px;background:var(--ok-soft);
    color:var(--ok);font-size:.82rem;font-weight:700;line-height:1.75;
  }
  @media (min-width:700px){
    .tag-adv{font-size:.82rem;}
    .lv-note{font-size:.95rem;}
  }

  /* ---- ランク・今日のメニュー・習得マップ（5つのアプリで共通）---- */
  .rank{
    display:flex;align-items:center;gap:13px;margin:0 0 13px;padding:13px 15px;
    border-radius:14px;background:var(--surface);border:1px solid var(--line);
  }

    width:38px;height:38px;flex:none;border-radius:11px;background:var(--ok);color:#fff;

  .rank-body{flex:1;min-width:0;}
  .rank-body>b{display:block;font-size:1.02rem;font-weight:700;color:var(--ink);}
  .rank-body>b i{font-style:normal;font-weight:400;font-size:.76rem;color:var(--ink-2);margin-left:7px;}
  .rank-bar{display:block;height:7px;margin:7px 0 5px;border-radius:999px;background:var(--surface-2);overflow:hidden;}
  .rank-bar u{display:block;height:100%;background:var(--ok);text-decoration:none;}
  .rank-body>i{display:block;font-style:normal;font-size:.78rem;color:var(--ink-2);line-height:1.6;}
  .rankup{
    margin:0 0 14px;padding:13px 16px;border-radius:14px;background:var(--mark);
    color:var(--ink);line-height:1.7;
  }
  .rankup b{display:block;font-size:.84rem;}
  .rankup span{display:block;font-size:1.12rem;font-weight:700;}
  .rankup i{display:block;font-style:normal;font-size:.8rem;margin-top:3px;}

  .pick-h{margin:0 0 8px;font-size:.86rem;font-weight:700;color:var(--ink-2);}
  .picks{display:flex;flex-direction:column;gap:9px;margin:0 0 14px;}
  .pick{
    width:100%;padding:14px 16px;border-radius:14px;text-align:left;
    background:var(--surface);border:1px solid var(--line);color:var(--ink);
    display:flex;align-items:center;gap:13px;
  }
  .pick:first-child{background:var(--primary);border-color:var(--primary);color:#fff;}
  .pick:active{opacity:.85;}
  .pick .mark{
    width:38px;height:38px;flex:none;border-radius:10px;background:var(--surface-2);
    display:grid;place-items:center;font-size:1.1rem;font-weight:700;color:var(--ink-2);
  }
  .pick:first-child .mark{background:rgba(255,255,255,.18);color:#fff;}
  .pick b{display:block;font-size:1rem;font-weight:700;}
  .pick i{display:block;font-style:normal;font-size:.78rem;opacity:.85;margin-top:3px;line-height:1.5;}

  .map{margin:14px 0 0;border-radius:12px;background:var(--surface);border:1px solid var(--line);}
  .map>summary{padding:11px 14px;font-size:.84rem;font-weight:700;color:var(--ink-2);cursor:pointer;}
  .map-body{padding:0 14px 12px;}
  .map-row{display:flex;align-items:flex-start;gap:10px;margin:0 0 8px;}
  .map-name{flex:none;width:7.2em;font-size:.76rem;color:var(--ink-2);line-height:1.5;}
  .map-dots{display:flex;flex-wrap:wrap;gap:3px;}
  .map-dots i,.map-key i{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none;}
  .map-dots i.hit{outline:2px solid var(--ink);outline-offset:1px;}
  .s-grad{background:var(--l5);}
  .s-ok{background:var(--l3);}
  .s-review{background:var(--ng);}
  .s-rest{background:var(--line);}
  .map-key{display:flex;flex-wrap:wrap;gap:11px;padding-top:8px;border-top:1px solid var(--line);font-size:.75rem;color:var(--ink-2);}
  .map-key span{display:flex;align-items:center;gap:4px;}
  .map-note{margin:9px 0 0;font-size:.75rem;color:var(--ink-2);line-height:1.7;}
  @media (min-width:700px){
    .rank-no{width:44px;height:44px;font-size:1.3rem;}
    .rank-body>b{font-size:1.18rem;}
    .rank-body>b i,.rank-body>i,.rankup i{font-size:.9rem;}
    .pick b{font-size:1.14rem;}
    .pick i,.pick-h{font-size:.9rem;}
    .map>summary,.map-name,.map-key,.map-note{font-size:.9rem;}
    .map-dots i,.map-key i{width:12px;height:12px;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   1. 問題を作る部分（ここを増やせば単元が増えます）
      問題は { text, answer, prefix?, steps } の形で返す。
      steps は、まちがえたときに見せる「とき方」。{ say: 説明, math: 式 } の配列。
   ============================================================ */

// a以上b以下の整数をランダムに1つ返す
function rnd(a, b){ return Math.floor(Math.random() * (b - a + 1)) + a; }
// 0以外の整数
function rndNz(a, b){ let n; do { n = rnd(a, b); } while (n === 0); return n; }
// 配列からランダムに1つ
function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

// 負の数を「−7」のように全角マイナスで表す
function numText(n){ return n < 0 ? '−' + Math.abs(n) : String(n); }
// 数を「(＋3)」「(−7)」の形にする
function signed(n){ return '(' + (n < 0 ? '−' + Math.abs(n) : '＋' + n) + ')'; }
// 負の数だけ（ ）をつける：「(−3)」「3」
function parenN(n){ return n < 0 ? '(' + numText(n) + ')' : String(n); }
// 式の途中の「＋5」「－5」
function tail(n){ return (n < 0 ? ' － ' : ' ＋ ') + Math.abs(n); }
// 「4x」「−x」「x」のような項
function term(c, v){
  if (c === 1) return v;
  if (c === -1) return '−' + v;
  return (c < 0 ? '−' : '') + Math.abs(c) + v;
}
// 式の途中の「＋ 3x」「－ x」
function tailTerm(c, v){ return (c < 0 ? ' － ' : ' ＋ ') + term(Math.abs(c), v); }
// 「4x」の x に数を入れた形：「4 × (−3)」
function times(a, s){ return a === 1 ? s : numText(a) + ' × ' + s; }
function sup(n){ return n === 2 ? '²' : '³'; }

/* ---- とき方を作る部品 ---- */

// かけ算・わり算の答えの符号
function signNote(nums){
  const k = nums.filter(n => n < 0).length;
  if (k === 0) return '負の数がないので、答えの符号は ＋ です。';
  return `負の数が ${k} 個あります。` + (k % 2
    ? '<b>負の数が奇数個（1個、3個…）のときは、答えの符号は −</b> です。'
    : '<b>負の数が偶数個（2個、4個…）のときは、答えの符号は ＋</b> です。');
}

// ひき算をたし算に直す
function toAddStep(text, terms){
  return { say: '<b>ひき算は、ひく数の符号を変えると、たし算に直せます</b>。', math: text + ' ＝ ' + terms.map(signed).join(' ＋ ') };
}

// (a) ＋ (b) の計算
function explainAdd(a, b){
  const A = Math.abs(a), B = Math.abs(b), head = signed(a) + ' ＋ ' + signed(b);
  if ((a > 0) === (b > 0)){
    const s = a > 0 ? '＋' : '−';
    return [
      { say: `どちらも${a > 0 ? '正の数' : '負の数'}で、符号が同じです。<b>符号が同じときは、絶対値（符号をとった数）をたして、同じ符号「${s}」をつけます</b>。`, math: `${A} ＋ ${B} ＝ ${A + B}` },
      { say: `符号「${s}」をつけて、答えを出します。`, math: head + ' ＝ ' + numText(a + b), fig: numberLine(a, b) }
    ];
  }
  const steps = [{
    say: '符号がちがいます。<b>符号がちがうときは、絶対値の大きいほうから小さいほうをひいて、絶対値が大きいほうの符号をつけます</b>。',
    math: `${Math.max(A, B)} － ${Math.min(A, B)} ＝ ${Math.abs(A - B)}`
  }];
  if (A === B) steps.push({ say: '絶対値が同じなので、答えは 0 です。', math: head + ' ＝ 0', fig: numberLine(a, b) });
  else {
    const big = A > B ? a : b;
    steps.push({ say: `絶対値が大きいのは ${signed(big)} なので、符号は「${big > 0 ? '＋' : '−'}」です。`, math: head + ' ＝ ' + numText(a + b), fig: numberLine(a, b) });
  }
  return steps;
}

// 数直線の図：0 から a まで進み、そこから b だけ進む（＋は右へ、−は左へ）
// ことばの説明と図の両方があると、符号の動きがイメージとして残りやすい
function numberLine(a, b){
  const s = a + b;
  const span = Math.max(0, a, s) - Math.min(0, a, s);
  const step = span > 40 ? 10 : span > 16 ? 5 : 1;
  const lo = Math.floor(Math.min(0, a, s) / step) * step - step;
  const hi = Math.ceil(Math.max(0, a, s) / step) * step + step;
  const X = v => +(20 + (v - lo) / (hi - lo) * 520).toFixed(1);
  const Y = 74;
  const arrow = (from, to, y, n) => {
    const d = to > from ? 1 : -1, x = X(to);
    return `<line x1="${X(from)}" y1="${y}" x2="${x - 7 * d}" y2="${y}" class="a${n}"/>` +
      `<polygon points="${x},${y} ${x - 10 * d},${y - 5} ${x - 10 * d},${y + 5}" class="h${n}"/>` +
      `<text x="${((X(from) + x) / 2).toFixed(1)}" y="${y - 8}" class="s${n}">${signed(to - from)}</text>`;
  };
  let ticks = '';
  for (let v = lo; v <= hi; v += step) ticks += `<line x1="${X(v)}" y1="${Y - 5}" x2="${X(v)}" y2="${Y + 5}" class="tick"/>`;
  const labels = [...new Set([0, a, s])].map(v => `<text x="${X(v)}" y="${Y + 23}"${v === s ? ' class="ans"' : ''}>${numText(v)}</text>`).join('');
  return '<figure class="fig"><figcaption>数直線で見ると（＋ は右へ、− は左へ進む）</figcaption>' +
    `<svg class="nl" viewBox="0 0 560 104" role="img" aria-label="${numText(a)} から ${signed(b)} 進むと ${numText(s)}">` +
    `<line x1="12" y1="${Y}" x2="548" y2="${Y}" class="axis"/>${ticks}` +
    `<line x1="${X(a)}" y1="30" x2="${X(a)}" y2="${Y}" class="guide"/><line x1="${X(s)}" y1="30" x2="${X(s)}" y2="${Y}" class="guide"/>` +
    arrow(0, a, 52, 1) + arrow(a, s, 30, 2) + labels + '</svg></figure>';
}

// 3つの数のたし算・ひき算
function explainSum(text, terms, hasSub){
  const steps = hasSub ? [toAddStep(text, terms)] : [];
  const pos = terms.filter(n => n > 0), neg = terms.filter(n => n < 0);
  const P = pos.reduce((s, n) => s + n, 0), N = neg.reduce((s, n) => s + n, 0);
  if (!pos.length || !neg.length){
    const s = pos.length ? '＋' : '−';
    steps.push({ say: `ぜんぶ${pos.length ? '正の数' : '負の数'}です。<b>絶対値をたして、符号「${s}」をつけます</b>。`, math: terms.map(signed).join(' ＋ ') + ' ＝ ' + numText(P + N) });
    return steps;
  }
  steps.push({ say: '<b>正の数どうし、負の数どうしを集めます</b>。たし算は、順番を入れかえても答えは変わりません。', math: pos.concat(neg).map(signed).join(' ＋ ') });
  const lines = [];
  if (pos.length > 1) lines.push(pos.map(signed).join(' ＋ ') + ' ＝ ' + numText(P));
  if (neg.length > 1) lines.push(neg.map(signed).join(' ＋ ') + ' ＝ ' + numText(N));
  if (lines.length){
    steps.push({ say: neg.length > 1 ? 'それぞれまとめます。負の数どうしは、絶対値をたして − をつけます。' : '正の数どうしをまとめます。', math: lines });
  }
  return steps.concat(explainAdd(P, N));
}

// かけ算・わり算（2つの数）
function explainMulDiv(text, a, b, op, ans){
  return [
    { say: `${op === '×' ? 'かけ算' : 'わり算'}は、<b>① 答えの符号を決める → ② 絶対値（符号をとった数）で計算する</b> の順で考えます。` },
    { say: '① ' + signNote([a, b]) },
    { say: '② 絶対値で計算します。', math: `${Math.abs(a)} ${op} ${Math.abs(b)} ＝ ${Math.abs(ans)}` },
    { say: '符号をつけて、答えを出します。', math: text + ' ＝ ' + numText(ans) }
  ];
}

// 方程式：両方の辺を x の係数でわる
function divideStep(a, right, x){
  if (a === 1) return [];
  return [{
    say: `両方の辺を、x の前の数 ${numText(a)} でわります。` + (a === -1 ? '（−1 でわると、符号が反対になります）' : ''),
    math: `x ＝ ${numText(right)} ÷ ${parenN(a)} ＝ ${numText(x)}`
  }];
}
// 方程式：移項
function moveSay(n){
  return `左の辺の「${tail(n).trim()}」を右の辺に<b>移項</b>します。<b>移項すると符号が変わります</b>（${tail(n).trim()} → ${tail(-n).trim()}）。`;
}

// いま作っている問題の種類。復習ボックスの「項目」に使う（makeOne でひろう）
let curKind = '';

// --- 単元1：正負の数（たし算・ひき算）---
function genAddSub(){
  if (Math.random() < WORD_RATE) return wordAddSub();
  if (Math.random() < 0.3){
    curKind = 'three';
    const a = rndNz(-12, 12), b = rndNz(-12, 12), c = rndNz(-9, 9);
    const o1 = pick(['+','-']), o2 = pick(['+','-']);
    const terms = [a, o1 === '+' ? b : -b, o2 === '+' ? c : -c];
    const text = signed(a) + (o1 === '+' ? ' ＋ ' : ' － ') + signed(b) + (o2 === '+' ? ' ＋ ' : ' － ') + signed(c);
    return { text, answer: terms[0] + terms[1] + terms[2], steps: explainSum(text, terms, o1 === '-' || o2 === '-') };
  }
  curKind = 'two';
  const a = rndNz(-15, 15), b = rndNz(-15, 15), o = pick(['+','-']);
  const text = signed(a) + (o === '+' ? ' ＋ ' : ' － ') + signed(b);
  const bb = o === '+' ? b : -b;
  return { text, answer: a + bb, steps: (o === '-' ? [toAddStep(text, [a, bb])] : []).concat(explainAdd(a, bb)) };
}

// --- 単元2：正負の数（かけ算・わり算・四則）---
function genMulDiv(){
  if (Math.random() < WORD_RATE) return wordMulDiv();
  const kind = curKind = pick(['mul','div','pow','mix','mix']);
  if (kind === 'mul'){
    const a = rndNz(-12, 12), b = rndNz(-9, 9);
    const text = signed(a) + ' × ' + signed(b);
    return { text, answer: a * b, steps: explainMulDiv(text, a, b, '×', a * b) };
  }
  if (kind === 'div'){
    const b = rndNz(-9, 9), q = rndNz(-9, 9);
    const text = signed(b * q) + ' ÷ ' + signed(b);
    return { text, answer: q, steps: explainMulDiv(text, b * q, b, '÷', q) };
  }
  if (kind === 'pow'){
    const a = rndNz(-6, 6), n = pick([2, 2, 3]);
    const A = Math.abs(a), An = Math.pow(A, n);
    const reps = s => Array(n).fill(s).join(' × ');
    // 「(−3)²」と「−3²」の違いを両方出す
    if (a < 0 && Math.random() < 0.5){
      const text = '−' + A + sup(n);
      return { text, answer: -An, steps: [
        { say: `${text} は、「${A}${sup(n)}」に − がついた数です。<b>${sup(n)} がついているのは ${A} だけ</b>で、− はかけません。`, math: `${text} ＝ −(${reps(A)})` },
        { say: 'かっこの中を計算して、− をつけます。', math: `−(${reps(A)}) ＝ ${numText(-An)}` },
        { say: `<b>(−${A})${sup(n)} とはちがう</b>ので注意しよう。(−${A})${sup(n)} は −${A} を ${n} 回かけるので、${numText(Math.pow(-A, n))} になります。` }
      ]};
    }
    const base = '(' + numText(a) + ')', text = base + sup(n);
    const steps = [{ say: `${text} は、<b>${numText(a)} を ${n} 回かける</b>という意味です。`, math: `${text} ＝ ${reps(base)}` }];
    if (a < 0){
      steps.push({ say: signNote(Array(n).fill(a)) });
      steps.push({ say: '絶対値で計算して、符号をつけます。', math: [`${reps(A)} ＝ ${An}`, `${text} ＝ ${numText(Math.pow(a, n))}`] });
    } else {
      steps.push({ say: 'かけ算をします。', math: `${reps(A)} ＝ ${An}` });
    }
    return { text, answer: Math.pow(a, n), steps };
  }
  const a = rndNz(-10, 10), b = rndNz(-6, 6), c = rndNz(-6, 6);
  const first = '<b>かけ算・わり算は、たし算・ひき算より先に計算します</b>。';
  if (Math.random() < 0.5){
    const text = numText(a) + ' ＋ ' + signed(b) + ' × ' + signed(c);
    return { text, answer: a + b * c, steps: [
      { say: `${first}まず ${signed(b)} × ${signed(c)} を計算します。${signNote([b, c])}`, math: `${signed(b)} × ${signed(c)} ＝ ${numText(b * c)}` },
      { say: '計算した結果を、元の式にもどします。', math: `${text} ＝ ${numText(a)} ＋ ${signed(b * c)}` }
    ].concat(explainAdd(a, b * c)) };
  }
  const q = rndNz(-6, 6);
  const text = numText(a) + ' － ' + signed(b * q) + ' ÷ ' + signed(b);
  return { text, answer: a - q, steps: [
    { say: `${first}まず ${signed(b * q)} ÷ ${signed(b)} を計算します。${signNote([b * q, b])}`, math: `${signed(b * q)} ÷ ${signed(b)} ＝ ${numText(q)}` },
    { say: '結果を元の式にもどして、<b>ひき算は、ひく数の符号を変えて、たし算に直します</b>。', math: [`${text} ＝ ${numText(a)} － ${signed(q)}`, `＝ ${signed(a)} ＋ ${signed(-q)}`] }
  ].concat(explainAdd(a, -q)) };
}

// --- 単元3：文字と式（式の値）---
function genExprValue(){
  if (Math.random() < WORD_RATE) return wordExpr();
  const x = rndNz(-6, 6);
  const kind = curKind = pick(['linear','linear','square','double']);
  const cond = '<small>x ＝ ' + numText(x) + ' のとき</small>';
  const put = `x に ${numText(x)} を入れます。` + (x < 0 ? '<b>負の数を入れるときは、かっこ（ ）をつけます</b>。' : '');
  const X = parenN(x);
  if (kind === 'linear'){
    const a = rndNz(-7, 7), b = rndNz(-12, 12), ax = a * x;
    const expr = term(a, 'x') + tail(b);
    const steps = [{ say: (a === 1 ? '' : `${term(a, 'x')} は「${numText(a)} × x」のことです。`) + put, math: `${expr} ＝ ${times(a, X)}${tail(b)}` }];
    if (a !== 1) steps.push({ say: 'かけ算を先に計算します。' + signNote([a, x]), math: `${numText(a)} × ${X} ＝ ${numText(ax)}` });
    steps.push({ say: '式にもどして、たし算の形にします。', math: `${numText(ax)}${tail(b)} ＝ ${signed(ax)} ＋ ${signed(b)}` });
    return { text: cond + expr, answer: ax + b, steps: steps.concat(explainAdd(ax, b)) };
  }
  if (kind === 'square'){
    const a = pick([1, 1, 2, -1, 3]), b = rndNz(-9, 9), x2 = x * x, ax2 = a * x2;
    const expr = term(a, 'x²') + tail(b);
    const steps = [{
      say: '<b>x² は「x × x」</b>のことです。' + put + (x < 0 ? '負の数 × 負の数 なので、答えは ＋ になります。' : ''),
      math: `x² ＝ ${X} × ${X} ＝ ${x2}`
    }];
    if (a !== 1) steps.push({ say: `${term(a, 'x²')} は「${numText(a)} × x²」のことです。`, math: `${numText(a)} × ${x2} ＝ ${numText(ax2)}` });
    steps.push({ say: '式にもどして、たし算の形にします。', math: `${numText(ax2)}${tail(b)} ＝ ${signed(ax2)} ＋ ${signed(b)}` });
    return { text: cond + expr, answer: ax2 + b, steps: steps.concat(explainAdd(ax2, b)) };
  }
  const a = rndNz(-5, 5), b = rndNz(-6, 6), c = rndNz(-5, 5), inner = x + b, m = a * inner;
  const expr = numText(a) + '(x' + tail(b) + ')' + tail(c);
  const steps = [
    { say: '<b>かっこの中を先に計算します</b>。' + put, math: `x${tail(b)} ＝ ${X}${tail(b)} ＝ ${numText(inner)}` },
    inner === 0
      ? { say: `${numText(a)}( ) は「${numText(a)} × ( )」のことです。0 にどんな数をかけても 0 です。`, math: `${numText(a)} × 0 ＝ 0` }
      : { say: `${numText(a)}( ) は「${numText(a)} × ( )」のことです。かっこの前の ${numText(a)} をかけます。${signNote([a, inner])}`, math: `${numText(a)} × ${parenN(inner)} ＝ ${numText(m)}` }
  ];
  if (m === 0) steps.push({ say: '式にもどします。0 にたしても、数は変わりません。', math: `0${tail(c)} ＝ ${numText(c)}` });
  else steps.push({ say: '式にもどして、たし算の形にします。', math: `${numText(m)}${tail(c)} ＝ ${signed(m)} ＋ ${signed(c)}` }, ...explainAdd(m, c));
  return { text: cond + expr, answer: m + c, steps };
}

// --- 単元4：一次方程式 ---
function genEquation(){
  if (Math.random() < WORD_RATE) return wordEquation();
  const x = rnd(-8, 8);
  const kind = curKind = pick(['basic','basic','both','paren']);
  const X = parenN(x);
  if (kind === 'basic'){
    const a = rndNz(-7, 7), b = rndNz(-12, 12), r = a * x + b;
    return { text: term(a, 'x') + tail(b) + ' ＝ ' + numText(r), answer: x, prefix: 'x ＝', steps: [
      { say: moveSay(b), math: `${term(a, 'x')} ＝ ${numText(r)}${tail(-b)}` },
      { say: '右の辺を計算します。', math: `${term(a, 'x')} ＝ ${numText(r - b)}` },
      ...divideStep(a, r - b, x),
      { say: `たしかめ：元の式の x に ${numText(x)} を入れると、左の辺が右の辺と同じ ${numText(r)} になります。`, math: `${times(a, X)}${tail(b)} ＝ ${numText(a * x)}${tail(b)} ＝ ${numText(r)}` }
    ]};
  }
  if (kind === 'both'){
    let a = rndNz(-7, 7), c = rndNz(-7, 7);
    while (a === c) c = rndNz(-7, 7);
    const b = rndNz(-10, 10), d = a * x + b - c * x;
    const right = term(c, 'x') + (d ? tail(d) : '');
    return { text: term(a, 'x') + tail(b) + ' ＝ ' + right, answer: x, prefix: 'x ＝', steps: [
      { say: '<b>x をふくむ項は左の辺に、数だけの項は右の辺に</b>移項します。<b>移項した項は符号が変わります</b>。',
        math: `${term(a, 'x')}${tailTerm(-c, 'x')} ＝ ${d ? numText(d) + tail(-b) : numText(-b)}` },
      { say: '両方の辺を、それぞれ計算します。', math: `${term(a - c, 'x')} ＝ ${numText(d - b)}` },
      ...divideStep(a - c, d - b, x),
      { say: `たしかめ：x に ${numText(x)} を入れると、左の辺も右の辺も ${numText(a * x + b)} になります。`,
        math: [`左：${times(a, X)}${tail(b)} ＝ ${numText(a * x + b)}`, `右：${times(c, X)}${d ? tail(d) : ''} ＝ ${numText(c * x + d)}`] }
    ]};
  }
  const a = rndNz(-5, 5), b = rndNz(-8, 8), r = a * (x + b);
  return { text: numText(a) + '(x' + tail(b) + ') ＝ ' + numText(r), answer: x, prefix: 'x ＝', steps: [
    a === 1
      ? { say: '1(　) は、かっこの中と同じなので、かっこをはずします。', math: `x${tail(b)} ＝ ${numText(r)}` }
      : { say: `両方の辺を、かっこの前の ${numText(a)} でわります。`, math: `x${tail(b)} ＝ ${numText(r)} ÷ ${parenN(a)} ＝ ${numText(x + b)}` },
    { say: moveSay(b), math: `x ＝ ${numText(x + b)}${tail(-b)} ＝ ${numText(x)}` },
    { say: `たしかめ：元の式の x に ${numText(x)} を入れると、左の辺が右の辺と同じ ${numText(r)} になります。`,
      math: `${numText(a)} × (${numText(x)}${tail(b)}) ＝ ${numText(a)} × ${parenN(x + b)} ＝ ${numText(r)}` }
  ]};
}

/* ---- 文章問題 ---- */
const WORD_RATE = 0.25;   // それぞれの単元で、文章問題が出る割合

// 文章の中の「＋7」「−5」（＋ と数字のあいだで改行しないようにする）
function plusText(n){ return '<span class="nw">' + (n > 0 ? '＋' + n : numText(n)) + '</span>'; }
function answerStep(s){ return { say: '<b>答え</b>　' + s }; }

// 単元1：正負の数（たし算・ひき算）
function wordAddSub(){
  curKind = 'word';
  const kind = pick(['temp', 'diff', 'game']);
  if (kind === 'temp'){
    const a = rndNz(-8, 12), d = rnd(2, 12);
    if (Math.random() < 0.5){
      const expr = `${signed(a)} ＋ ${signed(d)}`;
      return { word: true, suffix: '℃', answer: a + d,
        text: `朝の気温は ${numText(a)}℃ でした。昼までに ${d}℃ 上がりました。昼の気温は何℃ですか。`,
        steps: [
          { say: '「上がる」は ＋ で表します。<b>朝の気温 ＋ 上がった分</b> の式を作ります。', math: expr },
          ...explainAdd(a, d),
          answerStep(`昼の気温は ${numText(a + d)}℃`)
        ] };
    }
    const expr = `${signed(a)} － ${signed(d)}`;
    return { word: true, suffix: '℃', answer: a - d,
      text: `昼の気温は ${numText(a)}℃ でした。夜までに ${d}℃ 下がりました。夜の気温は何℃ですか。`,
      steps: [
        { say: '「下がる」は − で表します。<b>昼の気温 － 下がった分</b> の式を作ります。', math: expr },
        toAddStep(expr, [a, -d]),
        ...explainAdd(a, -d),
        answerStep(`夜の気温は ${numText(a - d)}℃`)
      ] };
  }
  if (kind === 'diff'){
    let p, q;
    do { p = rndNz(-9, 15); q = rndNz(-15, 9); } while (p <= q);
    const expr = `${signed(p)} － ${signed(q)}`;
    return { word: true, suffix: '点', answer: p - q,
      text: `テストの得点を、平均点との差で表します。A さんは ${plusText(p)} 点、B さんは ${plusText(q)} 点でした。A さんは B さんより何点高いですか。`,
      steps: [
        { say: '「何点高いか」は、<b>A さんの差 － B さんの差</b> で求めます。', math: expr },
        toAddStep(expr, [p, -q]),
        ...explainAdd(p, -q),
        answerStep(`A さんは B さんより ${p - q} 点高い`)
      ] };
  }
  const terms = [rndNz(-12, 12), rndNz(-12, 12), rndNz(-12, 12)];
  const sum = terms[0] + terms[1] + terms[2];
  return { word: true, suffix: '点', answer: sum,
    text: `ゲームで、1回目は ${plusText(terms[0])} 点、2回目は ${plusText(terms[1])} 点、3回目は ${plusText(terms[2])} 点でした。3回の合計は何点ですか。`,
    steps: [
      { say: '合計は、<b>3回の点数をぜんぶたします</b>。', math: terms.map(signed).join(' ＋ ') },
      ...explainSum('', terms, false),
      answerStep(`合計は ${numText(sum)} 点`)
    ] };
}

// 単元2：正負の数（かけ算・わり算）
function wordMulDiv(){
  curKind = 'word';
  const kind = pick(['rate', 'average', 'quiz']);
  if (kind === 'rate'){
    const r = rnd(2, 5), h = rnd(2, 6), up = Math.random() < 0.5, after = Math.random() < 0.5;
    const rate = up ? r : -r, t = after ? h : -h, when = `${h} 時間${after ? '後' : '前'}`;
    const expr = `${signed(rate)} × ${signed(t)}`;
    return { word: true, suffix: '℃', answer: rate * t,
      text: `気温が 1 時間に ${r}℃ ずつ${up ? '上がって' : '下がって'}います。今の気温を 0℃ とすると、${when}の気温は何℃ですか。`,
      steps: [
        { say: `「上がる」を ＋、「下がる」を − で表すと、1 時間の変化は <b>${signed(rate)}℃</b> です。「後」を ＋、「前」を − で表すと、${when}は <b>${signed(t)} 時間</b> です。` },
        { say: '<b>1 時間の変化 × 時間</b> で求めます。', math: expr },
        ...explainMulDiv(expr, rate, t, '×', rate * t),
        answerStep(`${when}の気温は ${numText(rate * t)}℃`)
      ] };
  }
  if (kind === 'average'){
    const base = pick([60, 65, 70, 75, 80]), n = pick([4, 5]), avg = rnd(-4, 4);
    let diffs, last;
    do {
      diffs = Array.from({ length: n - 1 }, () => rndNz(-9, 9));
      last = n * avg - diffs.reduce((s, d) => s + d, 0);
    } while (last === 0 || Math.abs(last) > 9);
    diffs.push(last);
    const S = n * avg;
    const pos = diffs.filter(d => d > 0).reduce((s, d) => s + d, 0), neg = diffs.filter(d => d < 0).reduce((s, d) => s + d, 0);
    const sumLines = [diffs.map(signed).join(' ＋ ')];
    if (pos && neg) sumLines.push(`＝ ${signed(pos)} ＋ ${signed(neg)}`);
    sumLines.push(`＝ ${numText(S)}`);
    return { word: true, suffix: '点', answer: base + avg,
      text: `${n} 人のテストの得点を、${base} 点を基準にして、基準との差で表すと ${diffs.map(plusText).join('、')}（点）でした。${n} 人の平均点は何点ですか。`,
      steps: [
        { say: '先に、<b>基準との差の平均</b>を求めます。まず、差をぜんぶたします。正の数どうし、負の数どうしをまとめると計算しやすくなります。', math: sumLines },
        S === 0
          ? { say: `差の合計を人数の ${n} でわります。0 をどんな数でわっても 0 です。`, math: `0 ÷ ${n} ＝ 0` }
          : { say: `差の合計を人数の ${n} でわると、差の平均になります。${signNote([S, n])}`, math: `${numText(S)} ÷ ${n} ＝ ${numText(avg)}` },
        { say: `<b>基準の ${base} 点 ＋ 差の平均</b> が平均点です。`, math: `${base} ＋ ${avg ? signed(avg) : 0} ＝ ${base + avg}` },
        answerStep(`平均点は ${base + avg} 点`)
      ] };
  }
  const p = rnd(2, 5), m = rnd(1, 4), N = pick([8, 10, 12]), c = rnd(1, N - 1), w = N - c;
  const good = p * c, bad = -m * w;
  return { word: true, suffix: '点', answer: good + bad,
    text: `クイズで、正解すると ＋${p} 点、まちがえると −${m} 点になります。${N} 問のうち ${c} 問正解しました。合計は何点ですか。`,
    steps: [
      { say: `まちがえた問題は、${N} － ${c} ＝ ${w}（問）です。` },
      { say: '<b>1 問の点数 × 問題の数</b> で、正解の点数とまちがいの点数をそれぞれ求めます。まちがいは 負の数 × 正の数 なので − になります。', math: [`(＋${p}) × ${c} ＝ ${good}`, `(−${m}) × ${w} ＝ ${numText(bad)}`] },
      { say: '2 つをたして、合計を出します。', math: `${good} ＋ ${signed(bad)}` },
      ...explainAdd(good, bad),
      answerStep(`合計は ${numText(good + bad)} 点`)
    ] };
}

// 単元3：文字と式（式の値）
function wordExpr(){
  curKind = 'word';
  const kind = pick(['shop', 'sky', 'match']);
  if (kind === 'shop'){
    const a = pick([50, 60, 70, 80, 90, 100, 120]), b = pick([100, 120, 150, 180, 200]), x = rnd(2, 9);
    return { word: true, suffix: '円', answer: a * x + b,
      text: `1 本 ${a} 円のえんぴつを x 本と、${b} 円のノートを 1 冊買います。x ＝ ${x} のとき、代金は何円ですか。`,
      steps: [
        { say: `<b>代金 ＝ えんぴつの代金 ＋ ノートの代金</b> です。えんぴつ x 本の代金は「${a} × x」なので、代金は次の式で表せます。`, math: `${a}x ＋ ${b}（円）` },
        { say: `x に ${x} を入れて計算します。<b>かけ算を先に</b>計算します。`, math: [`${a} × ${x} ＋ ${b}`, `＝ ${a * x} ＋ ${b}`, `＝ ${a * x + b}`] },
        answerStep(`代金は ${a * x + b} 円`)
      ] };
  }
  if (kind === 'sky'){
    const g = rnd(12, 25), x = rnd(2, 6), v = g - 6 * x;
    const steps = [
      { say: `6x は「6 × x」のことです。x に ${x} を入れます。`, math: `${g} － 6x ＝ ${g} － 6 × ${x}` },
      { say: '<b>かけ算を先に</b>計算します。', math: `${g} － 6 × ${x} ＝ ${g} － ${6 * x}` }
    ];
    if (v < 0) steps.push(toAddStep(`${g} － ${6 * x}`, [g, -6 * x]), ...explainAdd(g, -6 * x));
    else steps.push({ say: 'ひき算をします。', math: `${g} － ${6 * x} ＝ ${v}` });
    steps.push(answerStep(`気温は ${numText(v)}℃`));
    return { word: true, suffix: '℃', answer: v, steps,
      text: `地上の気温が ${g}℃ のとき、地上から x km の高さの気温は、およそ (${g} － 6x)℃ と表せます。x ＝ ${x} のとき、気温は何℃ですか。` };
  }
  const tri = Math.random() < 0.5, k = tri ? 2 : 3, x = rnd(4, 15), shape = tri ? '正三角形' : '正方形';
  return { word: true, suffix: '本', answer: k * x + 1,
    text: `マッチ棒で、${shape}を横に x 個つなげた形を作ります。使うマッチ棒の本数は (${k}x ＋ 1) 本と表せます。${shape}を ${x} 個つなげるとき、マッチ棒は何本いりますか。`,
    steps: [
      { say: `はじめの 1 本に、${shape}を 1 個ふやすごとに ${k} 本ずつ足していくので、<b>${k}x ＋ 1</b> と表せます。` },
      { say: `${shape}を ${x} 個つなげるので、x に ${x} を入れます。<b>かけ算を先に</b>計算します。`, math: [`${k} × ${x} ＋ 1`, `＝ ${k * x} ＋ 1`, `＝ ${k * x + 1}`] },
      answerStep(`マッチ棒は ${k * x + 1} 本`)
    ] };
}

// 単元4：一次方程式
function wordEquation(){
  curKind = 'word';
  const kind = pick(['shop', 'age', 'candy']);
  if (kind === 'shop'){
    const f = pick(['りんご', 'なし', 'もも']), a = pick([80, 90, 100, 120, 130, 150]), b = pick([100, 150, 200, 250]);
    const x = rnd(2, 9), T = a * x + b;
    return { word: true, suffix: '個', answer: x,
      text: `1 個 ${a} 円の${f}を何個かと、${b} 円のかごを 1 つ買ったら、代金は ${T} 円でした。${f}を何個買いましたか。`,
      steps: [
        { say: `買った${f}の個数を <b>x 個</b> として、代金を式で表すと、方程式ができます。`, math: `${a}x ＋ ${b} ＝ ${T}` },
        { say: moveSay(b), math: [`${a}x ＝ ${T} － ${b}`, `${a}x ＝ ${T - b}`] },
        ...divideStep(a, T - b, x),
        answerStep(`${f}は ${x} 個（たしかめ：${a} × ${x} ＋ ${b} ＝ ${T} 円）`)
      ] };
  }
  if (kind === 'age'){
    let c, k, x, F;
    do { c = rnd(6, 12); k = pick([2, 3]); x = rnd(2, 10); F = k * (c + x) - x; } while (F < 28 || F > 50 || F - c < 20);
    const kc = k * c, right = kc - F;
    return { word: true, suffix: '年後', answer: x,
      text: `今、父は ${F} 才、子どもは ${c} 才です。父の年れいが子どもの年れいの ${k} 倍になるのは、今から何年後ですか。`,
      steps: [
        { say: '<b>x 年後</b> として考えます。x 年たつと、父も子どもも x 才ずつ年をとります。', math: [`父：${F} ＋ x（才）`, `子ども：${c} ＋ x（才）`] },
        { say: `<b>父の年れい ＝ 子どもの年れい × ${k}</b> なので、方程式は次のようになります。`, math: `${F} ＋ x ＝ ${k}(${c} ＋ x)` },
        { say: '<b>かっこをはずします</b>。かっこの前の数を、中のそれぞれにかけます。', math: `${F} ＋ x ＝ ${kc} ＋ ${k}x` },
        { say: '<b>x の項は左の辺に、数の項は右の辺に</b>移項します。移項した項は符号が変わります。', math: [`x － ${k}x ＝ ${kc} － ${F}`, `${term(1 - k, 'x')} ＝ ${numText(right)}`] },
        ...divideStep(1 - k, right, x),
        answerStep(`${x} 年後（たしかめ：父は ${F + x} 才、子どもは ${c + x} 才で、${c + x} × ${k} ＝ ${F + x}）`)
      ] };
  }
  const x = rnd(3, 9), a = rnd(2, 6), b = a + rnd(1, 3), gap = (b - a) * x, r1 = rnd(1, gap - 1), r2 = gap - r1;
  return { word: true, suffix: '人', answer: x,
    text: `あめを何人かの子どもに配ります。1 人に ${a} 個ずつ配ると ${r1} 個あまり、${b} 個ずつ配ると ${r2} 個足りません。子どもは何人ですか。`,
    steps: [
      { say: '子どもの人数を <b>x 人</b> として、あめの個数を 2 通りの式で表します。<b>あまるときは たす、足りないときは ひく</b>。', math: [`${a} 個ずつ：${a}x ＋ ${r1}（個）`, `${b} 個ずつ：${b}x － ${r2}（個）`] },
      { say: 'あめの個数は同じなので、＝ でむすんで方程式にします。', math: `${a}x ＋ ${r1} ＝ ${b}x － ${r2}` },
      { say: '<b>x の項は左の辺に、数の項は右の辺に</b>移項します。移項した項は符号が変わります。', math: [`${a}x － ${b}x ＝ −${r2} － ${r1}`, `${term(a - b, 'x')} ＝ ${numText(-gap)}`] },
      ...divideStep(a - b, -gap, x),
      answerStep(`${x} 人（たしかめ：あめは ${a} × ${x} ＋ ${r1} ＝ ${a * x + r1} 個、${b} × ${x} － ${r2} ＝ ${b * x - r2} 個で同じ）`)
    ] };
}

/* ============================================================
   応用（おうよう）の問題
     中1の範囲のまま、いくつかの手順を組み合わせて考える問題。
     答えは、きほんと同じく必ず整数になるように作る。
     とき方も、問題を作った同じ数から作る。
   ============================================================ */

// 符号つきの差を「＋2」「−1」のように書く
function diffText(v){ return (v < 0 ? '−' : '＋') + Math.abs(v); }

// 仮平均を使って平均を求める
function advMean(){
  const base = pick([50, 60, 70, 80]);
  const d = [rndNz(-9, 9), rndNz(-9, 9), rndNz(-9, 9), rndNz(-9, 9)];
  const r = ((d.reduce((a, b) => a + b, 0) % 5) + 5) % 5;
  let last = (5 - r) % 5;
  if (last === 0) last = 5;
  if (Math.random() < 0.5 && last !== 5) last -= 5;
  d.push(last);
  const nums = d.map(x => base + x), sum = d.reduce((a, b) => a + b, 0), ans = base + sum / 5;
  return { word: true, suffix: '点', answer: ans,
    text: `5人のテストの点数は、次のとおりでした。平均点は何点ですか。<br><span class="num">${nums.join('、')}</span>`,
    steps: [
      { say: '<b>平均 ＝ 合計 ÷ 個数</b>。ただし大きい数をそのままたすのは大変なので、<b>基準（仮平均）を決めて、そこからの差で計算する</b>と速く、まちがいも減ります。' },
      { say: `きりのよい <b>${base}点</b> を基準（仮平均）にして、それぞれが基準より何点多いか（少ないか）を書き出します。`,
        math: nums.map((v, i) => `${v} → ${diffText(d[i])}`) },
      { say: '<b>差の合計</b>を出します。', math: d.map(diffText).join(' ') + ` ＝ ${diffText(sum)}` },
      { say: '<b>差の平均</b>を出します（差の合計 ÷ 5）。', math: `${numText(sum)} ÷ 5 ＝ ${numText(sum / 5)}` },
      { say: '<b>基準 ＋ 差の平均</b> が、もとの平均です。', math: `${base} ＋ (${numText(sum / 5)}) ＝ ${ans}` },
      answerStep(`${ans} 点`)
    ] };
}

// 四則の混じった長い式
function advLong(){
  const a = rndNz(-12, 12), b = pick([2, 3, 4, -2, -3, -4]), c = rndNz(-4, 4), n = pick([2, 2, 3]);
  const e = rndNz(-6, 6), q = rndNz(-6, 6);
  const cn = Math.pow(c, n), mul = b * cn, div = q, v = a - mul + div;
  const text = `${numText(a)} － ${signed(b)} × ${signed(c)}${sup(n)} ＋ ${signed(e * q)} ÷ ${signed(e)}`;
  return { answer: v, text, steps: [
    { say: '<b>計算の順番は ① 累乗・かっこの中 → ② かけ算・わり算 → ③ たし算・ひき算</b>。先に順番を決めてから計算します。' },
    { say: `まず累乗。<b>${signed(c)}${sup(n)} は ${numText(c)} を ${n} 回かける</b>という意味です。${signNote(Array(n).fill(c))}`,
      math: `${signed(c)}${sup(n)} ＝ ${numText(cn)}` },
    { say: `つぎに かけ算。${signNote([b, cn])}`, math: `${signed(b)} × ${parenN(cn)} ＝ ${numText(mul)}` },
    { say: `つぎに わり算。${signNote([e * q, e])}`, math: `${signed(e * q)} ÷ ${signed(e)} ＝ ${numText(div)}` },
    { say: '残ったたし算・ひき算を、左から順に計算します。<b>ひき算は、ひく数の符号を変えてたし算に直す</b>とまちがえにくいです。',
      math: [`${numText(a)}${tail(-mul)}${tail(div)}`, `＝ ${numText(a - mul)}${tail(div)}`, `＝ ${numText(v)}`] },
    answerStep(`${numText(v)}`)
  ] };
}

// 規則性を式にする
function advRule(){
  const kind = pick(['square', 'triangle', 'dot']);
  const n = pick([10, 12, 15, 20, 25, 30]);
  // n0 … 最初の例が「n ＝ いくつ」のときか（碁石は1辺2個から始まる）
  const SET = {
    square:   { unit:'本', a:3, b:1,  n0:1, first:[4, 7, 10], say:'正方形を横に1つならべると4本、2つで7本、3つで10本' },
    triangle: { unit:'本', a:2, b:1,  n0:1, first:[3, 5, 7],  say:'三角形を横に1つならべると3本、2つで5本、3つで7本' },
    dot:      { unit:'個', a:4, b:-4, n0:2, first:[4, 8, 12], say:'1辺に2個の正方形の形にならべると4個、1辺3個で8個、1辺4個で12個' }
  };
  const s = SET[kind], N = kind === 'dot' ? n : n, ans = s.a * N + s.b;
  const q = kind === 'dot'
    ? `碁石を、正方形のふちにそってならべます。${s.say}です。<b>1辺に ${N} 個</b>ならべるとき、碁石は全部で何個必要ですか。`
    : `マッチ棒で、同じ形を横にならべていきます。${s.say}です。<b>${N} 個</b>ならべるとき、マッチ棒は何本必要ですか。`;
  return { word: true, suffix: s.unit, answer: ans,
    text: `${q}`,
    steps: [
      { say: '<b>まず、いくつずつ増えているかを調べます</b>。ならべる数が1つ増えるごとに、いくつ増えるかを見ます。',
        math: `${s.first[0]} → ${s.first[1]} → ${s.first[2]}（${diffText(s.a)} ずつ増える）` },
      { say: `<b>増える数が、n にかける数</b>になります。ここでは ${s.a} ずつ増えるので <b>${s.a}n</b>。`,
        math: `n ＝ ${s.n0} のとき ${s.a} × ${s.n0} ＝ ${s.a * s.n0}` },
      { say: `n ＝ ${s.n0} のときの本当の数は ${s.first[0]}${s.unit} なので、<b>${s.a}n との差 ${diffText(s.b)}</b> をつけ足します。これで式ができました。`,
        math: `${s.a}n${tail(s.b)}` },
      { say: `式の n に ${N} を入れて計算します。`, math: `${s.a} × ${N}${tail(s.b)} ＝ ${s.a * N}${tail(s.b)} ＝ ${ans}` },
      answerStep(`${ans} ${s.unit}`)
    ] };
}

// 式を簡単にしてから代入する
function advDist(){
  const x = rndNz(-6, 6), a = pick([2, 3, 4, -2, -3]), b = pick([2, 3, 4]), c = rndNz(-9, 9), d = pick([2, 3, 4, -2, -3]), e = rndNz(-9, 9);
  const cx = a * b - d, cn = a * c - d * e, v = cx * x + cn;
  const X = parenN(x);
  const part2 = (d < 0 ? ' ＋ ' + Math.abs(d) : ' － ' + d) + `(x${tail(e)})`;
  return { answer: v,
    text: `<small>x ＝ ${numText(x)} のとき</small>${numText(a)}(${b}x${tail(c)})${part2}`,
    steps: [
      { say: '<b>代入する前に、式を簡単にする</b>と計算がぐっと楽になり、まちがいも減ります。' },
      { say: '<b>かっこの前の数を、かっこの中のすべての項にかけます</b>（分配法則）。うしろのかっこは、前が「−」なので<b>符号が変わる</b>ことに注意。',
        math: [`${numText(a)} × ${b}x ＝ ${term(a * b, 'x')}`, `${numText(a)} × ${parenN(c)} ＝ ${numText(a * c)}`,
               `${numText(-d)} × x ＝ ${term(-d, 'x')}`, `${numText(-d)} × ${parenN(e)} ＝ ${numText(-d * e)}`] },
      { say: '<b>同じ文字どうし、数どうしをまとめます</b>（同類項をまとめる）。',
        math: `${term(a * b, 'x')}${tailTerm(-d, 'x')}${tail(a * c)}${tail(-d * e)} ＝ ${term(cx, 'x')}${cn ? tail(cn) : ''}` },
      { say: `簡単にした式の x に ${numText(x)} を入れます。` + (x < 0 ? '<b>負の数を入れるときは、かっこ（ ）をつけます</b>。' : ''),
        math: `${times(cx, X)}${cn ? tail(cn) : ''} ＝ ${numText(cx * x)}${cn ? tail(cn) : ''} ＝ ${numText(v)}` },
      answerStep(`${numText(v)}`)
    ] };
}

// 方程式の文章題（式を立てるところから）
function advEqWord(){
  const kind = pick(['kabusoku', 'oikake', 'nenrei']);
  if (kind === 'kabusoku'){
    const p = rnd(3, 6), r1 = rnd(2, 9), r2 = rnd(2, 9), x = r1 + r2, total = p * x + r1;
    return { word: true, suffix: '人', answer: x, prefix: 'x ＝',
      text: `あめを子どもに配ります。1人に ${p} 個ずつ配ると ${r1} 個あまり、1人に ${p + 1} 個ずつ配ると ${r2} 個たりません。子どもの人数を求めましょう。`,
      steps: [
        { say: '<b>求めたいものを x とおきます</b>。ここでは<b>子どもの人数を x 人</b>とします。' },
        { say: '<b>どちらの配り方でも、あめの数は同じ</b>。これが等式を作る手がかりです。あめの数を2通りで表します。',
          math: [`${p} 個ずつ：${p}x ＋ ${r1}`, `${p + 1} 個ずつ：${p + 1}x － ${r2}`] },
        { say: 'あめの数が等しいので、＝ で結びます。', math: `${p}x ＋ ${r1} ＝ ${p + 1}x － ${r2}` },
        { say: '<b>x をふくむ項は左、数だけの項は右</b>に移項します（移項すると符号が変わります）。',
          math: [`${p}x － ${p + 1}x ＝ ${numText(-r2)} － ${r1}`, `${term(-1, 'x')} ＝ ${numText(-x)}`] },
        { say: '両方の辺を −1 でわります。', math: `x ＝ ${x}` },
        { say: `たしかめ：${p} 個ずつなら ${p} × ${x} ＋ ${r1} ＝ ${total} 個、${p + 1} 個ずつなら ${p + 1} × ${x} － ${r2} ＝ ${total} 個。どちらも同じになりました。` },
        answerStep(`${x} 人`)
      ] };
  }
  if (kind === 'oikake'){
    const T = pick([[60, 100, 8, 12], [50, 80, 9, 15], [60, 90, 10, 20], [80, 100, 6, 24], [70, 105, 8, 16]]);
    const [a, b, t, y] = T;
    return { word: true, suffix: '分後', answer: y, prefix: 'x ＝',
      text: `弟が分速 ${a} m で家を出発しました。その ${t} 分後に、兄が分速 ${b} m で同じ道を追いかけました。兄は出発してから何分後に弟に追いつきますか。`,
      steps: [
        { say: '<b>求めたいものを x とおきます</b>。ここでは<b>兄が出発してから追いつくまでを x 分</b>とします。' },
        { say: '<b>追いついたとき、2人が進んだ道のりは同じ</b>。これが等式を作る手がかりです。<b>道のり ＝ 速さ × 時間</b>で表します。',
          math: [`兄：${b} × x`, `弟：${a} × (x ＋ ${t})　← ${t} 分早く出ているので時間が長い`] },
        { say: '道のりが等しいので、＝ で結びます。', math: `${b}x ＝ ${a}(x ＋ ${t})` },
        { say: '右の辺のかっこをはずします（分配法則）。', math: `${b}x ＝ ${a}x ＋ ${a * t}` },
        { say: '<b>x をふくむ項を左に移項</b>して、まとめます。', math: [`${b}x － ${a}x ＝ ${a * t}`, `${b - a}x ＝ ${a * t}`] },
        { say: `両方の辺を ${b - a} でわります。`, math: `x ＝ ${a * t} ÷ ${b - a} ＝ ${y}` },
        { say: `たしかめ：兄は ${b} × ${y} ＝ ${b * y} m、弟は ${a} × (${y} ＋ ${t}) ＝ ${a * (y + t)} m。同じ道のりになりました。` },
        answerStep(`${y} 分後`)
      ] };
  }
  let y, k, c, f, guard = 0;
  do {
    y = rnd(2, 15); k = pick([2, 3]); c = rnd(8, 14); f = k * (c + y) - y;
    guard++;
  } while ((f < 28 || f > 55) && guard < 50);
  return { word: true, suffix: '年後', answer: y, prefix: 'x ＝',
    text: `今、父は ${f} 歳、子どもは ${c} 歳です。父の年れいが子どもの年れいの ${k} 倍になるのは、何年後ですか。`,
    steps: [
      { say: '<b>求めたいものを x とおきます</b>。ここでは<b>x 年後</b>とします。' },
      { say: '<b>x 年後には、2人とも同じだけ年をとる</b>のがポイントです。x 年後の年れいを表します。',
        math: [`父：${f} ＋ x`, `子ども：${c} ＋ x`] },
      { say: `「父が子どもの ${k} 倍」を式にします。<b>「〜の${k}倍」は、子どものほうに ${k} をかける</b>ことに注意。`,
        math: `${f} ＋ x ＝ ${k}(${c} ＋ x)` },
      { say: '右の辺のかっこをはずします。', math: `${f} ＋ x ＝ ${k}x ＋ ${k * c}` },
      { say: '<b>x を左、数を右に移項</b>してまとめます。', math: [`x － ${k}x ＝ ${k * c} － ${f}`, `${term(1 - k, 'x')} ＝ ${k * c - f}`] },
      { say: `両方の辺を ${numText(1 - k)} でわります。`, math: `x ＝ ${numText(k * c - f)} ÷ ${parenN(1 - k)} ＝ ${y}` },
      { say: `たしかめ：${y} 年後、父は ${f + y} 歳、子どもは ${c + y} 歳。${c + y} × ${k} ＝ ${(c + y) * k} で、たしかに ${k} 倍です。` },
      answerStep(`${y} 年後`)
    ] };
}

// 比例式
function advRatio(){
  const gcd = (m, n) => n ? gcd(n, m % n) : m;
  let d, c, guard = 0;
  do { d = rnd(2, 9); c = rnd(2, 9); guard++; } while (gcd(c, d) !== 1 && guard < 60);   // これ以上約分できない比にする
  const k = rnd(2, 6), a = d * k, x = k * c;
  return { answer: x, prefix: 'x ＝',
    text: `x : ${a} ＝ ${c} : ${d}`,
    steps: [
      { say: '<b>a : b ＝ c : d のとき、外側どうしの積と、内側どうしの積は等しくなります（a × d ＝ b × c）</b>。' },
      { say: '外側は x と ' + d + '、内側は ' + a + ' と ' + c + ' です。積が等しいので、式にします。',
        math: `x × ${d} ＝ ${a} × ${c}` },
      { say: '右の辺を計算します。', math: `${d}x ＝ ${a * c}` },
      { say: `両方の辺を ${d} でわります。`, math: `x ＝ ${a * c} ÷ ${d} ＝ ${x}` },
      { say: `たしかめ：${x} : ${a} は、どちらも ${k} でわると ${c} : ${d} になります。` },
      answerStep(`x ＝ ${x}`)
    ] };
}

/* ---- レベル（きほん／おうよう）。5つのアプリで共通 ----
   おうよう は、中1の範囲のまま「手順を組み合わせて考える」問題を出す。
   答えが必ず整数になるきまりは、おうよう でも変わらない。 */
const LEVEL_KEY = 'study-drill-level';   // 5教科で共通（教科をまたいでも同じレベルで始められる）
function getLevel(){
  // なにも えらんでいないときは「じどう」。じどうは、分野ごとに ちょうどよい難しさに合わせる
  try {
    const v = localStorage.getItem(LEVEL_KEY);
    return (v === 'adv' || v === 'basic') ? v : 'auto';
  } catch (e) { return 'auto'; }
}
function setLevel(v){ try { localStorage.setItem(LEVEL_KEY, v); } catch (e) {} }
// 応用の問題を1つ作って、項目（item）と名前（label）をつける
function makeAdv(unit){
  const fs = ADV[unit.id] || [];
  if (!fs.length) return makeOne(unit);      // 応用を用意していない分野は、きほんを出す
  return advQuestion(pick(fs), unit.id);
}
function advQuestion(f, unitId){
  const q = f();
  q.unit = unitId;
  q.adv = true;
  q.item = 'a:' + f.name;
  q.label = ADV_LABEL[f.name] || f.name;
  return q;
}
// 応用の問題を、名前から引けるようにする（復習で作りなおすときに使う）
const ADV_ALL = {};
Object.keys(ADV).forEach(u => ADV[u].forEach(f => { ADV_ALL[f.name] = u; }));
function regenAdv(key){
  const name = key.slice(2), u = ADV_ALL[name];
  if (!u) return null;
  const f = (ADV[u] || []).filter(x => x.name === name)[0];
  return f ? advQuestion(f, u) : null;
}

const UNITS = [
  { id:'addsub', mark:'±', name:'正負の数（たし算・ひき算）', hint:'(−7) ＋ (＋3) など', gen:genAddSub },
  { id:'muldiv', mark:'×', name:'正負の数（かけ算・わり算）', hint:'累乗・四則の混じった式も', gen:genMulDiv },
  { id:'expr',   mark:'x', name:'文字と式（式の値）',         hint:'x に数を代入して計算', gen:genExprValue },
  { id:'eq',     mark:'＝', name:'一次方程式',                 hint:'x を求める（答えは整数）', gen:genEquation },
  { id:'mix',    mark:'∞', name:'まぜこぜ',                   hint:'4つの単元がまざって出る（まぜると、どの解き方を使うか考える力がつく）', badge:'ふく習におすすめ', gen:null }
];

// 問題の種類の名前（復習ボックスの一覧で見せる）
const KIND_NAME = {
  two:'2つの数のたし算・ひき算', three:'3つの数の計算', word:'文章問題',
  mul:'かけ算', div:'わり算', pow:'累乗', mix:'四則の混じった式',
  linear:'1次式に数を代入', square:'x² のある式に代入', double:'かっこのある式に代入',
  basic:'基本の方程式', both:'両辺に x がある方程式', paren:'かっこのある方程式'
};
function itemLabel(key){
  const [u, k] = key.split(':');
  const unit = UNITS.find(x => x.id === u);
  return (unit ? unit.name : u) + '：' + (KIND_NAME[k] || k);
}
// 1問作って、復習ボックス用の項目（item）と名前（label）をつける
function makeOne(unit){
  curKind = '';
  const q = unit.gen();
  q.unit = unit.id;
  q.item = unit.id + ':' + curKind;
  q.label = itemLabel(q.item);
  return q;
}
// 項目のキーから、同じきまりの新しい問題を作りなおす（復習・もう一度で使う）
function regenFor(key){
  if (key.slice(0, 2) === 'a:') return regenAdv(key);   // 応用の問題は、応用のまま作りなおす
  const unit = UNITS.find(x => x.id === key.split(':')[0]);
  if (!unit || !unit.gen) return null;
  for (let i = 0; i < 80; i++){
    const q = makeOne(unit);
    if (q.item === key) return q;       // 同じ種類が出るまで作りなおす
  }
  return makeOne(unit);                 // 出なければ、その単元の問題でよしとする
}

function makeQuestions(unitId, n, lv){
  const list = [];
  const units = unitId === 'mix' ? UNITS.filter(u => u.gen) : [UNITS.find(u => u.id === unitId)];
  const seen = new Set();
  let guard = 0;
  while (list.length < n && guard < n * 40){
    guard++;
    const u = pick(units);
    const q = useAdv(lv, u.id) ? makeAdv(u) : makeOne(u);
    // 同じ問題が重ならないように。もとになる項目（item）がちがえば、
    // 文言が同じでも別の問題として出す（文章題の「【ア】に入ることばは」など）。
    // タグは消さない（下線の位置だけがちがう問題を、同じとみなさないため）。
    const key = (q.item || '') + '|' + q.text;
    if (seen.has(key)) continue;
    seen.add(key);
    list.push(q);
  }
  return list;
}

const BOX_KEY = 'study-drill-review-math';   // 復習ボックスの記録（この端末だけ）
/* ============================================================
   1-2. 復習ボックス（5つのアプリで共通。まちがえた問題を、日をあけて出しなおす）
      とき方を読むだけでは、記憶に残りにくい（読むと「わかった気」になりやすい）。
      <b>自分の力でもう一度思い出すこと</b>と、<b>間をあけてくり返すこと</b>で、
      記憶はいちばん強くなる（検索練習・分散学習）。そこで、
        ・まちがえた問題の「きまり（項目）」をこの端末に記録する
        ・1日後 → 3日後 → 1週間後 → 16日後 → 35日後 と、間かくをのばして出しなおす
        ・出すのは同じ問題ではなく、同じきまりから作った<b>新しい問題</b>（regenFor）
          問題文ごと覚えてしまうと「解けた気」になるだけで、考え方が身につかないため
        ・正解しても、同じ日のうちは間かくを進めない（間をあけることに意味があるため）
        ・BOX_STEPS ぶん正解できたら、その項目は卒業（記録から消える）
      記録はこの端末（localStorage）だけに残る。Safari のサイトデータを消すと、記録も消える。
   ============================================================ */
const BOX_STEPS = [1, 3, 7, 16, 35];   // 正解するたびに、つぎの復習までの日数をのばす

// 今日が「1970年から何日目か」。時こくを気にせず日づけの計算ができるようにする
function today(){
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return Math.round(d.getTime() / 86400000);
}
let box = null;
function getBox(){
  if (!box){
    try { box = JSON.parse(localStorage.getItem(BOX_KEY)); } catch (e) { box = null; }
    if (!box || typeof box !== 'object') box = {};
  }
  return box;
}
function saveBox(){ try { localStorage.setItem(BOX_KEY, JSON.stringify(getBox())); } catch (e) {} }

// まちがえた → 箱をいちばん最初にもどして、あした もう一度
function boxMiss(q){
  if (!q.item) return;
  const b = getBox(), t = today();
  const it = b[q.item] || (b[q.item] = { n: 0, ng: 0 });
  it.n = 0;
  it.due = t + 1;
  it.d = t;
  it.ng = (it.ng || 0) + 1;
  it.label = q.label || it.label || q.item;
  saveBox();
}
// 正解した → つぎの復習までの間かくをのばす。卒業したら true
function boxHit(q){
  if (!q.item) return false;
  const b = getBox(), t = today(), it = b[q.item];
  if (!it || it.d === t) return false;   // 記録がない、または同じ日にもう進めたときは何もしない
  it.n++;
  it.d = t;
  if (it.n >= BOX_STEPS.length){ delete b[q.item]; saveBox(); return true; }
  it.due = t + BOX_STEPS[it.n];
  saveBox();
  return false;
}
// 今日出す分（間かくが来たもの）。まちがえた回数が多いものを先に
function dueKeys(){
  const b = getBox(), t = today();
  return Object.keys(b).filter(k => b[k].due <= t).sort((x, y) => b[x].due - b[y].due || b[y].ng - b[x].ng);
}
function boxSize(){ return Object.keys(getBox()).length; }
function nextDueDay(){
  const b = getBox(), ds = Object.keys(b).map(k => b[k].due);
  return ds.length ? Math.min(...ds) : null;
}
// 日づけを「今日」「あした」「9月20日」のように表す
function dayText(d){
  const t = today();
  if (d <= t) return '今日';
  if (d === t + 1) return 'あした';
  const dt = new Date();
  dt.setHours(0, 0, 0, 0);
  dt.setDate(dt.getDate() + (d - t));
  return (dt.getMonth() + 1) + '月' + dt.getDate() + '日';
}
// 復習の問題を作る（記録した項目から、新しい問題を作りなおす）
function makeReviewQuestions(n){
  const list = [];
  for (const key of dueKeys()){
    if (list.length >= n) break;
    const q = regenFor(key);
    if (q){ q.item = key; q.review = true; list.push(q); }
  }
  return list;
}
// 結果画面に出す、復習ボックスのようす
function boxStateHTML(grad){
  const next = nextDueDay(), n = boxSize();

const SUBJECT = 'math';                        // 教科のID（記録につける）
const LOG_KEY = 'study-drill-log-math';   // 学習の記録（この端末だけ）

// この教科にある項目（進み具合の分母になる）
const UNIT_KINDS = {
  addsub: ['two', 'three', 'word'],
  muldiv: ['mul', 'div', 'pow', 'mix', 'word'],
  expr:   ['linear', 'square', 'double', 'word'],
  eq:     ['basic', 'both', 'paren', 'word']
};
const ALL_ITEMS = [].concat(...Object.keys(UNIT_KINDS).map(u => UNIT_KINDS[u].map(k => u + ':' + k)))
