<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4F1EA">
<title>中1英語ドリル</title>
<style>
  /* ============================================================
     色の意味は固定する（毎回同じ意味で出てくると、見ただけでわかる）
       正解＝青 / まちがい＝オレンジ / 大事なきまり＝蛍光ペンの黄色 / 次に押すボタン＝こい紺
     赤と緑の組み合わせは使わない（色覚のタイプによって見分けにくいため）
     ============================================================ */
  :root{
    color-scheme:light;
    --bg:#F4F1EA;        /* 紙のような、まぶしすぎない地の色 */
    --surface:#FFFDF9;   /* カード */
    --surface-2:#ECE7DC; /* キーの押した色など */
    --line:#DAD3C5;
    --grid:rgba(60,90,130,.09);
    --ink:#1E2833;       /* 文字（地の色とのコントラスト 約13:1） */
    --ink-2:#5A6472;     /* 補足の文字 */
    --faint:#A39C8E;     /* 入力前の「—」など */
    --pen:#22313F;       /* 手書きの線（えんぴつの色） */
    --primary:#1E2833;   /* 次に押すボタン */
    --ok:#2463A8;        /* 正解 */
    --ok-soft:#E2ECF8;
    --ng:#B8570E;        /* まちがい（赤を使わず、あせりをさそわない） */
    --ng-soft:#FAEBDC;
    --mark:#FFE27A;      /* 大事なきまり */
    --focus:#2463A8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  [hidden]{display:none!important;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic",system-ui,sans-serif;
    display:flex;justify-content:center;
    overscroll-behavior:none;
    touch-action:manipulation;
    -webkit-text-size-adjust:100%;
  }
  #app{
    width:100%;max-width:480px;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;min-height:100%;
  }
  .num{
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-variant-numeric:tabular-nums;
  }
  button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;}
  button:focus-visible{outline:3px solid var(--focus);outline-offset:2px;}

  /* ---- トップ ---- */
  .title{font-size:1.3rem;font-weight:800;letter-spacing:.04em;margin:8px 0 6px;}
  .lead{color:var(--ink-2);font-size:.9rem;line-height:1.8;margin:0 0 20px;}
  .menu{display:flex;flex-direction:column;gap:10px;}
  .unit{
    background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:16px 18px;text-align:left;display:flex;align-items:center;gap:14px;
    box-shadow:0 1px 2px rgba(30,40,51,.05);
  }
  .unit:active{background:var(--surface-2);}
  .unit b{font-size:1.02rem;font-weight:700;display:block;}
  .unit span{font-size:.8rem;color:var(--ink-2);display:block;margin-top:4px;line-height:1.5;}
  .unit .mark{
    width:40px;height:40px;flex:none;margin:0;border-radius:10px;background:var(--ok-soft);
    display:grid;place-items:center;font-size:1.2rem;font-weight:700;color:var(--ok);
  }
  .unit .badge{
    display:inline-block;margin:0 0 0 8px;padding:1px 8px;border-radius:999px;vertical-align:2px;
    background:var(--mark);color:var(--ink);font-size:.7rem;font-weight:700;
  }
  .count{
    display:flex;align-items:center;gap:8px;margin:22px 0 6px;
    font-size:.84rem;color:var(--ink-2);
  }
  .count button{
    border:1px solid var(--line);border-radius:999px;padding:7px 15px;
    font-size:.84rem;color:var(--ink-2);background:var(--surface);
  }
  .count button[aria-pressed="true"]{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:700;}
  .tip{
    margin:18px 0 0;padding:12px 14px;border-radius:12px;border:1px dashed var(--line);
    background:var(--surface);color:var(--ink-2);font-size:.82rem;line-height:1.8;
  }

  /* ---- 出題 ---- */
  #app.is-quiz{
    height:100vh;height:100dvh;min-height:0;
    padding-top:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom));
    -webkit-user-select:none;user-select:none;
  }
  .bar{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:.82rem;color:var(--ink-2);}
  .bar .quit{padding:5px 12px;border:1px solid var(--line);border-radius:999px;font-size:.78rem;color:var(--ink-2);background:var(--surface);}
  /* 進み具合は1問ずつの区切りで見せる（ゴールが近づくほどやる気が出やすい） */
  .dots{display:flex;gap:4px;margin-top:10px;flex:none;}
  .dots i{flex:1;height:6px;border-radius:3px;background:var(--surface-2);transition:background .3s;}
  .dots i.done{background:#A7AEB8;}
  .dots i.now{background:var(--ink);}
  .main{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;margin-top:10px;}
  .left{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;}
  /* 問題はカードにのせて、いちばん目がいくようにする */
  .q{
    text-align:center;font-size:clamp(1.6rem,7vw,2.4rem);font-weight:700;line-height:1.3;
    letter-spacing:.01em;padding:10px 14px;
    background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(30,40,51,.05);
  }
  .q small{
    display:block;font-size:.85rem;font-weight:500;color:var(--ink-2);margin-bottom:4px;letter-spacing:.02em;
    font-family:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
  }
  .q.word{text-align:left;font-size:1.08rem;font-weight:500;line-height:1.9;letter-spacing:.03em;padding:12px 16px;}
  .q.word .tag{
    display:inline-block;margin-right:8px;padding:1px 9px;border-radius:999px;vertical-align:2px;
    background:var(--surface-2);color:var(--ink-2);font-size:.72rem;font-weight:700;letter-spacing:0;
  }
  .nw{white-space:nowrap;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;}
  .work{flex:1;min-height:150px;display:flex;flex-direction:column;overflow:hidden;}
  .head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.8rem;color:var(--ink-2);}
  .work .head{padding:6px 6px 6px 12px;border-bottom:1px solid var(--line);}
  .tools{display:flex;gap:6px;}
  .tools button{padding:6px 12px;border:1px solid var(--line);border-radius:999px;font-size:.76rem;color:var(--ink-2);background:var(--surface);}
  .tools button[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:700;}
  .ink{position:relative;flex:1;min-height:0;touch-action:none;-webkit-touch-callout:none;}
  .ink canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
  /* 計算スペースは方眼（式の行や位がそろえやすい） */
  .work .ink{
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:28px 28px;
  }

  .right{flex:none;display:flex;flex-direction:column;gap:8px;min-height:0;}
  .answer{display:flex;flex-direction:column;gap:8px;}
  .ans-row{display:flex;align-items:center;gap:10px;}
  .ans-row .pre{font-size:1.5rem;font-weight:700;color:var(--ink-2);flex:none;}
  .ans-row .suf{font-size:1.2rem;font-weight:700;color:var(--ink-2);flex:none;}
  .ans{flex:1;height:96px;}
  .ans::after{content:'';position:absolute;left:16px;right:16px;bottom:22%;border-bottom:2px dashed var(--line);pointer-events:none;}
  .ans .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);font-size:.9rem;pointer-events:none;}
  .read{display:flex;align-items:baseline;justify-content:space-between;gap:12px;min-height:2.6rem;padding:0 4px;}
  .read .label{font-size:.82rem;color:var(--ink-2);}
  .read .val{font-size:2rem;font-weight:700;min-width:2.2ch;text-align:right;border-bottom:3px solid var(--line);padding:0 6px 2px;flex:none;}
  .read .val.empty{color:var(--faint);}
  .read.ok .val{border-color:var(--ok);color:var(--ok);}
  .read.ok .label{color:var(--ok);font-size:1.05rem;font-weight:700;}

  /* ---- テンキー（手書きの予備なので、目立ちすぎないように） ---- */
  .keys{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;}
  .keys button{
    background:var(--surface);border:1px solid var(--line);border-radius:10px;
    height:44px;font-size:1.25rem;font-weight:600;color:var(--ink);
  }
  .keys button:active{background:var(--surface-2);}
  .go{
    flex:none;width:100%;min-height:54px;padding:6px 14px;border-radius:14px;
    background:var(--primary);color:#fff;font-size:1.05rem;font-weight:700;line-height:1.35;
  }
  .go:disabled{background:var(--surface-2);color:var(--faint);}
  .go.ok{background:var(--ok);color:#fff;}
  .go.step{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--primary);}
  .go.next{background:var(--primary);color:#fff;}

  /* ---- 解説 ---- */
  .right.explaining{flex:0 1 auto;max-height:64%;}
  .explain{
    flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--ng);border-radius:14px;
  }
  .ex-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 14px;}
  .ex-top .mine{font-size:.85rem;color:var(--ink-2);}
  .ex-top .mine b{color:var(--ng);font-size:1.15rem;margin-left:6px;}
  .ex-top .correct{font-size:.95rem;font-weight:700;}
  .ex-top .correct b{color:var(--ok);font-size:1.6rem;margin-left:6px;}
  .hint{margin:10px 0 0;padding:9px 12px;border-radius:10px;background:var(--ng-soft);font-size:.88rem;line-height:1.75;}
  .hint b{font-weight:700;}
  .ex-h{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px;}
  .ex-h h3{font-size:.82rem;color:var(--ink-2);font-weight:700;margin:0;}
  .ex-h .all{font-size:.8rem;color:var(--ok);font-weight:600;padding:4px 6px;}
  .steps{list-style:none;margin:0;padding:0;counter-reset:st;display:flex;flex-direction:column;gap:14px;}
  .steps li{counter-increment:st;position:relative;padding-left:34px;animation:rise .25s ease-out;}
  .steps li::before{
    content:counter(st);position:absolute;left:0;top:3px;width:24px;height:24px;border-radius:50%;
    background:var(--primary);color:#fff;font-size:.8rem;font-weight:700;display:grid;place-items:center;
  }
  .steps p{margin:0;font-size:.95rem;line-height:1.85;}
  /* 大事なきまりは蛍光ペン（毎回同じ見た目にして、目に入りやすくする） */
  .steps b{
    font-weight:700;padding:0 2px;
    background:linear-gradient(transparent 58%,var(--mark) 58%);
    -webkit-box-decoration-break:clone;box-decoration-break:clone;
  }
  .steps .m{display:inline-block;margin-top:6px;padding:6px 12px;border-radius:8px;background:var(--bg);font-size:1.2rem;font-weight:600;line-height:1.65;}
  .steps .m span{display:block;}
  /* 数直線の図 */
  .fig{margin:8px 0 0;max-width:440px;}
  .fig figcaption{font-size:.76rem;color:var(--ink-2);margin-bottom:2px;}
  .nl{display:block;width:100%;height:auto;}
  .nl .axis,.nl .tick{stroke:var(--ink-2);stroke-width:1.5;}
  .nl .guide{stroke:var(--line);stroke-width:1.5;stroke-dasharray:4 3;}
  .nl .a1{stroke:var(--ink);stroke-width:3;}
  .nl .h1{fill:var(--ink);}
  .nl .a2{stroke:var(--ok);stroke-width:3;}
  .nl .h2{fill:var(--ok);}
  .nl text{font-family:"Helvetica Neue",Arial,sans-serif;font-size:15px;text-anchor:middle;fill:var(--ink-2);}
  .nl text.s1{fill:var(--ink);font-weight:700;}
  .nl text.s2,.nl text.ans{fill:var(--ok);font-weight:700;}
  @keyframes rise{from{opacity:0;transform:translateY(4px);}}

  /* ---- 結果 ---- */
  .score{text-align:center;padding:26px 0 6px;}
  .score .big{font-size:4.2rem;font-weight:800;line-height:1;}
  .score .big u{text-decoration:none;font-size:1.6rem;color:var(--ink-2);}
  .score .msg{margin:14px auto 0;max-width:30em;font-size:.95rem;line-height:1.85;}
  .score .sub{color:var(--ink-2);font-size:.8rem;margin-top:6px;}
  .review{margin:18px 0 6px;display:flex;flex-direction:column;gap:8px;}
  .review h2{font-size:.84rem;color:var(--ink-2);font-weight:700;margin:0 0 2px;}
  .row{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ng);border-radius:12px;}
  .row summary{
    list-style:none;cursor:pointer;padding:11px 14px;display:flex;justify-content:space-between;
    align-items:center;gap:12px;font-size:1rem;
  }
  .row summary::-webkit-details-marker{display:none;}
  .row summary small{display:block;font-size:.75rem;font-weight:400;color:var(--ink-2);}
  .row summary .wq{font-size:.9rem;line-height:1.7;}
  .row .mine{font-size:.8rem;color:var(--ink-2);text-align:right;line-height:1.5;flex:none;}
  .row .mine b{display:block;color:var(--ok);font-size:1.05rem;font-weight:700;}
  .row .open{display:block;color:var(--ok);font-size:.74rem;font-weight:600;}
  .row[open] .open{visibility:hidden;}
  .row-ex{padding:12px 14px 14px;border-top:1px solid var(--line);}
  .acts{margin-top:auto;padding-top:20px;display:flex;flex-direction:column;gap:9px;}
  .acts button{
    height:54px;border-radius:14px;font-size:.98rem;font-weight:700;
    background:var(--primary);color:#fff;
  }
  .acts button.ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink);font-weight:600;}

  /* ---- iPad などの大きい画面 ---- */
  @media (min-width:700px){
    #app{max-width:620px;padding:32px 28px calc(28px + env(safe-area-inset-bottom));}
    #app.is-quiz{max-width:780px;padding-top:18px;padding-bottom:calc(16px + env(safe-area-inset-bottom));}
    .title{font-size:1.6rem;}
    .lead{font-size:1rem;}
    .unit{padding:20px 22px;}
    .unit b{font-size:1.2rem;}
    .unit span{font-size:.92rem;}
    .unit .mark{width:48px;height:48px;font-size:1.45rem;}
    .unit .badge{font-size:.8rem;}
    .count,.count button{font-size:.95rem;}
    .count button{padding:10px 20px;}
    .tip{font-size:.95rem;}
    .bar{font-size:.95rem;}
    .bar .quit{padding:8px 16px;font-size:.9rem;}
    .dots i{height:8px;}
    .main{gap:12px;margin-top:12px;}
    .left{gap:12px;}
    .q{font-size:2.8rem;padding:14px 18px;}
    .q small{font-size:1.05rem;}
    .q.word{font-size:1.32rem;padding:16px 20px;}
    .q.word .tag{font-size:.82rem;}
    .head{font-size:.92rem;}
    .tools{gap:8px;}
    .tools button{padding:8px 16px;font-size:.9rem;}
    .work .ink{background-size:32px 32px;}
    .ans{height:120px;}
    .ans-row .pre{font-size:2rem;}
    .ans-row .suf{font-size:1.5rem;}
    .read .label{font-size:.95rem;}
    .read.ok .label{font-size:1.25rem;}
    .read .val{font-size:2.4rem;}
    .keys{grid-template-columns:repeat(12,1fr);gap:8px;}
    .keys button{height:54px;font-size:1.5rem;}
    .go{min-height:62px;font-size:1.2rem;}
    .explain{padding:18px 22px;}
    .ex-top .mine{font-size:.95rem;}
    .ex-top .correct{font-size:1.05rem;}
    .ex-top .correct b{font-size:1.9rem;}
    .hint{font-size:1.02rem;}
    .ex-h h3,.ex-h .all{font-size:.95rem;}
    .steps{gap:18px;}
    .steps li{padding-left:40px;}
    .steps li::before{width:28px;height:28px;font-size:.9rem;}
    .steps p{font-size:1.08rem;}
    .steps .m{font-size:1.4rem;}
    .fig{max-width:520px;}
    .fig figcaption{font-size:.85rem;}
    .score .big{font-size:5.5rem;}
    .score .msg{font-size:1.08rem;}
    .score .sub{font-size:.92rem;}
    .review h2{font-size:.95rem;}
    .row summary{font-size:1.25rem;padding:14px 18px;}
    .row summary small{font-size:.85rem;}
    .row summary .wq{font-size:1.02rem;}
    .row .mine{font-size:.9rem;}
    .row .mine b{font-size:1.2rem;}
    .row-ex{padding:14px 18px 18px;}
    .acts button{height:64px;font-size:1.1rem;}
  }
  /* iPad 横向き：左に問題と計算スペース、右に答えと解説 */
  @media (min-width:1000px) and (orientation:landscape){
    #app.is-quiz{max-width:1200px;}
    .main{flex-direction:row;gap:16px;}
    .left{flex:1.4;min-width:0;}
    .q{font-size:2.4rem;}
    .right{flex:1;min-width:0;}
    .right.explaining{flex:1;max-height:none;}
    .ans{height:140px;}
    .keys{grid-template-columns:repeat(3,1fr);}
    .keys button{height:52px;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}

  /* ---- 理科ドリルと共通の部品（選択肢・思い出す問題など） ---- */
  .top-row{display:flex;justify-content:space-between;align-items:center;gap:12px;}
  .switch{
    flex:none;padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);
    color:var(--ink-2);font-size:.8rem;font-weight:600;text-decoration:none;
  }
  .unit .mark{font-size:1.35rem;}
  .q.word .item{
    display:block;margin-top:8px;padding:6px 12px;border-radius:10px;background:var(--bg);
    font-size:1.35em;font-weight:700;text-align:center;
  }
  /* 選択肢 */
  .choices{display:grid;grid-template-columns:1fr;gap:8px;}
  .choice{
    display:flex;align-items:center;gap:12px;min-height:54px;padding:10px 14px;text-align:left;
    background:var(--surface);border:2px solid var(--line);border-radius:12px;font-size:1.02rem;font-weight:600;color:var(--ink);line-height:1.45;
  }
  .choice .key{
    flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;
    background:var(--surface-2);color:var(--ink-2);font-size:.8rem;font-weight:700;font-family:"Helvetica Neue",Arial,sans-serif;
  }
  .choice[aria-pressed="true"]{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary);}
  .choice[aria-pressed="true"] .key{background:var(--primary);color:#fff;}
  .choice:disabled{opacity:1;cursor:default;}
  .choice.is-ok{border-color:var(--ok);background:var(--ok-soft);}
  .choice.is-ok .key{background:var(--ok);color:#fff;}
  .choice.is-ok::after{content:'○ 正しい答え';margin-left:auto;flex:none;color:var(--ok);font-size:.8rem;font-weight:700;}
  .choice.is-ng{border-color:var(--ng);background:var(--ng-soft);}
  .choice.is-ng .key{background:var(--ng);color:#fff;}
  .choice.is-ng::after{content:'きみの答え';margin-left:auto;flex:none;color:var(--ng);font-size:.8rem;font-weight:700;}
  /* 選択肢の問題でまちがえたときは、選択肢も解説も見えるように */
  .right.explaining.is-choice .choices{grid-template-columns:1fr 1fr;}
  .right.explaining.is-choice .choice{min-height:44px;padding:6px 10px;font-size:.9rem;}
  .right.explaining.is-choice .choice::after{display:none;}
  /* 思い出す問題 */
  .recall-box{
    display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;min-height:150px;padding:18px;text-align:center;
    background:var(--surface);border:2px dashed var(--line);border-radius:14px;
  }
  .recall-say{margin:0;font-size:1rem;line-height:1.9;color:var(--ink-2);}
  .recall-say b{color:var(--ink);}
  .recall-label{margin:0;font-size:.8rem;color:var(--ink-2);font-weight:700;}
  .recall-ans{margin:0;font-size:2rem;font-weight:800;color:var(--ok);}
  .recall-q{margin:4px 0 0;font-size:.9rem;color:var(--ink-2);}
  .self{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .self button{min-height:58px;border-radius:14px;font-size:1.02rem;font-weight:700;}
  .self .self-ok{background:var(--ok);color:#fff;}
  .self .self-ng{background:var(--surface);color:var(--ng);box-shadow:inset 0 0 0 2px var(--ng);}
  .ex-top .mine b,.ex-top .correct b{font-family:inherit;}

<div id="app"></div>

<script>
/* ============================================================
   1. 問題を作る部分
      問題は次の形のどれか。どれも { unit, type, text, answer, steps } を持つ。
        type:'choice' … 選択肢から選ぶ（choices に選択肢）
        type:'recall' … 頭の中で思い出してから「答えを見る」を押し、自分で ○× をつける
        type:'write'  … 4本線のマスに英語を書いてから「答えを見る」を押し、お手本とくらべて ○× をつける
        type:'num'    … 数字で答える（手書きかキー）。英語の数の言い方や時こく
      passage があるときは、左がわに英文を表示する（読解）。
      steps は、まちがえたときに見せる「とき方」。{ say: 説明 } の配列。

      英単語や会話表現は乱数だけでは作れないので、理科・社会ドリルと同じく
      きまり（単語・文法のきまり・表現・英文）をデータで持ち、
      出し方・選択肢の組み合わせ・順番を毎回かえて問題を作る。
      文法の問題は、主語と動詞の組み合わせを毎回えらんで文を組み立てるので、同じ文はめったに出ない。
   ============================================================ */

// a以上b以下の整数をランダムに1つ返す
function rnd(a, b){ return Math.floor(Math.random() * (b - a + 1)) + a; }
// 配列からランダムに1つ
function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
// 配列をまぜる
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function numText(n){ return n < 0 ? '−' + Math.abs(n) : String(n); }
function answerStep(s){ return { say: '<b>答え</b>　' + s }; }
// 正しい答えと、まちがいの候補から、選択肢を4つ（足りなければあるだけ）作る
function makeChoices(answer, pool){
  return shuffle([answer, ...shuffle([...new Set(pool.filter(x => x !== answer))]).slice(0, 3)]);
}
// 英文を、読みやすい書体のブロックで見せる
function en(s){ return `<span class="sent">${s}</span>`; }
// 英文の中の ( ) を目立たせる
function blank(s){ return s.replace(/\(\s*\)/, '<span class="bl">(　　　)</span>'); }
// 文のはじめを大文字にする
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

/* ---- 単語 ----
   { w: 英語, j: 意味, c: なかま（選択肢のまちがいは同じなかまから選ぶ）, s: 例文（{} に単語が入る）, sj: 例文の意味 } */

  { w:'soccer',     j:'サッカー',     c:'sport', s:'I play {} on Sundays.', sj:'私は日曜日にサッカーをします。' },
  { w:'baseball',   j:'野球',         c:'sport', s:'He watches {} on TV.', sj:'彼はテレビで野球を見ます。' },

/* ---- 単語の問題 ---- */
function wordSteps(k){
  return [
    { say: `<b class="en">${k.w}</b>：${k.j}。` },
    { say: `例文：${en(k.s.replace('{}', `<u class="tg">${k.w}</u>`))}<span class="mean">${k.sj}</span>` }
  ];
}
function wordQuestion(k){
  k = k || pick(WORDS);
  const pool = WORDS.filter(x => x.c === k.c);
  const id = { item: 'word:' + k.w, label: '単語：' + k.w };
  const r = Math.random();
  if (r < 0.24){   // 英語 → 意味
    return { ...id, unit:'word', type:'choice', answer:k.j, choices:makeChoices(k.j, pool.map(x => x.j)),
      text: `次の英語の意味はどれですか。${en(k.w)}`,
      steps: [...wordSteps(k), answerStep(k.j)] };
  }
  if (r < 0.42){   // 意味 → 英語
    return { ...id, unit:'word', type:'choice', answer:k.w, choices:makeChoices(k.w, pool.map(x => x.w)),
      text: `「${k.j}」を表す英語はどれですか。`,
      steps: [...wordSteps(k), answerStep(k.w)] };
  }
  if (r < 0.58){   // 例文の空所
    return { ...id, unit:'word', type:'choice', answer:k.w, choices:makeChoices(k.w, pool.map(x => x.w)),
      text: `( ) に入る語はどれですか。${en(blank(k.s.replace('{}', '( )')))}<span class="mean">${k.sj}</span>`,
      steps: [...wordSteps(k), answerStep(k.w)] };
  }
  if (r < 0.78 && k.w.length <= 10){   // つづりを書く
    return { ...id, unit:'word', type:'write', answer:k.w, sub:k.j,
      text: `「${k.j}」を英語で、右のマスに書きましょう。${en(blank(k.s.replace('{}', '( )')))}<span class="mean">${k.sj}</span>`,
      steps: [
        { say: 'お手本と、自分の書いた字を1字ずつくらべよう。<b>つづりは、1文字ちがうと別の語</b>になります。' },
        ...wordSteps(k), answerStep(k.w)
      ] };
  }
  return { ...id, unit:'word', type:'recall', answer:k.j,
    text: `次の英語の意味を思い出しましょう。${en(k.w)}`,
    steps: [...wordSteps(k), answerStep(k.j)] };
}

const COMP = [

/* ---- 文法の問題 ----
   主語と動詞を毎回えらんで文を組み立てる。とき方も、同じ数（同じ語）から作る。 */

// 主語をふつうの位置（文のとちゅう）に置くときの形にする
function lower(s){
  if (s === 'I') return 'I';
  return /^(You|He|She|It|We|They|My |The |These )/.test(s) ? s.charAt(0).toLowerCase() + s.slice(1) : s;
}
function beWhy(s){
  if (s.be === 'am') return '主語が <b>I</b> のときは <b>am</b> を使います。';
  if (s.s === 'You') return '主語が <b>you</b> のときは <b>are</b> を使います。';
  return s.third ? '「1人（1つ）」を表す主語なので <b>is</b> を使います。' : '「2人（2つ）以上」を表す主語なので <b>are</b> を使います。';
}

      { say: `主語は <b class="en">${s.s}</b>（${s.j}）。${beWhy(s)}` },

    ] };
}

  return { unit:'bunpo', type:'choice', answer:v.past, choices:makeChoices(v.past, [v.v, v.v3, v.ing]),
    text: `( ) に入る語はどれですか。${en(blank(`${s.s} ( ) ${v.o} yesterday.`))}<span class="mean">${s.j}昨日、${jPast(v.jp)}。</span>`,
    steps: [
      { say: '<b>過ぎたことを表す文では、動詞を過去形にする</b>。過去形は、主語が何であっても同じ形です。' },
      { say: `過去形の作り方：${RP_RULE[v.rp]}ので、<b class="en">${v.v}</b> → <b class="en">${v.past}</b>。` },
      answerStep(v.past)
    ] };
}

// 代名詞（主格・所有格・目的格）
function gPron(){
  const kinds = ['sub', 'poss', 'obj'];
  const p = pick(PRON), kind = pick(p.sub === 'I' ? ['sub', 'poss'] : kinds);
  const forms = [p.sub, p.poss, p.obj, p.own];
  if (kind === 'sub'){
    // 動詞の形は主語に合わせる（選択肢は同じ代名詞の3つの形なので、答えはわからない）
    const sent = p.sub === 'I' ? 'Tom and ( ) are good friends.'
      : `I like music, and ( ) ${p.sub === 'he' || p.sub === 'she' ? 'likes' : 'like'} music, too.`;
    const jj = p.sub === 'I' ? 'トムと私は親友です。' : `私は音楽が好きで、${p.j}も音楽が好きです。`;
    return { unit:'bunpo', type:'choice', answer:p.sub, choices:makeChoices(p.sub, forms),
      text: `( ) に入る語はどれですか。${en(blank(sent))}<span class="mean">${jj}</span>`,
      steps: [
        { say: '代名詞は、文の中での<b>はたらきによって形が変わる</b>。「〜は・〜が」＝主格、「〜の」＝所有格、「〜を・〜に」＝目的格。' },
        { say: `ここは「${p.j}は（が）」にあたるので<b>主格</b>の <b class="en">${p.sub}</b>。` },
        answerStep(p.sub)
      ] };
  }
  if (kind === 'poss'){
    return { unit:'bunpo', type:'choice', answer:p.poss, choices:makeChoices(p.poss, forms),
      text: `( ) に入る語はどれですか。${en(blank('This is ( ) bike.'))}<span class="mean">これは${p.j}の自転車です。</span>`,
      steps: [
        { say: '代名詞は、文の中での<b>はたらきによって形が変わる</b>。「〜は・〜が」＝主格、「〜の」＝所有格、「〜を・〜に」＝目的格。' },
        { say: `ここは名詞（bike）の前で「${p.j}の」を表すので<b>所有格</b>の <b class="en">${p.poss}</b>。` },
        answerStep(p.poss)
      ] };
  }
  return { unit:'bunpo', type:'choice', answer:p.obj, choices:makeChoices(p.obj, forms),
    text: `( ) に入る語はどれですか。${en(blank('I know ( ) very well.'))}<span class="mean">私は${p.j}をよく知っています。</span>`,
    steps: [
      { say: '代名詞は、文の中での<b>はたらきによって形が変わる</b>。「〜は・〜が」＝主格、「〜の」＝所有格、「〜を・〜に」＝目的格。' },
      { say: `ここは動詞（know）のあとで「${p.j}を」を表すので<b>目的格</b>の <b class="en">${p.obj}</b>。` },
      answerStep(p.obj)
    ] };
}

// 語順（日本語に合う英文をえらぶ）
function gOrder(){
  const s = pick(SUBJ), v = pick(VERB.filter(x => x.freq !== false)), adv = pick(ADV_TIME);
  const vp = `${s.third ? v.v3 : v.v} ${v.o}`;
  const right = `${s.s} ${vp} ${adv.e}.`;
  // まちがいの文は、主語か動詞で始まる並べかえだけにする（「毎日、〜」で始まる文は英語でも正しいため）
  const wrongs = [`${s.s} ${adv.e} ${vp}.`, `${cap(vp)} ${lower(s.s)} ${adv.e}.`, `${cap(vp)} ${adv.e} ${lower(s.s)}.`];
  return { unit:'bunpo', type:'choice', answer:right, choices:shuffle([right, ...wrongs]),
    text: `次の日本語に合う英文はどれですか。<span class="item">${s.j}${adv.j}${v.jp}。</span>`,
    steps: [
      { say: '英語の文は <b>主語 → 動詞 → そのほか</b> の順にならぶ。日本語のように順番を自由に変えられません。' },
      { say: `主語は <b class="en">${s.s}</b>、動詞は <b class="en">${s.third ? v.v3 : v.v}</b>、そのあとに <b class="en">${v.o}</b>。<b>「${adv.j}」のような「いつ」を表す語句は、ふつう文の終わり</b>に置きます。` },
      answerStep(right)
    ] };
}

// 数を英語の言い方にする
function spellNum(n){
  if (n < 10) return ONES[n];
  if (n < 20) return TEENS[n - 10];
  if (n < 100) return TENS[Math.floor(n / 10)] + (n % 10 ? '-' + ONES[n % 10] : '');
  return ONES[Math.floor(n / 100)] + ' hundred' + (n % 100 ? ' ' + spellNum(n % 100) : '');
}

// 英語の数 → 数字
function numSpellQuestion(){
  const n = Math.random() < 0.65 ? rnd(13, 99) : rnd(1, 9) * 100 + (Math.random() < 0.5 ? 0 : rnd(1, 99));
  const say = [];
  if (n >= 100){
    say.push({ say: '<b>100 は hundred</b>。「○ hundred」で「○百」を表し、そのあとに残りの数をつづけて言います。', math: `${spellNum(n)} → ${Math.floor(n / 100)} 百 と ${n % 100}` });
  }
  const r = n % 100;
  if (r >= 21 && r % 10 !== 0){
    say.push({ say: '<b>21〜99 は「十の位の語 ＋ ハイフン ＋ 一の位の語」</b>。twenty-one（21）、forty-five（45）のように書きます。', math: `${TENS[Math.floor(r / 10)]}（${Math.floor(r / 10) * 10}）＋ ${ONES[r % 10]}（${r % 10}）＝ ${Math.floor(r / 10) * 10 + r % 10}` });
  } else if (r >= 13 && r <= 19){
    say.push({ say: '<b>13〜19 は teen で終わる</b>（thirteen、fifteen など）。<b>-ty で終わる語（thirty、fifty など）は「〜十」</b>なので、聞きまちがえないように気をつけよう。' });
  }
  return { unit:'hyogen', type:'num', answer:n,
    text: `次の英語が表す数を、数字で書きましょう。${en(spellNum(n))}`,
    steps: [...say, answerStep(String(n))] };
}

// 時こく
function numTimeQuestion(){
  const forms = [
    () => { const h = rnd(1, 12); return { e: `It's ${spellNum(h)} o'clock.`, h, m:0, why:'<b>o\'clock は「ちょうど」</b>を表すので、分は 0 分です。' }; },
    () => { const h = rnd(1, 12), m = rnd(1, 59); return { e: `It's ${spellNum(h)} ${m < 10 ? 'oh ' + spellNum(m) : spellNum(m)}.`, h, m, why:'<b>「時」「分」の数をそのまま続けて読む</b>言い方です。' }; },
    () => { const h = rnd(1, 12); return { e: `It's half past ${spellNum(h)}.`, h, m:30, why:'<b>half は「半（30分）」、past は「〜を過ぎて」</b>。half past 〜 で「〜時30分」。' }; },
    () => { const h = rnd(1, 12); return { e: `It's a quarter past ${spellNum(h)}.`, h, m:15, why:'<b>a quarter は「4分の1（15分）」、past は「〜を過ぎて」</b>。a quarter past 〜 で「〜時15分」。' }; },
    () => { const h = rnd(1, 12), prev = h === 1 ? 12 : h - 1; return { e: `It's a quarter to ${spellNum(h)}.`, h:prev, m:45, why:'<b>to は「〜前」</b>。a quarter to 〜 は「〜時の15分前」なので、<b>1つ前の時こくの45分</b>になります。' }; }
  ];
  const t = pick(forms)();
  const askHour = Math.random() < 0.5;
  return { unit:'hyogen', type:'num', suffix:askHour ? '時' : '分', answer:askHour ? t.h : t.m,
    text: `次の英語は何時何分ですか。<b>${askHour ? '「時」' : '「分」'}</b>の数を数字で書きましょう。${en(t.e)}`,
    steps: [
      { say: '時こくの言い方：<b>o\'clock（ちょうど）／half past 〜（〜時30分）／a quarter past 〜（〜時15分）／a quarter to 〜（〜時の15分前）</b>。' },
      { say: t.why },
      { say: `この文は <b>${t.h} 時 ${t.m} 分</b> を表しています。` },
      answerStep(`${askHour ? t.h + ' 時' : t.m + ' 分'}`)
    ] };
}

function spellWriteQuestion(w){

/* ---- 表現・数の分野の出し方 ---- */
const TYPE_RATE = { num: 0.45, write: 0.15 };   // 「会話表現と数」の分野での割合。のこりは えらぶ・思い出す

function hyogenQuestion(){
  const r = Math.random();
  if (r < TYPE_RATE.num) return tagged(pick(CALC.hyogen), 'num');
  if (r < TYPE_RATE.num + TYPE_RATE.write) return spellWriteQuestion();
  if (r < TYPE_RATE.num + TYPE_RATE.write + 0.1){
    const w = Math.random() < 0.5 ? pick(DAYS) : pick(MONTHS);
    return { unit:'hyogen', type:'recall', answer:w.j, item:'spell:' + w.e, label:'つづり：' + w.e,
      text: `次の英語の意味を思い出しましょう。${en(w.e)}`,
      steps: [{ say: `<b class="en">${w.e}</b>：${w.j}` }, answerStep(w.j)] };
  }
  return talkQuestion();
}

// 文法の問題の名前（復習ボックスの一覧で見せる）
const G_LABEL = {
  gBe:'be動詞', gYesNo:'疑問文への答え方', gVerbS:'一般動詞（3人称単数の s）', gNeg:'否定文', gDo:'疑問文',
  gCan:'can の文', gIng:'現在進行形（ing形）', gPast:'過去形', gPron:'代名詞', gPlural:'名詞の複数形',
  gArticle:'a と an', gPrepTime:'前置詞（とき）', gPrepPlace:'前置詞（場所）', gWh:'疑問詞', gOrder:'語順',
  numSpellQuestion:'英語の数', numOrderQuestion:'曜日・月の順番', numDateQuestion:'日づけ（序数）', numTimeQuestion:'時こく'
};
const FN_ALL = {};
[...BUNPO, ...CALC.hyogen].forEach(f => { FN_ALL[f.name] = f; });
// 文法・数の問題に、項目と名前をつける
function tagged(f, kind){
  const q = f();
  q.item = kind + ':' + f.name;
  q.label = G_LABEL[f.name] || f.name;
  return q;
}
// 復習ボックスの項目から、同じきまりの新しい問題を作りなおす
function regenFor(key){
  if (key.slice(0, 2) === 'a:') return regenAdv(key);   // 応用の問題は、応用のまま作りなおす
  const i = key.indexOf(':'), kind = key.slice(0, i), id = key.slice(i + 1);
  if (kind === 'word'){ const k = WORDS.find(x => x.w === id); return k ? wordQuestion(k) : null; }
  if (kind === 'talk'){ return talkQuestion({ kind:'talk', i:Number(id) }); }
  if (kind === 'phrase'){ return talkQuestion({ kind:'phrase', i:Number(id) }); }
  if (kind === 'spell'){
    const w = DAYS.concat(MONTHS).find(x => x.e === id);
    return w ? spellWriteQuestion(w) : null;
  }
  if (kind === 'read'){
    const at = id.lastIndexOf(':'), p = PASSAGES.find(x => x.title === id.slice(0, at));
    return p ? readingQuestion(p, Math.min(Number(id.slice(at + 1)), p.qs.length - 1)) : null;
  }
  if (kind === 'g' || kind === 'num'){
    const f = FN_ALL[id];
    return f ? tagged(f, kind) : null;
  }
  return null;
}

function genEigo(unit){
  if (unit === 'word') return wordQuestion();
  if (unit === 'bunpo') return tagged(pick(BUNPO), 'g');
  if (unit === 'reading') return readingQuestion();
  return hyogenQuestion();
}

/* ============================================================
   応用（おうよう）の問題
     中1の範囲のまま、文を組み立てたり、書きかえたり、流れを読んだりする問題。
   ============================================================ */

// 文の書きかえ（否定文・疑問文・過去形・現在進行形）
function advRewrite(){
  const s = pick(SUBJ), v = pick(VERB.filter(x => x.freq !== false));
  const adv = pick(ADV_TIME);
  const base = `${s.s} ${s.third ? v.v3 : v.v} ${v.o} ${adv.e}.`;
  const kind = pick(['neg', 'que', 'past', 'ing']);
  const low = lower(s.s);
  if (kind === 'neg'){
    const ans = `${s.s} ${s.third ? "doesn't" : "don't"} ${v.v} ${v.o} ${adv.e}.`;
    const bad = pickBad(ans, [
      `${s.s} ${s.third ? "don't" : "doesn't"} ${v.v} ${v.o} ${adv.e}.`,            // don't と doesn't が逆
      `${s.s} ${s.third ? "doesn't" : "don't"} ${v.v3} ${v.o} ${adv.e}.`,           // 動詞を原形にもどしていない
      `${s.s} ${s.be} not ${s.third ? v.v3 : v.v} ${v.o} ${adv.e}.`                 // be動詞を使ってしまう
    ]);
    return rewriteQ('否定文', base, ans, bad, [
      { say: '一般動詞の否定文は <b>主語 ＋ don\'t（doesn\'t）＋ 動詞の原形</b>。主語が3人称単数のときだけ doesn\'t を使います。' },
      { say: `主語は <b class="en">${s.s}</b>。${s.third ? '3人称単数なので <b>doesn\'t</b>' : '3人称単数ではないので <b>don\'t</b>'}。<b>そのあとの動詞は s をつけない原形（${v.v}）</b>にもどします。` }
    ]);
  }
  if (kind === 'que'){
    const ans = `${s.third ? 'Does' : 'Do'} ${low} ${v.v} ${v.o} ${adv.e}?`;
    const bad = pickBad(ans, [
      `${s.third ? 'Do' : 'Does'} ${low} ${v.v} ${v.o} ${adv.e}?`,                  // Do と Does が逆
      `${s.third ? 'Does' : 'Do'} ${low} ${v.v3} ${v.o} ${adv.e}?`,                 // 動詞を原形にもどしていない
      `${s.be === 'am' ? 'Am' : s.be === 'is' ? 'Is' : 'Are'} ${low} ${s.third ? v.v3 : v.v} ${v.o} ${adv.e}?`  // be動詞を使ってしまう
    ]);
    return rewriteQ('疑問文', base, ans, bad, [
      { say: '一般動詞の疑問文は <b>Do（Does）＋ 主語 ＋ 動詞の原形 〜?</b>。最後は「?」を忘れずに。' },
      { say: `主語は <b class="en">${low}</b>。${s.third ? '3人称単数なので <b>Does</b>' : '3人称単数ではないので <b>Do</b>'}。<b>Do / Does を使ったら、動詞は原形（${v.v}）</b>にもどします。` }
    ]);
  }
  if (kind === 'past'){
    const ans = `${s.s} ${v.past} ${v.o} yesterday.`;
    const bad = pickBad(ans, [
      `${s.s} ${s.third ? v.v3 : v.v} ${v.o} yesterday.`,                 // 現在形のまま
      `${s.s} ${s.be === 'are' ? 'were' : 'was'} ${v.v} ${v.o} yesterday.`, // be動詞をつけてしまう
      `${s.s} ${v.v}ed ${v.o} yesterday.`,                                // きまりどおりに ed をつけてしまう
      `${s.s} ${v.ing} ${v.o} yesterday.`                                 // ing形にしてしまう
    ]);
    return rewriteQ('過去の文（yesterday をつけて）', base, ans, bad, [
      { say: '<b>過ぎたことを表す文では、動詞を過去形にします</b>。過去形は、主語が何であっても同じ形です。' },
      { say: `過去形の作り方：${RP_RULE[v.rp]}ので、<b class="en">${v.v}</b> → <b class="en">${v.past}</b>。` }
    ]);
  }
  const iv = VERB.filter(x => x.ingOk !== false && x.v === v.v)[0] || pick(VERB.filter(x => x.ingOk !== false));
  const ans = `${s.s} ${s.be} ${iv.ing} ${iv.o} now.`;
  const bad = pickBad(ans, [
    `${s.s} ${iv.ing} ${iv.o} now.`,                                            // be動詞がない
    `${s.s} ${s.be} ${iv.v} ${iv.o} now.`,                                      // ing形になっていない
    `${s.s} ${s.be === 'am' ? 'is' : s.be === 'is' ? 'are' : 'is'} ${iv.ing} ${iv.o} now.`,  // be動詞が主語に合っていない
    `${s.s} ${s.third ? iv.v3 : iv.v} ${iv.o} now.`
  ]);
  return rewriteQ('「今〜しています」の文（now をつけて）', `${s.s} ${s.third ? iv.v3 : iv.v} ${iv.o} ${adv.e}.`, ans, bad, [
    { say: '「今、〜しています」は <b>be動詞（am・is・are）＋ 動詞の ing形</b>（現在進行形）。<b>be動詞を忘れない</b>のがこつです。' },
    { say: `主語が <b class="en">${s.s}</b> なので be動詞は <b class="en">${s.be}</b>。ing形の作り方：${RI_RULE[iv.ri]}ので <b class="en">${iv.ing}</b>。` }
  ]);
}
// まちがいの選択肢を、重ならないように3つえらぶ
function pickBad(ans, list){
  return [...new Set(list.filter(x => x !== ans))].slice(0, 3);
}
function rewriteQ(kindName, base, ans, bad, steps){
  return { unit:'bunpo', type:'choice', answer:ans, choices:shuffle([ans, ...bad]),
    text: `次の文を<b>${kindName}</b>に書きかえたものはどれですか。${en(base)}`,
    steps: [...steps, answerStep(ans)] };
}

// 日本語に合う英文を書く

  { id:'hyogen',  mark:'💬', name:'会話表現と数',   hint:'あいさつ・教室の英語、数・曜日・月・時こくの言い方' },
  { id:'reading', mark:'📖', name:'英文を読む',     hint:'短い英文を読んで、内容を読みとる' },
  { id:'mix',     mark:'∞', name:'まぜこぜ',       hint:'4つの分野がまざって出る（まぜると、どの考え方を使うか考える力がつく）', badge:'ふく習におすすめ' }
];

function makeQuestions(unitId, n, lv){
  const list = [];
  const units = unitId === 'mix' ? UNITS.filter(u => u.id !== 'mix').map(u => u.id) : [unitId];
  const seen = new Set();
  let guard = 0;
  while (list.length < n && guard < n * 80){
    guard++;
    const u = pick(units);
    const q = lv === 'adv' ? makeAdv(u) : genEigo(u);
    const key = q.type + q.text.replace(/<[^>]*>/g, '');
    if (seen.has(key)) continue;   // 同じ問題が重ならないように
    seen.add(key);
    list.push(q);
  }
  return list;
}

const BOX_KEY = 'study-drill-review-eigo';   // 復習ボックスの記録（この端末だけ）

/* ============================================================
   1-2. 復習ボックス（5つのアプリで共通。まちがえた問題を、日をあけて出しなおす）
      とき方を読むだけでは、記憶に残りにくい（読むと「わかった気」になりやすい）。
      <b>自分の力でもう一度思い出すこと</b>と、<b>間をあけてくり返すこと</b>で、
      記憶はいちばん強くなる（検索練習・分散学習）。そこで、
        ・まちがえた問題の「きまり（項目）」をこの端末に記録する
        ・1日後 → 3日後 → 1週間後 → 16日後 → 35日後 と、間かくをのばして出しなおす
        ・出すのは同じ問題ではなく、同じきまりから作った<b>新しい問題</b>（regenFor）
          問題文ごと覚えてしまうと「解けた気」になるだけで、考え方が身につかないため
        ・正解しても、同じ日のうちは間かくを進めない（間をあけることに意味があるため）
        ・BOX_STEPS ぶん正解できたら、その項目は卒業（記録から消える）
      記録はこの端末（localStorage）だけに残る。Safari のサイトデータを消すと、記録も消える。
   ============================================================ */
const BOX_STEPS = [1, 3, 7, 16, 35];   // 正解するたびに、つぎの復習までの日数をのばす

// 今日が「1970年から何日目か」。時こくを気にせず日づけの計算ができるようにする
function today(){
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return Math.round(d.getTime() / 86400000);
}
let box = null;
function getBox(){
  if (!box){
    try { box = JSON.parse(localStorage.getItem(BOX_KEY)); } catch (e) { box = null; }
    if (!box || typeof box !== 'object') box = {};
  }
  return box;
}
function saveBox(){ try { localStorage.setItem(BOX_KEY, JSON.stringify(getBox())); } catch (e) {} }

// まちがえた → 箱をいちばん最初にもどして、あした もう一度
function boxMiss(q){
  if (!q.item) return;
  const b = getBox(), t = today();
  const it = b[q.item] || (b[q.item] = { n: 0, ng: 0 });
  it.n = 0;
  it.due = t + 1;
  it.d = t;
  it.ng = (it.ng || 0) + 1;
  it.label = q.label || it.label || q.item;
  saveBox();
}
// 正解した → つぎの復習までの間かくをのばす。卒業したら true
function boxHit(q){
  if (!q.item) return false;
  const b = getBox(), t = today(), it = b[q.item];
  if (!it || it.d === t) return false;   // 記録がない、または同じ日にもう進めたときは何もしない
  it.n++;
  it.d = t;
  if (it.n >= BOX_STEPS.length){ delete b[q.item]; saveBox(); return true; }
  it.due = t + BOX_STEPS[it.n];
  saveBox();
  return false;
}
// 今日出す分（間かくが来たもの）。まちがえた回数が多いものを先に
function dueKeys(){
  const b = getBox(), t = today();
  return Object.keys(b).filter(k => b[k].due <= t).sort((x, y) => b[x].due - b[y].due || b[y].ng - b[x].ng);
}
function boxSize(){ return Object.keys(getBox()).length; }
function nextDueDay(){
  const b = getBox(), ds = Object.keys(b).map(k => b[k].due);
  return ds.length ? Math.min(...ds) : null;
}
// 日づけを「今日」「あした」「9月20日」のように表す
function dayText(d){
  const t = today();
  if (d <= t) return '今日';
  if (d === t + 1) return 'あした';
  const dt = new Date();
  dt.setHours(0, 0, 0, 0);
  dt.setDate(dt.getDate() + (d - t));
  return (dt.getMonth() + 1) + '月' + dt.getDate() + '日';
}
// 復習の問題を作る（記録した項目から、新しい問題を作りなおす）
function makeReviewQuestions(n){
  const list = [];
  for (const key of dueKeys()){
    if (list.length >= n) break;
    const q = regenFor(key);
    if (q){ q.item = key; q.review = true; list.push(q); }
  }
  return list;
}
// トップ画面のいちばん上に出す「今日の復習」
function reviewHomeHTML(){
  const n = dueKeys().length, next = nextDueDay();
  if (n) return `
    <button class="review-btn" id="go-review">
      <span class="mark">⟳</span>
      <span><b>今日の復習　${n}問</b><i>まちがえた問題を、わすれたころに出しています。同じきまりの新しい問題です。</i></span>
    </button>`;
  if (next !== null) return `<p class="review-none">今日の復習はおわりました。<i>つぎの復習は ${dayText(next)}（${boxSize()}問）。それまでは、新しい問題にちょうせんしよう。</i></p>`;
  return '';
}
// 結果画面に出す、復習ボックスのようす
function boxStateHTML(grad){
  const next = nextDueDay(), n = boxSize();
  const g = grad ? `<b>${grad}問</b>が復習ボックスを卒業しました（${BOX_STEPS.length}回、間をあけて正解できました）。<br>` : '';
  if (!n) return `<p class="box-state">${g}復習ボックスは空です。まちがえた問題は、ここに入って あした からもう一度出ます。</p>`;
  return `<p class="box-state">${g}復習ボックス：<b>${n}問</b>／つぎの復習は <b>${dayText(next)}</b>。<br>同じ日にくり返すより、<b>日をあけて思い出す</b>ほうが忘れにくくなります。</p>`;
}

/* ============================================================
   1-3. 学習の記録と送信（5つのアプリで共通）
      子どもの「がんばりの記録」（kiroku.html）と保護者ページ（oya.html）で使う。
        ・記録はこの端末（localStorage）に残す。ドリル本体はこれまでどおりオフラインで動く。
        ・送信先（Google Apps Script の URL）を設定したときだけ、記録を送る。
          設定していなければ、送るものをためておくだけで、動きは何も変わらない。
        ・送信は勉強のじゃまをしない（失敗しても、次に成功したときにまとめて送る）。
      記録するのは学習の中身だけ。名前などの個人情報は入れない。
   ============================================================ */
const LOG_VER = 1;
let log = null;
function getLog(){
  if (!log){
    try { log = JSON.parse(localStorage.getItem(LOG_KEY)); } catch (e) { log = null; }
    if (!log || typeof log !== 'object') log = {};
  }
  if (!Array.isArray(log.ses)) log.ses = [];    // 1回ごと：[日, 分野, 復習か, 出題数, 正解数, 秒]
  if (!log.item || typeof log.item !== 'object') log.item = {};   // 項目ごと：[出題数, 正解数, まちがい, 最後の日, 卒業した日, 分野]
  if (!log.label || typeof log.label !== 'object') log.label = {};
  log.v = LOG_VER;
  log.total = ALL_ITEMS.length;                 // この教科の項目の総数（進み具合の分母）
  return log;
}
function saveLog(){ try { localStorage.setItem(LOG_KEY, JSON.stringify(getLog())); } catch (e) {} }

// 1問ごとの記録（grad は、この正解で復習ボックスを卒業したかどうか）
function logQuestion(q, ok, grad){
  if (!q.item) return;
  const L = getLog(), t = today();
  const r = L.item[q.item] || (L.item[q.item] = [0, 0, 0, 0, 0, '']);
  r[0]++;
  if (ok) r[1]++; else r[2]++;
  r[3] = t;
  if (grad) r[4] = t;
  r[5] = q.unit || r[5] || '';
  L.label[q.item] = q.label || q.item;
  saveLog();
  queueRow(['i', SUBJECT, q.item, L.label[q.item], r[0], r[1], r[2], r[3], r[4], r[5]]);
}
// 1回ぶんの記録
function logSession(unit, mode, n, right, ms){
  const L = getLog(), t = today(), sec = Math.round(ms / 1000), rv = mode === 'review' ? 1 : 0;
  L.ses.push([t, unit, rv, n, right, sec]);
  saveLog();
  queueRow(['s', SUBJECT, t, unit, rv, n, right, sec]);
  queueRow(['t', SUBJECT, ALL_ITEMS.length]);
  syncFlush();
}

/* ---- 送信（設定したときだけ動く）---- */
const SYNC_KEY = 'study-drill-sync';   // 送信先の設定と、まだ送れていない記録（5教科で共通）
function getSync(){
  let s = null;
  try { s = JSON.parse(localStorage.getItem(SYNC_KEY)); } catch (e) { s = null; }
  if (!s || typeof s !== 'object') s = {};
  if (!Array.isArray(s.q)) s.q = [];
  return s;
}
function saveSync(s){ try { localStorage.setItem(SYNC_KEY, JSON.stringify(s)); } catch (e) {} }
// 送るものをためる。項目の記録は「最新の状態」だけでよいので、同じ項目の古い行は消す
function queueRow(row){
  const s = getSync();
  if (row[0] === 'i' || row[0] === 't'){
    s.q = s.q.filter(r => !(r[0] === row[0] && r[1] === row[1] && r[2] === row[2]));
  }
  s.q.push(row);
  if (s.q.length > 4000) s.q = s.q.slice(-4000);   // 増えすぎたら古いものから捨てる
  saveSync(s);
}
// たまっている記録を送る。勉強の動きは止めない（失敗しても、次のときにまた送る）
function syncFlush(){
  const s = getSync();
  if (!s.url || !s.q.length) return;
  if (typeof navigator !== 'undefined' && navigator.onLine === false) return;
  const rows = s.q.slice(0, 500);
  const body = JSON.stringify({ k: s.key || '', name: s.name || '', rows });
  const done = () => {
    const t = getSync();
    t.q = t.q.slice(rows.length);
    t.at = Date.now();
    saveSync(t);
  };
  try {
    // ふつうに送って、返事が読めたら成功。読めないとき（CORS）は no-cors でもう一度送る
    fetch(s.url, { method: 'POST', body })
      .then(r => { if (r.ok) done(); })
      .catch(() => fetch(s.url, { method: 'POST', mode: 'no-cors', body }).then(done).catch(() => {}));
  } catch (e) {}
}

/* ============================================================
   2. 手書き数字の読みとり（数学ドリルと同じしくみ。英語の数や時こくの問題で使う）
      数字の見本の形と、書いた線を「点の集まり」にしてくらべ、
      いちばん近い数字を選ぶ（$P Point-Cloud Recognizer という方法）。
      読みまちがえた字をキーで直すと、その形を見本に追加して覚える。
   ============================================================ */
const INK_N = 32;             // 1文字を何個の点でくらべるか
const INK_LIMIT = 9;          // これより遠い形は「読みとれない」にする
const INK_KEY = 'math-drill-ink';

// 見本の形を作る部品（横0〜0.7、たて0〜1の枠で考える。角度は右が0°、下が90°）
function arc(cx, cy, rx, ry, t0, t1){
  const pts = [];
  for (let k = 0; k <= 24; k++){
    const t = (t0 + (t1 - t0) * k / 24) * Math.PI / 180;
    pts.push({ x: cx + rx * Math.cos(t), y: cy + ry * Math.sin(t) });
  }
  return pts;
}
function line(...xy){
  const pts = [];
  for (let k = 0; k < xy.length; k += 2) pts.push({ x: xy[k], y: xy[k + 1] });
  return pts;
}
// 数字ごとの書き方のパターン。[ 1画目, 2画目, … ]、1画は部品をつなげたもの
const SHAPES = {
  '0': [ [[arc(.35, .5, .33, .5, 270, 630)]], [[arc(.35, .5, .22, .5, 250, 610)]] ],
  '1': [ [[line(.35, 0, .35, 1)]], [[line(.22, .14, .4, 0, .4, 1)]], [[line(.22, .14, .4, 0, .4, 1)], [line(.12, 1, .68, 1)]] ],
  '2': [ [[arc(.35, .3, .32, .3, 190, 360), line(.67, .3, .02, 1, .7, 1)]], [[arc(.35, .3, .32, .3, 200, 400), line(.02, 1, .7, 1)]] ],

function dist(p, q){ return Math.hypot(p.x - q.x, p.y - q.y); }

// 何画かの線を、INK_N 個の点に並べなおして、大きさと位置をそろえる
function cloud(strokes){
  const pts = [];
  strokes.forEach((s, id) => s.forEach(p => pts.push({ x: p.x, y: p.y, id })));
  let L = 0;
  for (let i = 1; i < pts.length; i++) if (pts[i].id === pts[i - 1].id) L += dist(pts[i - 1], pts[i]);
  const I = L / (INK_N - 1), out = [{ x: pts[0].x, y: pts[0].y }];
  let D = 0;
  for (let i = 1; I > 0 && i < pts.length; i++){
    if (pts[i].id !== pts[i - 1].id) continue;
    const d = dist(pts[i - 1], pts[i]);
    if (D + d >= I && d > 0){
      const t = (I - D) / d;
      const q = { x: pts[i - 1].x + t * (pts[i].x - pts[i - 1].x), y: pts[i - 1].y + t * (pts[i].y - pts[i - 1].y), id: pts[i].id };
      out.push(q);
      pts.splice(i, 0, q);
      D = 0;
    } else D += d;
  }
  const last = pts[pts.length - 1];
  while (out.length < INK_N) out.push({ x: last.x, y: last.y });
  out.length = INK_N;

  const xs = out.map(p => p.x), ys = out.map(p => p.y);
  const minX = Math.min(...xs), minY = Math.min(...ys);
  const size = Math.max(Math.max(...xs) - minX, Math.max(...ys) - minY) || 1;
  out.forEach(p => { p.x = (p.x - minX) / size; p.y = (p.y - minY) / size; });
  const cx = out.reduce((s, p) => s + p.x, 0) / INK_N, cy = out.reduce((s, p) => s + p.y, 0) / INK_N;
  return out.map(p => ({ x: p.x - cx, y: p.y - cy }));
}

function cloudDist(a, b, start, stop){
  const used = new Array(INK_N).fill(false);
  let sum = 0, i = start;
  do {
    let min = Infinity, idx = 0;
    for (let j = 0; j < INK_N; j++){
      if (used[j]) continue;
      const d = dist(a[i], b[j]);
      if (d < min){ min = d; idx = j; }
    }
    used[idx] = true;
    sum += (1 - ((i - start + INK_N) % INK_N) / INK_N) * min;
    if (sum >= stop) return sum;
    i = (i + 1) % INK_N;
  } while (i !== start);
  return sum;
}
function cloudDistance(a, b, stop){
  let best = stop;
  for (let i = 0; i < INK_N; i += Math.floor(Math.sqrt(INK_N))){
    best = Math.min(best, cloudDist(a, b, i, best), cloudDist(b, a, i, best));
  }
  return best;
}

// 覚えた形（localStorage が使えないときも、開いている間は覚えておく）
let learned = null;
function getLearned(){
  if (!learned){
    try { learned = JSON.parse(localStorage.getItem(INK_KEY)) || {}; } catch (e) { learned = {}; }
  }
  return learned;
}
let templates = null;
function getTemplates(){
  if (templates) return templates;
  templates = [];
  for (const label in SHAPES){
    SHAPES[label].forEach(v => templates.push({ label, pts: cloud(v.map(pieces => [].concat(...pieces))) }));
  }
  const l = getLearned();
  for (const label in l){
    l[label].forEach(pts => templates.push({ label, pts: pts.map(([x, y]) => ({ x, y })) }));
  }
  return templates;
}
// 読みまちがえた字の形を覚える（数字ごとに新しい5個まで）
function learn(label, pts){
  const l = getLearned();
  l[label] = (l[label] || []).concat([pts.map(p => [+p.x.toFixed(3), +p.y.toFixed(3)])]).slice(-5);
  try { localStorage.setItem(INK_KEY, JSON.stringify(l)); } catch (e) {}
  templates = null;
}

function classify(strokes){
  const pts = cloud(strokes);
  let best = '?', bestD = INK_LIMIT * 2;
  for (const t of getTemplates()){
    const d = cloudDistance(pts, t.pts, bestD);
    if (d < bestD){ bestD = d; best = t.label; }
  }
  return { label: bestD < INK_LIMIT ? best : '?', d: bestD, pts };
}

// となりあう線のまとまり（run）を1文字として読み、読みにくさ（cost）をつける
function readChar(run, ref, first){
  const flat = g => g.maxX - g.minX > (g.maxY - g.minY) * 2 && g.maxY - g.minY < ref * 0.3;
  const minX = Math.min(...run.map(g => g.minX)), maxX = Math.max(...run.map(g => g.maxX));
  const minY = Math.min(...run.map(g => g.minY)), maxY = Math.max(...run.map(g => g.maxY));
  const w = maxX - minX, h = maxY - minY;
  const strokes = [].concat(...run.map(g => g.strokes));
  let merge = 0;
  if (run.length === 1){
    if (Math.max(w, h) < ref * 0.12) return { label: '', cost: 0 };                  // ペン先がふれただけの点
    if (flat(run[0])) return first ? { label: '-', cost: 1, pts: null } : { label: '?', cost: INK_LIMIT, pts: null };  // 横線は「−」
  } else {
    if (run.some(flat)) return null;
    let right = run[0].maxX;
    for (const g of run.slice(1)){
      if (g.minX - right > ref * 0.2) return null;                                  // はなれすぎた線は、同じ字にしない
      right = Math.max(right, g.maxX);
    }
    if (w > ref * 1.2) return null;
    // いちばん高いまとまり以外も背が高いときは、別々の字の可能性が高い（「10」の 1 と 0 など）
    const tall = run.map(g => Math.max(0, (g.maxY - g.minY) / ref - 0.6) * 25);
    merge = tall.reduce((s, t) => s + t, 0) - Math.max(...tall);
  }
  // 字の高さにくらべて低いもの（「7」の1画目のたて棒だけ、など）は、1文字としては読みにくい
  const small = Math.max(0, 0.75 - h / ref) * 30;
  if (strokes.length === 1 && w < h * 0.25 && h > ref * 0.4) return { label: '1', cost: 1 + small, pts: cloud(strokes) };  // たての細い線は「1」
  const c = classify(strokes);
  return { label: c.label, cost: 1 + c.d + small + merge, pts: c.pts };
}

// 答えの欄の線を、左から1文字ずつに分けて読む
function readInk(strokes, boxH){
  const items = strokes.map(pts => {
    const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
    return { pts, minX: Math.min(...xs), maxX: Math.max(...xs), minY: Math.min(...ys), maxY: Math.max(...ys) };
  }).sort((p, q) => p.minX - q.minX);

  // たての位置が重なる線は、同じ字（「4」「5」の2画目など）
  const groups = [];
  for (const it of items){
    const cx = (it.minX + it.maxX) / 2;
    const g = groups.find(g => {
      const gx = (g.minX + g.maxX) / 2;
      return (cx >= g.minX - 3 && cx <= g.maxX + 3) || (gx >= it.minX - 3 && gx <= it.maxX + 3);
    });
    if (g){
      g.strokes.push(it.pts);
      g.minX = Math.min(g.minX, it.minX); g.maxX = Math.max(g.maxX, it.maxX);
      g.minY = Math.min(g.minY, it.minY); g.maxY = Math.max(g.maxY, it.maxY);
    } else {
      groups.push({ strokes: [it.pts], minX: it.minX, maxX: it.maxX, minY: it.minY, maxY: it.maxY });
    }
  }

  // 1文字の区切り方をいくつか試して、いちばん自然に読める区切り方を選ぶ
  // （「7」の左上のチョンや「4」「5」の2画目が、少しはなれて書かれても1文字として読むため）
  const ref = Math.max(boxH * 0.3, ...groups.map(g => g.maxY - g.minY));
  const best = [{ cost: 0, chars: [] }];
  for (let i = 1; i <= groups.length; i++){
    best[i] = { cost: Infinity, chars: [] };
    for (let j = Math.max(0, i - 3); j < i; j++){
      const ch = readChar(groups.slice(j, i), ref, best[j].chars.length === 0);
      if (!ch || best[j].cost + ch.cost >= best[i].cost) continue;
      best[i] = { cost: best[j].cost + ch.cost, chars: ch.label ? best[j].chars.concat([ch]) : best[j].chars };
    }
  }
  const chars = best[groups.length].chars;
  return { text: chars.map(c => c.label).join(''), groups: chars };
}

/* ============================================================
   3. 手書きの線をかく（計算スペース・答えの欄）
   ============================================================ */
let lastPen = 0;   // Apple Pencil を最後に使った時刻（手のひらがふれても線をかかないため）
let inks = [];

function createInk(wrap, opt){
  const canvas = document.createElement('canvas');
  wrap.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  const ink = { strokes: [], tool: 'pen' };
  let cur = null;

  function style(){
    ctx.strokeStyle = opt.color; ctx.lineWidth = opt.width;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  }
  function redraw(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    style();
    for (const s of ink.strokes){
      ctx.beginPath();
      ctx.moveTo(s[0].x, s[0].y);
      if (s.length === 1) ctx.lineTo(s[0].x + 0.1, s[0].y);
      for (let i = 1; i < s.length; i++) ctx.lineTo(s[i].x, s[i].y);
      ctx.stroke();
    }
  }
  function resize(){
    const r = wrap.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.round(r.width * dpr));
    canvas.height = Math.max(1, Math.round(r.height * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    redraw();
  }
  function at(e){
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  function erase(p){
    const n = ink.strokes.length;
    ink.strokes = ink.strokes.filter(s => !s.some(q => dist(p, q) < 14));
    if (ink.strokes.length !== n){ cur.changed = true; redraw(); }
  }
  function changed(){ if (opt.onChange) opt.onChange(); }

  canvas.addEventListener('pointerdown', e => {
    if (opt.locked && opt.locked()) return;
    if (e.pointerType === 'pen'){
      lastPen = Date.now();
      if (cur && cur.type !== 'pen'){             // 先にふれた手のひらの線は取り消す
        const i = ink.strokes.indexOf(cur.s);
        if (i >= 0) ink.strokes.splice(i, 1);
        cur = null;
        redraw();
      }
    } else if (e.pointerType === 'touch' && Date.now() - lastPen < 5000) {
      return;                                     // ペンを使っている間は、指や手のひらを無視
    }
    if (cur) return;
    e.preventDefault();
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    const p = at(e);
    if (opt.onStart) opt.onStart();
    cur = { id: e.pointerId, type: e.pointerType };
    if (ink.tool === 'eraser') erase(p);
    else { cur.s = [p]; ink.strokes.push(cur.s); redraw(); }
  });
  canvas.addEventListener('pointermove', e => {
    if (!cur || e.pointerId !== cur.id) return;
    if (cur.type === 'pen') lastPen = Date.now();
    const evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
    for (const ev of evs.length ? evs : [e]){
      const p = at(ev);
      if (!cur.s){ erase(p); continue; }
      const last = cur.s[cur.s.length - 1];
      if (dist(p, last) < 1) continue;
      cur.s.push(p);
      style();
      ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    }
  });
  const end = e => {
    if (!cur || e.pointerId !== cur.id) return;
    const done = cur;
    cur = null;
    if (done.s || done.changed) changed();
  };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
  // 長押ししたときに、拡大鏡や文字選択が出ないようにする
  canvas.addEventListener('touchstart', e => e.preventDefault(), { passive: false });

  ink.clear = () => { ink.strokes = []; redraw(); changed(); };
  ink.undo = () => { if (ink.strokes.length){ ink.strokes.pop(); redraw(); changed(); } };
  ink.setTool = t => { ink.tool = t; };

  const ro = window.ResizeObserver ? new ResizeObserver(resize) : null;
  if (ro) ro.observe(wrap); else window.addEventListener('resize', resize);
  ink.destroy = () => { if (ro) ro.disconnect(); else window.removeEventListener('resize', resize); };
  resize();
  inks.push(ink);
  return ink;
}

}
function hintFor(q){
  if (q.type === 'write') return '書けなかった語は、お手本を見ながら練習スペースに3回書いてから、つぎへ進もう。手を動かすと、つづりが記憶に残りやすくなります。';
  if (q.type === 'recall') return '思い出そうとしたこと自体が、記憶を強くします。とき方を読んだら、目をとじて、もう一度言ってみよう。';
  if (q.passage) return 'まちがいは、のびるチャンス。英文のどこを見れば答えが決まるのか、とき方と見くらべてみよう。';

}

}

}

  if (q.type === 'choice'){
    return `
      <div class="answer" id="answer">
        <div class="head"><span>答えをえらぼう</span></div>
        <div class="choices">
          ${q.choices.map((c, k) => `<button class="choice" data-c="${k}"><span class="key">${'ABCD'[k]}</span><span>${c}</span></button>`).join('')}
        </div>
      </div>`;
  }
  if (q.type === 'recall'){
    return `
      <div class="answer" id="answer">
        <div class="recall-box" id="recallBox">
          <p class="recall-say">答えを <b>頭の中で</b> 思い出そう。<br>メモスペースに書いてもいいよ。</p>
        </div>
      </div>`;
  }
  return `
    <div class="answer" id="answer">
      <div class="head">
        <span>答えを書こう（キーでも入力できます）</span>
        <span class="tools">
          <button data-ans="undo">もどす</button>
          <button data-ans="clear">けす</button>
        </span>
      </div>
      <div class="ans-row">
        <div class="ink ans card" id="ans"><span class="ph" id="ph">ここに数字を書く</span></div>
        ${q.suffix ? `<span class="suf">${q.suffix}</span>` : ''}
      </div>
      <div class="read" id="slot">
        <span class="label" id="readLabel">きみの答え</span>
        <span class="val num" id="val"></span>
      </div>
      <div class="keys">
        ${[1,2,3,4,5,6,7,8,9].map(n => `<button class="num" data-k="${n}">${n}</button>`).join('')}
        <button class="num" data-k="-">−</button>
        <button class="num" data-k="0">0</button>
        <button data-k="del">⌫</button>
      </div>
    </div>`;
}

function screenQuiz(){
  resetScreen('is-quiz');
  const q = state.qs[state.i];
  const selfCheck = q.type === 'recall' || q.type === 'write';
  const goLabel = selfCheck ? '答えを見る' : '答え合わせ';
  app.innerHTML = `
    <div class="bar">
      <span class="num">${state.i + 1} / ${state.qs.length}${q.again ? ' <span class="tag-again">もう一度</span>' : q.review ? ' <span class="tag-again">復習</span>' : ''}${q.adv ? ' <span class="tag-adv">応用</span>' : ''}</span>
      <button class="quit">やめる</button>
    </div>
    <div class="dots" aria-hidden="true">${state.qs.map((_, k) => `<i class="${k < state.i ? 'done' : k === state.i ? 'now' : ''}"></i>`).join('')}</div>
    <div class="main">
      <section class="left${q.passage ? ' has-passage' : ''}">
        <div class="q word"><span class="tag">${q.passage ? '英文を読む' : TYPE_TAG[q.type]}</span>${q.text}</div>
        ${q.passage ? `<div class="passage card"><h3>${q.passage.title}</h3>${q.passage.body.map(b => `<p>${b}</p>`).join('')}</div>` : ''}
        <div class="work card">
          <div class="head">
            <span>${q.type === 'write' ? '練習スペース' : 'メモスペース'}</span>
            <span class="tools">
              <button data-tool="pen" aria-pressed="true">ペン</button>
              <button data-tool="eraser" aria-pressed="false">消しゴム</button>
              <button data-work="undo">もどす</button>
              <button data-work="clear">全部けす</button>
            </span>
          </div>
          <div class="ink" id="work"></div>
        </div>
      </section>
      <section class="right" id="right">
        ${answerHTML(q)}
        <div class="explain" id="explain" hidden></div>
        <div class="self" id="self" hidden>
          <button class="self-ng" id="selfNg">× 思い出せなかった</button>
          <button class="self-ok" id="selfOk">○ 思い出せた</button>
        </div>
        <button class="go" id="go" ${selfCheck ? '' : 'disabled'}>${goLabel}</button>
      </section>
    </div>`;

  const color = getComputedStyle(document.documentElement).getPropertyValue('--pen').trim();
  workInk = createInk(document.getElementById('work'), { color, width: 2.5 });

  app.querySelector('.quit').onclick = screenHome;
  app.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => {
    workInk.setTool(b.dataset.tool);
    app.querySelectorAll('[data-tool]').forEach(t => t.setAttribute('aria-pressed', t === b));
  });
  app.querySelector('[data-work="undo"]').onclick = () => workInk.undo();
  app.querySelector('[data-work="clear"]').onclick = () => workInk.clear();
  document.getElementById('go').onclick = submit;

  if (q.type === 'write'){
    ansInk = createInk(document.getElementById('ans'), {
      color, width: 6,
      locked: () => state.locked,
      onChange: () => { document.getElementById('ph').hidden = ansInk.strokes.length > 0; }
    });
    app.querySelector('[data-ans="undo"]').onclick = () => { if (!state.locked) ansInk.undo(); };
    app.querySelector('[data-ans="clear"]').onclick = () => { if (!state.locked) ansInk.clear(); };
  }
  if (q.type === 'num'){
    ansInk = createInk(document.getElementById('ans'), {
      color, width: 5,
      locked: () => state.locked,
      // 書いている間は読まない。ペンをはなしてしばらくたってから、書き上がった字をまとめて読む
      onStart: () => { clearTimeout(readTimer); readTimer = -1; draw(); },
      onChange: () => { clearTimeout(readTimer); readTimer = setTimeout(readAnswer, READ_WAIT); draw(); }
    });
    app.querySelector('[data-ans="undo"]').onclick = () => { if (!state.locked){ ansInk.undo(); readAnswer(); } };
    app.querySelector('[data-ans="clear"]').onclick = () => { if (!state.locked){ ansInk.clear(); readAnswer(); } };
    app.querySelectorAll('[data-k]').forEach(b => b.onclick = () => press(b.dataset.k));
    draw();
  }
  if (q.type === 'choice'){
    app.querySelectorAll('[data-c]').forEach(b => b.onclick = () => {
      if (state.locked) return;
      state.choice = Number(b.dataset.c);
      app.querySelectorAll('[data-c]').forEach(c => c.setAttribute('aria-pressed', c === b));
      document.getElementById('go').disabled = false;
    });
  }
}

// 答えの欄に書いた数字を読みとる
function readAnswer(){
  clearTimeout(readTimer);
  readTimer = null;
  if (!ansInk || state.locked) return;
  state.read = ansInk.strokes.length ? readInk(ansInk.strokes, document.getElementById('ans').clientHeight) : null;
  state.input = state.read ? state.read.text : '';
  draw();
}

function press(k){
  if (state.locked || !ansInk) return;
  if (readTimer) readAnswer();   // 書いた字を先に読んでから、キーで直す
  if (k === 'del') state.input = state.input.slice(0, -1);
  else if (k === '-') state.input = state.input.startsWith('-') ? state.input.slice(1) : '-' + state.input;
  else if (state.input.replace('-', '').length < 5) state.input += k;
  draw();
}

function draw(){
  const val = document.getElementById('val');
  if (!val || !ansInk) return;
  const waiting = readTimer !== null;   // 書いている途中か、読みとる前
  const unreadable = !waiting && state.input.includes('?');
  val.textContent = waiting ? '…' : state.input === '' ? '—' : state.input.replace('-', '−').replace(/\?/g, '？');
  val.classList.toggle('empty', waiting || state.input === '');
  document.getElementById('readLabel').textContent = unreadable ? '読みとれない字があります。書きなおすか、キーで直してね' : 'きみの答え';
  // 読みとる前でも「答え合わせ」は押せる（押したときに読みとる）
  document.getElementById('go').disabled = waiting ? ansInk.strokes.length === 0 : !/^-?\d+$/.test(state.input);
  document.getElementById('ph').hidden = ansInk.strokes.length > 0;
}

// 読みまちがえた1文字をキーで直したときは、その字の形を覚える
function learnFromFix(){
  const r = state.read;
  if (!r || r.text === state.input || r.text.length !== state.input.length) return;
  const diff = [...state.input].map((ch, i) => ch !== r.text[i] ? i : -1).filter(i => i >= 0);
  if (diff.length !== 1) return;
  const i = diff[0], ch = state.input[i];
  if (/\d/.test(ch) && r.groups[i].pts) learn(ch, r.groups[i].pts);
}

function submit(){
  if (state.locked) return;
  const q = state.qs[state.i];
  if (q.type === 'recall' || q.type === 'write') return revealRecall(q);
  let mine;
  if (q.type === 'choice'){
    if (state.choice === null) return;
    mine = q.choices[state.choice];
  } else {
    if (readTimer) readAnswer();
    if (!/^-?\d+$/.test(state.input)) return;
    learnFromFix();
    mine = Number(state.input);
  }
  state.locked = true;
  const ok = mine === q.answer;
  if (q.type === 'choice'){
    app.querySelectorAll('[data-c]').forEach((b, k) => {
      b.disabled = true;
      if (q.choices[k] === q.answer) b.classList.add('is-ok');
      else if (k === state.choice) b.classList.add('is-ng');
    });
  }
  finish(q, mine, ok);
}

// 「思い出す」問題：答えを見せて、自分で ○× をつける
function revealRecall(q){
  state.locked = true;
  if (q.type === 'write'){
    const m = document.getElementById('model');
    m.innerHTML = `
      <p class="recall-label">お手本</p>
      <p class="model-ch${[...q.answer].length > 12 ? ' long' : ''}">${q.answer}</p>
      <p class="recall-q">${q.sub}</p>`;
    m.hidden = false;
    document.getElementById('selfOk').textContent = '○ 正しく書けた';
    document.getElementById('selfNg').textContent = '× 書けなかった';
  } else {
    document.getElementById('recallBox').innerHTML = `
      <p class="recall-label">答え</p>
      <p class="recall-ans">${q.answer}</p>
      <p class="recall-q">頭の中で思い出した答えと、合っていましたか？</p>`;
  }
  document.getElementById('go').hidden = true;
  document.getElementById('self').hidden = false;
  document.getElementById('selfOk').onclick = () => finish(q, q.answer, true);
  document.getElementById('selfNg').onclick = () => finish(q, null, false);
}

// まちがえた問題は、すぐではなく2〜3問あとに、同じきまりの新しい問題としてもう一度出す
// （すぐ解きなおすより、少し間をあけて思い出すほうが記憶に残りやすい）
function queueRetry(q){
  if (!q.item || q.again || state.retried.has(q.item)) return;
  const again = regenFor(q.item);
  if (!again) return;
  state.retried.add(q.item);
  again.item = q.item;
  again.label = q.label;
  again.again = true;
  state.qs.splice(Math.min(state.i + 3, state.qs.length), 0, again);
}

function finish(q, mine, ok){
  state.results.push({ q, mine, ok });
  const grad = ok ? boxHit(q) : false;
  if (grad) state.grad++;
  if (!ok){ boxMiss(q); queueRetry(q); }
  logQuestion(q, ok, grad);
  const go = document.getElementById('go');
  document.getElementById('self').hidden = true;
  go.hidden = false;
  if (ok){
    // ほめるのは「頭のよさ」ではなく、やり方やがんばり
    const praise = q.again ? '間をあけて、もう一度できたね'
      : q.review ? '前にまちがえた問題を思い出せたね'
      : q.type === 'recall' ? '自分の力で思い出せたね'
      : q.type === 'write' ? '思い出しながら書けたね'
      : q.passage ? '英文から手がかりを見つけられたね'
      : q.type === 'num' ? pick(['ていねいに聞き分けられたね', '数の言い方を覚えられているね', 'その調子で続けよう'])
      : pick(['きまりを思い出して考えられたね', '主語と動詞をよく見られたね', '集中できているね', 'その調子で続けよう']);
    go.textContent = '○ 正解！ ' + praise;
    go.classList.add('ok');
    go.disabled = true;
    nextTimer = setTimeout(nextQuestion, q.type === 'choice' ? 1500 : 1300);
    return;
  }
  showExplanation(q, mine);
}

// とき方は1行ずつ開く。つぎの行を自分で考えてから見ると、ただ読むより記憶に残りやすい
function showExplanation(q, mine){
  const go = document.getElementById('go');
  const ex = document.getElementById('explain');
  ex.innerHTML = explainHTML(q, mine);
  ex.hidden = false;
  if (q.type !== 'choice') document.getElementById('answer').hidden = true;
  document.getElementById('right').classList.add('explaining', 'is-' + q.type);
  go.disabled = false;
  const items = [...ex.querySelectorAll('.steps li')];
  let shown = 1;
  items.forEach((li, k) => { li.hidden = k >= shown; });
  const update = () => {
    const done = shown >= items.length;
    go.textContent = done ? 'つぎの問題へ' : `つぎはどうなる？ 考えてからタップ（${shown} / ${items.length}）`;
    go.classList.toggle('step', !done);
    go.classList.toggle('next', done);
    ex.querySelector('.all').hidden = done;
  };
  go.onclick = () => {
    if (shown >= items.length) return nextQuestion();
    items[shown].hidden = false;
    items[shown].scrollIntoView({ block: 'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    shown++;
    update();
  };
  ex.querySelector('.all').onclick = () => {
    items.forEach(li => { li.hidden = false; });
    shown = items.length;
    update();
  };
  update();
}

function nextQuestion(){
  state.i++;
  resetAnswer();
  if (state.i >= state.qs.length) screenResult();
  else screenQuiz();
}

/* ---- 結果画面 ---- */
// 点数だけでなく、つぎに何をすれば伸びるかを伝える
function resultMessage(right, n){
  if (state.mode === 'review'){
    if (right === n) return '復習、ぜんぶ正解！ 日をあけて思い出せたことが、いちばん記憶に残ります。あと数回くり返すと、この問題は卒業です。';
    return '復習おつかれさま。思い出せなかった問題は、また あした 出ます。今できなくても、くり返すうちに必ず出てくるようになります。';
  }
  if (right === n) return 'ぜんぶ正解！ 何日かあけて「まぜこぜ」でもう一度ためすと、さらに忘れにくくなります。';
  if (right / n >= 0.7) return 'よくできました。まちがえた問題は、とき方を読んだあとにもう一度解くと、いちばん記憶に残ります。';
  return 'まちがえた問題こそ、のびるチャンス。とき方を1行ずつ読んでから、もう一度ちょうせんしよう。';
}

function screenResult(){
  resetScreen('');
  const time = Date.now() - state.t0;
  const wrong = state.results.filter(r => !r.ok);
  const right = state.results.length - wrong.length;
  if (state.results.length) logSession(state.unit, state.mode, state.results.length, right, time);

  app.innerHTML = `
    <div class="score">
      <div class="big num">${right}<u> / ${state.results.length}</u></div>
      <p class="msg">${resultMessage(right, state.results.length)}</p>
      <div class="sub">かかった時間 ${fmtTime(time)}</div>
    </div>
    <div class="review">
      ${wrong.length === 0 ? '<h2>全問正解です。</h2>' : '<h2>まちがえた問題（タップすると、とき方が見られます）</h2>' + wrong.map(r => `
        <details class="row">
          <summary>
            <span class="wq">${r.q.text}</span>
            <span class="mine">きみの答え ${answerText(r.q, r.mine)}<b>${answerText(r.q, r.q.answer)}</b><span class="open">とき方 ▼</span></span>
          </summary>
          <div class="row-ex">${stepsHTML(r.q)}</div>
        </details>`).join('')}
    </div>
    ${boxStateHTML(state.grad)}
    <div class="acts">
      ${wrong.length ? '<button id="again-wrong">まちがえた問題を、別の問題でもう一度</button>' : ''}
      ${dueKeys().length ? `<button id="go-review" class="${wrong.length ? 'ghost' : ''}">今日の復習のつづき（${dueKeys().length}問）</button>` : ''}
      ${state.mode === 'review' ? '' : `<button id="again" class="${wrong.length || dueKeys().length ? 'ghost' : ''}">同じ分野でもう一度</button>`}
      <button id="home" class="ghost">分野をえらびなおす</button>
    </div>`;

  const w = document.getElementById('again-wrong');
  // もう一度のときも、同じきまりから作った新しい問題にする（問題文ごと覚えてしまわないように）
  if (w) w.onclick = () => startQuiz(wrong.map(r => regenFor(r.q.item) || (r.q.choices ? { ...r.q, choices: shuffle(r.q.choices) } : r.q)));
  const rv = document.getElementById('go-review');
  if (rv) rv.onclick = () => { state.unit = 'review'; startQuiz(makeReviewQuestions(state.total), 'review'); };
  const ag = document.getElementById('again');
  if (ag) ag.onclick = () => startQuiz(makeQuestions(state.unit, state.total, state.level));
  document.getElementById('home').onclick = screenHome;
}

/* ---- パソコンのキーボードでも操作できるように ---- */
document.addEventListener('keydown', e => {
  if (!document.getElementById('go')) return;   // 出題画面のときだけ受けつける
  const q = state.qs[state.i];
  if (q && q.type === 'num'){
    if (e.key >= '0' && e.key <= '9') press(e.key);
    else if (e.key === '-') press('-');
    else if (e.key === 'Backspace') press('del');
  }
  if (q && q.type === 'choice' && /^[1-4a-dA-D]$/.test(e.key)){
    const k = /\d/.test(e.key) ? Number(e.key) - 1 : 'abcd'.indexOf(e.key.toLowerCase());
    const b = app.querySelector(`[data-c="${k}"]`);
    if (b) b.click();
  }
  if (e.key === 'Enter'){
    const go = document.getElementById('go');
    if (go && !go.disabled && !go.hidden) go.click();
  }
});

screenHome();
</script>
