<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4F1EA">
<title>中1社会ドリル</title>
<style>
  /* ============================================================
     色の意味は固定する（毎回同じ意味で出てくると、見ただけでわかる）
       正解＝青 / まちがい＝オレンジ / 大事なきまり＝蛍光ペンの黄色 / 次に押すボタン＝こい紺
     赤と緑の組み合わせは使わない（色覚のタイプによって見分けにくいため）
     ============================================================ */
  :root{
    color-scheme:light;
    --bg:#F4F1EA;        /* 紙のような、まぶしすぎない地の色 */
    --surface:#FFFDF9;   /* カード */
    --surface-2:#ECE7DC; /* キーの押した色など */
    --line:#DAD3C5;
    --grid:rgba(60,90,130,.09);
    --ink:#1E2833;       /* 文字（地の色とのコントラスト 約13:1） */
    --ink-2:#5A6472;     /* 補足の文字 */
    --faint:#A39C8E;     /* 入力前の「—」など */
    --pen:#22313F;       /* 手書きの線（えんぴつの色） */
    --primary:#1E2833;   /* 次に押すボタン */
    --ok:#2463A8;        /* 正解 */
    --ok-soft:#E2ECF8;
    --ng:#B8570E;        /* まちがい（赤を使わず、あせりをさそわない） */
    --ng-soft:#FAEBDC;
    --mark:#FFE27A;      /* 大事なきまり */
    --focus:#2463A8;
    --l3:#7FA9D6;        /* 習得マップ「できている」 */
    --l5:#2463A8;        /* 習得マップ「身についた」 */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  [hidden]{display:none!important;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic",system-ui,sans-serif;
    display:flex;justify-content:center;
    overscroll-behavior:none;
    touch-action:manipulation;
    -webkit-text-size-adjust:100%;
  }
  #app{
    width:100%;max-width:480px;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;min-height:100%;
  }
  .num{
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-variant-numeric:tabular-nums;
  }
  button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;}
  button:focus-visible{outline:3px solid var(--focus);outline-offset:2px;}

  /* ---- トップ ---- */
  .title{font-size:1.3rem;font-weight:800;letter-spacing:.04em;margin:8px 0 6px;}
  .lead{color:var(--ink-2);font-size:.9rem;line-height:1.8;margin:0 0 20px;}
  .menu{display:flex;flex-direction:column;gap:10px;}
  .unit{
    background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:16px 18px;text-align:left;display:flex;align-items:center;gap:14px;
    box-shadow:0 1px 2px rgba(30,40,51,.05);
  }
  .unit:active{background:var(--surface-2);}
  .unit b{font-size:1.02rem;font-weight:700;display:block;}
  .unit span{font-size:.8rem;color:var(--ink-2);display:block;margin-top:4px;line-height:1.5;}
  .unit .mark{
    width:40px;height:40px;flex:none;margin:0;border-radius:10px;background:var(--ok-soft);
    display:grid;place-items:center;font-size:1.2rem;font-weight:700;color:var(--ok);
  }
  .unit .badge{
    display:inline-block;margin:0 0 0 8px;padding:1px 8px;border-radius:999px;vertical-align:2px;
    background:var(--mark);color:var(--ink);font-size:.7rem;font-weight:700;
  }
  .count{
    display:flex;align-items:center;gap:8px;margin:22px 0 6px;
    font-size:.84rem;color:var(--ink-2);
  }
  .count button{
    border:1px solid var(--line);border-radius:999px;padding:7px 15px;
    font-size:.84rem;color:var(--ink-2);background:var(--surface);
  }
  .count button[aria-pressed="true"]{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:700;}
  .tip{
    margin:18px 0 0;padding:12px 14px;border-radius:12px;border:1px dashed var(--line);
    background:var(--surface);color:var(--ink-2);font-size:.82rem;line-height:1.8;
  }

  /* ---- 出題 ---- */
  #app.is-quiz{
    height:100vh;height:100dvh;min-height:0;
    padding-top:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom));
    -webkit-user-select:none;user-select:none;
  }
  .bar{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:.82rem;color:var(--ink-2);}
  .bar .quit{padding:5px 12px;border:1px solid var(--line);border-radius:999px;font-size:.78rem;color:var(--ink-2);background:var(--surface);}
  /* 進み具合は1問ずつの区切りで見せる（ゴールが近づくほどやる気が出やすい） */
  .dots{display:flex;gap:4px;margin-top:10px;flex:none;}
  .dots i{flex:1;height:6px;border-radius:3px;background:var(--surface-2);transition:background .3s;}
  .dots i.done{background:#A7AEB8;}
  .dots i.now{background:var(--ink);}
  .main{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;margin-top:10px;}
  .left{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;}
  /* 問題はカードにのせて、いちばん目がいくようにする */
  .q{
    text-align:center;font-size:clamp(1.6rem,7vw,2.4rem);font-weight:700;line-height:1.3;
    letter-spacing:.01em;padding:10px 14px;
    background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(30,40,51,.05);
  }
  .q small{
    display:block;font-size:.85rem;font-weight:500;color:var(--ink-2);margin-bottom:4px;letter-spacing:.02em;
    font-family:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
  }
  .q.word{text-align:left;font-size:1.08rem;font-weight:500;line-height:1.9;letter-spacing:.03em;padding:12px 16px;}
  .q.word .tag{
    display:inline-block;margin-right:8px;padding:1px 9px;border-radius:999px;vertical-align:2px;
    background:var(--surface-2);color:var(--ink-2);font-size:.72rem;font-weight:700;letter-spacing:0;
  }
  .nw{white-space:nowrap;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;}
  .work{flex:1;min-height:150px;display:flex;flex-direction:column;overflow:hidden;}
  .head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.8rem;color:var(--ink-2);}
  .work .head{padding:6px 6px 6px 12px;border-bottom:1px solid var(--line);}
  .tools{display:flex;gap:6px;}
  .tools button{padding:6px 12px;border:1px solid var(--line);border-radius:999px;font-size:.76rem;color:var(--ink-2);background:var(--surface);}
  .tools button[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:700;}
  .ink{position:relative;flex:1;min-height:0;touch-action:none;-webkit-touch-callout:none;}
  .ink canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
  /* 計算スペースは方眼（式の行や位がそろえやすい） */
  .work .ink{
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:28px 28px;
  }

  .right{flex:none;display:flex;flex-direction:column;gap:8px;min-height:0;}
  .answer{display:flex;flex-direction:column;gap:8px;}
  .ans-row{display:flex;align-items:center;gap:10px;}
  .ans-row .pre{font-size:1.5rem;font-weight:700;color:var(--ink-2);flex:none;}
  .ans-row .suf{font-size:1.2rem;font-weight:700;color:var(--ink-2);flex:none;}
  .ans{flex:1;height:96px;}
  .ans::after{content:'';position:absolute;left:16px;right:16px;bottom:22%;border-bottom:2px dashed var(--line);pointer-events:none;}
  .ans .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);font-size:.9rem;pointer-events:none;}
  .read{display:flex;align-items:baseline;justify-content:space-between;gap:12px;min-height:2.6rem;padding:0 4px;}
  .read .label{font-size:.82rem;color:var(--ink-2);}
  .read .val{font-size:2rem;font-weight:700;min-width:2.2ch;text-align:right;border-bottom:3px solid var(--line);padding:0 6px 2px;flex:none;}
  .read .val.empty{color:var(--faint);}
  .read.ok .val{border-color:var(--ok);color:var(--ok);}
  .read.ok .label{color:var(--ok);font-size:1.05rem;font-weight:700;}

  /* ---- テンキー（手書きの予備なので、目立ちすぎないように） ---- */
  .keys{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;}
  .keys button{
    background:var(--surface);border:1px solid var(--line);border-radius:10px;
    height:44px;font-size:1.25rem;font-weight:600;color:var(--ink);
  }
  .keys button:active{background:var(--surface-2);}
  .go{
    flex:none;width:100%;min-height:54px;padding:6px 14px;border-radius:14px;
    background:var(--primary);color:#fff;font-size:1.05rem;font-weight:700;line-height:1.35;
  }
  .go:disabled{background:var(--surface-2);color:var(--faint);}
  .go.ok{background:var(--ok);color:#fff;}
  .go.step{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--primary);}
  .go.next{background:var(--primary);color:#fff;}

  /* ---- 解説 ---- */
  .right.explaining{flex:0 1 auto;max-height:64%;}
  .explain{
    flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--ng);border-radius:14px;
  }
  .ex-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 14px;}
  .ex-top .mine{font-size:.85rem;color:var(--ink-2);}
  .ex-top .mine b{color:var(--ng);font-size:1.15rem;margin-left:6px;}
  .ex-top .correct{font-size:.95rem;font-weight:700;}
  .ex-top .correct b{color:var(--ok);font-size:1.6rem;margin-left:6px;}
  .hint{margin:10px 0 0;padding:9px 12px;border-radius:10px;background:var(--ng-soft);font-size:.88rem;line-height:1.75;}
  .hint b{font-weight:700;}
  .ex-h{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px;}
  .ex-h h3{font-size:.82rem;color:var(--ink-2);font-weight:700;margin:0;}
  .ex-h .all{font-size:.8rem;color:var(--ok);font-weight:600;padding:4px 6px;}
  .steps{list-style:none;margin:0;padding:0;counter-reset:st;display:flex;flex-direction:column;gap:14px;}
  .steps li{counter-increment:st;position:relative;padding-left:34px;animation:rise .25s ease-out;}
  .steps li::before{
    content:counter(st);position:absolute;left:0;top:3px;width:24px;height:24px;border-radius:50%;
    background:var(--primary);color:#fff;font-size:.8rem;font-weight:700;display:grid;place-items:center;
  }
  .steps p{margin:0;font-size:.95rem;line-height:1.85;}
  /* 大事なきまりは蛍光ペン（毎回同じ見た目にして、目に入りやすくする） */
  .steps b{
    font-weight:700;padding:0 2px;
    background:linear-gradient(transparent 58%,var(--mark) 58%);
    -webkit-box-decoration-break:clone;box-decoration-break:clone;
  }
  .steps .m{display:inline-block;margin-top:6px;padding:6px 12px;border-radius:8px;background:var(--bg);font-size:1.2rem;font-weight:600;line-height:1.65;}
  .steps .m span{display:block;}
  /* 数直線の図 */
  .fig{margin:8px 0 0;max-width:440px;}
  .fig figcaption{font-size:.76rem;color:var(--ink-2);margin-bottom:2px;}
  .nl{display:block;width:100%;height:auto;}
  .nl .axis,.nl .tick{stroke:var(--ink-2);stroke-width:1.5;}
  .nl .guide{stroke:var(--line);stroke-width:1.5;stroke-dasharray:4 3;}
  .nl .a1{stroke:var(--ink);stroke-width:3;}
  .nl .h1{fill:var(--ink);}
  .nl .a2{stroke:var(--ok);stroke-width:3;}
  .nl .h2{fill:var(--ok);}
  .nl text{font-family:"Helvetica Neue",Arial,sans-serif;font-size:15px;text-anchor:middle;fill:var(--ink-2);}
  .nl text.s1{fill:var(--ink);font-weight:700;}
  .nl text.s2,.nl text.ans{fill:var(--ok);font-weight:700;}
  @keyframes rise{from{opacity:0;transform:translateY(4px);}}

  /* ---- 結果 ---- */
  .score{text-align:center;padding:26px 0 6px;}
  .score .big{font-size:4.2rem;font-weight:800;line-height:1;}
  .score .big u{text-decoration:none;font-size:1.6rem;color:var(--ink-2);}
  .score .msg{margin:14px auto 0;max-width:30em;font-size:.95rem;line-height:1.85;}
  .score .sub{color:var(--ink-2);font-size:.8rem;margin-top:6px;}
  .review{margin:18px 0 6px;display:flex;flex-direction:column;gap:8px;}
  .review h2{font-size:.84rem;color:var(--ink-2);font-weight:700;margin:0 0 2px;}
  .row{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ng);border-radius:12px;}
  .row summary{
    list-style:none;cursor:pointer;padding:11px 14px;display:flex;justify-content:space-between;
    align-items:center;gap:12px;font-size:1rem;
  }
  .row summary::-webkit-details-marker{display:none;}
  .row summary small{display:block;font-size:.75rem;font-weight:400;color:var(--ink-2);}
  .row summary .wq{font-size:.9rem;line-height:1.7;}
  .row .mine{font-size:.8rem;color:var(--ink-2);text-align:right;line-height:1.5;flex:none;}
  .row .mine b{display:block;color:var(--ok);font-size:1.05rem;font-weight:700;}
  .row .open{display:block;color:var(--ok);font-size:.74rem;font-weight:600;}
  .row[open] .open{visibility:hidden;}
  .row-ex{padding:12px 14px 14px;border-top:1px solid var(--line);}
  .acts{margin-top:auto;padding-top:20px;display:flex;flex-direction:column;gap:9px;}
  .acts button{
    height:54px;border-radius:14px;font-size:.98rem;font-weight:700;
    background:var(--primary);color:#fff;
  }
  .acts button.ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink);font-weight:600;}

  /* ---- iPad などの大きい画面 ---- */
  @media (min-width:700px){
    #app{max-width:620px;padding:32px 28px calc(28px + env(safe-area-inset-bottom));}
    #app.is-quiz{max-width:780px;padding-top:18px;padding-bottom:calc(16px + env(safe-area-inset-bottom));}
    .title{font-size:1.6rem;}
    .lead{font-size:1rem;}
    .unit{padding:20px 22px;}
    .unit b{font-size:1.2rem;}
    .unit span{font-size:.92rem;}
    .unit .mark{width:48px;height:48px;font-size:1.45rem;}
    .unit .badge{font-size:.8rem;}
    .count,.count button{font-size:.95rem;}
    .count button{padding:10px 20px;}
    .tip{font-size:.95rem;}
    .bar{font-size:.95rem;}
    .bar .quit{padding:8px 16px;font-size:.9rem;}
    .dots i{height:8px;}
    .main{gap:12px;margin-top:12px;}
    .left{gap:12px;}
    .q{font-size:2.8rem;padding:14px 18px;}
    .q small{font-size:1.05rem;}
    .q.word{font-size:1.32rem;padding:16px 20px;}
    .q.word .tag{font-size:.82rem;}
    .head{font-size:.92rem;}
    .tools{gap:8px;}
    .tools button{padding:8px 16px;font-size:.9rem;}
    .work .ink{background-size:32px 32px;}
    .ans{height:120px;}
    .ans-row .pre{font-size:2rem;}
    .ans-row .suf{font-size:1.5rem;}
    .read .label{font-size:.95rem;}
    .read.ok .label{font-size:1.25rem;}
    .read .val{font-size:2.4rem;}
    .keys{grid-template-columns:repeat(12,1fr);gap:8px;}
    .keys button{height:54px;font-size:1.5rem;}
    .go{min-height:62px;font-size:1.2rem;}
    .explain{padding:18px 22px;}
    .ex-top .mine{font-size:.95rem;}
    .ex-top .correct{font-size:1.05rem;}
    .ex-top .correct b{font-size:1.9rem;}
    .hint{font-size:1.02rem;}
    .ex-h h3,.ex-h .all{font-size:.95rem;}
    .steps{gap:18px;}
    .steps li{padding-left:40px;}
    .steps li::before{width:28px;height:28px;font-size:.9rem;}
    .steps p{font-size:1.08rem;}
    .steps .m{font-size:1.4rem;}
    .fig{max-width:520px;}
    .fig figcaption{font-size:.85rem;}
    .score .big{font-size:5.5rem;}
    .score .msg{font-size:1.08rem;}
    .score .sub{font-size:.92rem;}
    .review h2{font-size:.95rem;}
    .row summary{font-size:1.25rem;padding:14px 18px;}
    .row summary small{font-size:.85rem;}
    .row summary .wq{font-size:1.02rem;}
    .row .mine{font-size:.9rem;}
    .row .mine b{font-size:1.2rem;}
    .row-ex{padding:14px 18px 18px;}
    .acts button{height:64px;font-size:1.1rem;}
  }
  /* iPad 横向き：左に問題と計算スペース、右に答えと解説 */
  @media (min-width:1000px) and (orientation:landscape){
    #app.is-quiz{max-width:1200px;}
    .main{flex-direction:row;gap:16px;}
    .left{flex:1.4;min-width:0;}
    .q{font-size:2.4rem;}
    .right{flex:1;min-width:0;}
    .right.explaining{flex:1;max-height:none;}
    .ans{height:140px;}
    .keys{grid-template-columns:repeat(3,1fr);}
    .keys button{height:52px;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}

  /* ---- 理科ドリルと共通の部品（選択肢・思い出す問題など） ---- */
  .top-row{display:flex;justify-content:space-between;align-items:center;gap:12px;}
  .switch{
    flex:none;padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);
    color:var(--ink-2);font-size:.8rem;font-weight:600;text-decoration:none;
  }
  .unit .mark{font-size:1.35rem;}
  .q.word .item{
    display:block;margin-top:8px;padding:6px 12px;border-radius:10px;background:var(--bg);
    font-size:1.35em;font-weight:700;text-align:center;
  }
  /* 選択肢 */
  .choices{display:grid;grid-template-columns:1fr;gap:8px;}
  .choice{
    display:flex;align-items:center;gap:12px;min-height:54px;padding:10px 14px;text-align:left;
    background:var(--surface);border:2px solid var(--line);border-radius:12px;font-size:1.02rem;font-weight:600;color:var(--ink);line-height:1.45;
  }
  .choice .key{
    flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;
    background:var(--surface-2);color:var(--ink-2);font-size:.8rem;font-weight:700;font-family:"Helvetica Neue",Arial,sans-serif;
  }
  .choice[aria-pressed="true"]{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary);}
  .choice[aria-pressed="true"] .key{background:var(--primary);color:#fff;}
  .choice:disabled{opacity:1;cursor:default;}
  .choice.is-ok{border-color:var(--ok);background:var(--ok-soft);}
  .choice.is-ok .key{background:var(--ok);color:#fff;}
  .choice.is-ok::after{content:'○ 正しい答え';margin-left:auto;flex:none;color:var(--ok);font-size:.8rem;font-weight:700;}
  .choice.is-ng{border-color:var(--ng);background:var(--ng-soft);}
  .choice.is-ng .key{background:var(--ng);color:#fff;}
  .choice.is-ng::after{content:'きみの答え';margin-left:auto;flex:none;color:var(--ng);font-size:.8rem;font-weight:700;}
  /* 選択肢の問題でまちがえたときは、選択肢も解説も見えるように */
  .right.explaining.is-choice .choices{grid-template-columns:1fr 1fr;}
  .right.explaining.is-choice .choice{min-height:44px;padding:6px 10px;font-size:.9rem;}
  .right.explaining.is-choice .choice::after{display:none;}
  /* 思い出す問題 */
  .recall-box{
    display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;min-height:150px;padding:18px;text-align:center;
    background:var(--surface);border:2px dashed var(--line);border-radius:14px;
  }
  .recall-say{margin:0;font-size:1rem;line-height:1.9;color:var(--ink-2);}
  .recall-say b{color:var(--ink);}
  .recall-label{margin:0;font-size:.8rem;color:var(--ink-2);font-weight:700;}
  .recall-ans{margin:0;font-size:2rem;font-weight:800;color:var(--ok);}
  .recall-q{margin:4px 0 0;font-size:.9rem;color:var(--ink-2);}
  .self{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .self button{min-height:58px;border-radius:14px;font-size:1.02rem;font-weight:700;}
  .self .self-ok{background:var(--ok);color:#fff;}

<body>
<div id="app"></div>

<script>
/* ============================================================
   1. 問題を作る部分
      問題は次の形のどれか。どれも { unit, type, text, answer, steps } を持つ。
        type:'num'    … 数字で答える（手書きかキー）。時差・人口密度・世紀などの計算
        type:'choice' … 選択肢から選ぶ（choices に選択肢）
        type:'recall' … 頭の中で思い出してから「答えを見る」を押し、自分で ○× をつける
        type:'write'  … 大きなマスに用語を漢字で書いてから「答えを見る」を押し、お手本とくらべて ○× をつける
      shiryo があるときは、左がわに資料（雨温図）を表示する。
      steps は、まちがえたときに見せる「とき方」。{ say: 説明, math: 式 } の配列。

      社会の用語は乱数だけでは作れないので、理科・国語ドリルと同じく
      きまり（用語・分類・年表・気候の資料）をデータで持ち、
      出し方・選択肢の組み合わせ・順番を毎回かえて問題を作る。
      計算問題は、答えを先に決めてから数を作るので、答えは必ず整数になる。
   ============================================================ */

// a以上b以下の整数をランダムに1つ返す
function rnd(a, b){ return Math.floor(Math.random() * (b - a + 1)) + a; }
// 配列からランダムに1つ
function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
// 配列をまぜる
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
// 負の数を「−7」のように全角マイナスで表す
function numText(n){ return n < 0 ? '−' + Math.abs(n) : String(n); }
function answerStep(s){ return { say: '<b>答え</b>　' + s }; }
// 正しい答えと、まちがいの候補から、選択肢を4つ（足りなければあるだけ）作る
function makeChoices(answer, pool){
  return shuffle([answer, ...shuffle([...new Set(pool.filter(x => x !== answer))]).slice(0, 3)]);
}
// 経度を「東経135度」のように表す
function lonText(e){ return e === 0 ? '経度0度' : (e > 0 ? '東経' : '西経') + Math.abs(e) + '度'; }

/* ---- 計算問題（答えは必ず整数。答えを先に決めてから問題を作る）---- */

const JP_LON = 135;   // 日本の標準時子午線（兵庫県明石市を通る東経135度）
// 標準時子午線が 15 の倍数で、教科書によく出てくる都市
const CITIES = [
  { n:'ロンドン',         e:0 },
  { n:'カイロ',           e:30 },
  { n:'モスクワ',         e:45 },
  { n:'ペキン（北京）',   e:120 },
  { n:'シドニー',         e:150 },
  { n:'リオデジャネイロ', e:-45 },
  { n:'ニューヨーク',     e:-75 },
  { n:'シカゴ',           e:-90 },
  { n:'ロサンゼルス',     e:-120 }
];
// 経度の差を出す式（西経は、本初子午線をまたぐのでたし算になる）
function lonGap(e){ return Math.abs(JP_LON - e); }
function lonGapMath(e){
  if (e < 0) return `${JP_LON} ＋ ${Math.abs(e)} ＝ ${lonGap(e)}（度）`;
  return `${Math.max(JP_LON, e)} － ${Math.min(JP_LON, e)} ＝ ${lonGap(e)}（度）`;
}
function lonGapSay(e){
  return e >= 0
    ? '2つの都市の<b>経度の差</b>を求めます。どちらも東経なので、大きいほうから小さいほうをひきます。'
    : '2つの都市の<b>経度の差</b>を求めます。<b>東経と西経のときは、0度の線（本初子午線）をまたぐのでたし算</b>です。';
}

// 時差を求める
function calcTimeDiff(){
  const c = pick(CITIES), gap = lonGap(c.e), h = gap / 15;
  return { unit:'sekai', type:'num', suffix:'時間', answer:h,
    text: `日本の標準時子午線は東経135度、${c.n}の標準時子午線は${lonText(c.e)}です。日本と${c.n}の時差は何時間ですか。`,
    steps: [
      { say: '<b>地球は24時間で1回転（360度）する</b>ので、<b>経度15度で1時間</b>の時差が生まれます。', math: '360 ÷ 24 ＝ 15（度で1時間）' },
      { say: lonGapSay(c.e), math: lonGapMath(c.e) },
      { say: '経度の差を15でわると、時差が出ます。', math: `${gap} ÷ 15 ＝ ${h}` },
      answerStep(`${h} 時間`)
    ] };
}
// 現地の時刻を求める
function calcLocalTime(){
  const c = pick(CITIES.filter(x => x.e !== JP_LON)), h = (JP_LON - c.e) / 15;
  const jp = rnd(0, 23), raw = jp - h, local = ((raw % 24) + 24) % 24;
  const ahead = h > 0;   // 日本のほうが時刻が進んでいる
  const day = raw < 0 ? '前日' : raw > 23 ? '翌日' : '同じ日';
  return { unit:'sekai', type:'num', suffix:'時', answer:local,
    text: `日本（東経135度）が5月10日の${jp}時のとき、${c.n}（${lonText(c.e)}）は何時ですか。24時制で答えましょう。`,
    steps: [
      { say: '<b>経度15度で1時間</b>の時差。まず経度の差から時差を出します。', math: [lonGapMath(c.e), `${lonGap(c.e)} ÷ 15 ＝ ${Math.abs(h)}（時間）`] },
      { say: `<b>東にある地点ほど、時刻が先に進んでいる</b>。${ahead ? `日本のほうが東にあるので、${c.n}は日本より ${Math.abs(h)} 時間おくれています。` : `${c.n}のほうが東にあるので、${c.n}は日本より ${Math.abs(h)} 時間進んでいます。`}` },
      { say: `日本の時刻から、時差を${ahead ? 'ひき' : 'たし'}ます。`, math: `${jp} ${ahead ? '－' : '＋'} ${Math.abs(h)} ＝ ${numText(raw)}` },
      day === '同じ日'
        ? { say: '0時から23時の間におさまったので、日付は<b>同じ日</b>です。', math: `${local} 時（5月10日）` }
        : day === '前日'
          ? { say: '<b>0時より前になったので、24時間をたして前日の時刻</b>と考えます。', math: `${numText(raw)} ＋ 24 ＝ ${local}（5月9日の ${local} 時）` }
          : { say: '<b>24時をこえたので、24時間をひいて翌日の時刻</b>と考えます。', math: `${raw} － 24 ＝ ${local}（5月11日の ${local} 時）` },
      answerStep(`${local} 時`)
    ] };
}

// 標準時子午線の経度を求める
function calcMeridian(){
  const h = rnd(1, 8), e = JP_LON - 15 * h;
  return { unit:'sekai', type:'num', suffix:'度', answer:e,
    text: `日本より時刻が ${h} 時間おくれている国があります。この国の標準時子午線は、東経何度ですか。`,
    steps: [
      { say: `<b>経度15度で1時間</b>の時差。まず、${h} 時間の差が経度何度分にあたるかを出します。`, math: `15 × ${h} ＝ ${15 * h}（度）` },
      { say: '<b>時刻がおくれている国は、日本より西にある</b>ので、日本の東経135度から経度の差をひきます。', math: `${JP_LON} － ${15 * h} ＝ ${e}` },
      answerStep(`東経 ${e} 度`)
    ] };
}

// 地形図の縮尺
function calcScale(){
  const s = pick([25000, 50000]), name = s === 25000 ? '2万5千分の1' : '5万分の1', cm = rnd(2, 8), m = cm * s / 100;
  if (Math.random() < 0.5){
    return { unit:'sekai', type:'num', suffix:'m', answer:m,
      text: `${name}の地形図があります。この地図上で ${cm} cm の長さは、実際には何 m ですか。`,
      steps: [
        { say: `<b>実際の距離 ＝ 地図上の長さ × 縮尺の分母</b>。${name}の地図なので、${s} をかけます。`, math: `${cm} × ${s} ＝ ${cm * s}（cm）` },
        { say: '<b>1 m ＝ 100 cm</b> なので、100 でわって m に直します。', math: `${cm * s} ÷ 100 ＝ ${m}` },
        answerStep(`${m} m`)
      ] };
  }
  return { unit:'sekai', type:'num', suffix:'cm', answer:cm,
    text: `${name}の地形図があります。実際の距離が ${m} m のとき、地図上では何 cm になりますか。`,
    steps: [
      { say: '同じ単位にそろえます。<b>1 m ＝ 100 cm</b>。', math: `${m} × 100 ＝ ${m * 100}（cm）` },
      { say: `<b>地図上の長さ ＝ 実際の距離 ÷ 縮尺の分母</b>。${name}の地図なので、${s} でわります。`, math: `${m * 100} ÷ ${s} ＝ ${cm}` },
      answerStep(`${cm} cm`)
    ] };
}

// 人口密度
function calcDensity(){
  const d = pick([3, 10, 25, 40, 80, 120, 150, 200, 250, 340]), a = rnd(2, 50), p = d * a;
  if (Math.random() < 0.5){
    return { unit:'kurashi', type:'num', suffix:'人', answer:d,
      text: `人口が ${p} 万人、面積が ${a} 万 km² の国があります。この国の人口密度は、1 km² あたり何人ですか。`,
      steps: [
        { say: '<b>人口密度 ＝ 人口 ÷ 面積</b>（1 km² あたりに何人が住んでいるか）です。', math: '人口密度（人/km²）＝ 人口（人）÷ 面積（km²）' },
        { say: '人口も面積も「万」の単位なので、<b>そのままわり算</b>できます。', math: `${p} ÷ ${a} ＝ ${d}` },
        answerStep(`${d} 人/km²`)
      ] };
  }
  return { unit:'kurashi', type:'num', suffix:'万人', answer:p,
    text: `面積が ${a} 万 km²、人口密度が 1 km² あたり ${d} 人の国があります。この国の人口は何万人ですか。`,
    steps: [
      { say: '<b>人口密度 ＝ 人口 ÷ 面積</b> なので、形をかえると <b>人口 ＝ 人口密度 × 面積</b> です。' },
      { say: '数を入れて計算します（面積が「万 km²」なので、答えも「万人」で出ます）。', math: `${d} × ${a} ＝ ${p}` },
      answerStep(`${p} 万人`)
    ] };
}

// 輸出額にしめる割合
function calcShare(){
  const total = 100 * rnd(3, 40), pct = pick([5, 10, 15, 20, 25, 30, 40, 50]), v = total * pct / 100;
  const item = pick(['機械類', '自動車', '原油', '衣類', 'コーヒー豆']);
  if (Math.random() < 0.5){
    return { unit:'kurashi', type:'num', suffix:'億ドル', answer:v,
      text: `ある国の輸出総額は ${total} 億ドルで、そのうち${item}が ${pct} % をしめています。${item}の輸出額は何億ドルですか。`,
      steps: [
        { say: '<b>くらべる量 ＝ もとにする量 × 割合</b>。もとにする量は輸出総額です。' },
        { say: `${pct} % は、100 でわって小数（または分数）に直して計算します。`, math: `${total} × ${pct} ÷ 100 ＝ ${v}` },
        answerStep(`${v} 億ドル`)
      ] };
  }
  return { unit:'kurashi', type:'num', suffix:'%', answer:pct,
    text: `ある国の輸出総額は ${total} 億ドルで、そのうち${item}が ${v} 億ドルです。${item}は輸出総額の何 % をしめていますか。`,
    steps: [
      { say: '<b>割合 ＝ くらべる量 ÷ もとにする量</b>。% にするので、さらに 100 をかけます。' },
      { say: '数を入れて計算します。', math: `${v} ÷ ${total} × 100 ＝ ${pct}` },
      answerStep(`${pct} %`)
    ] };
}

// 何世紀かを求める
function calcCentury(unit){
  const ev = pick(EVENTS.filter(e => e.unit === unit)), c = Math.ceil(ev.y / 100);
  return { unit, type:'num', suffix:'世紀', answer:c,
    text: `${ev.name}のは ${ev.y} 年です。${ev.y} 年は何世紀ですか。`,
    steps: [
      { say: '<b>1年〜100年が1世紀、101年〜200年が2世紀</b>。100年ずつのまとまりで数えます。' },
      { say: '<b>下2けたが「00」以外のときは、上のけたに1をたす</b>と世紀になります（ちょうど「00」のときは、上のけたがそのまま世紀）。',
        math: ev.y % 100 === 0 ? `${ev.y} 年 → ${ev.y / 100} 世紀` : `${Math.floor(ev.y / 100)} ＋ 1 ＝ ${c}（世紀）` },
      answerStep(`${c} 世紀`)
    ] };
}

// 2つのできごとの間の年数
function calcYearGap(unit){
  const list = shuffle(EVENTS.filter(e => e.unit === unit)).slice(0, 2).sort((a, b) => a.y - b.y);
  const [a, b] = list, gap = b.y - a.y;
  return { unit, type:'num', suffix:'年', answer:gap,
    text: `${a.name}のは ${a.y} 年、${b.name}のは ${b.y} 年です。この2つのできごとの間は何年ですか。`,
    steps: [
      { say: '<b>あとの年 － 前の年</b> で、間の年数が出ます。' },
      { say: '数を入れて計算します。', math: `${b.y} － ${a.y} ＝ ${gap}` },
      answerStep(`${gap} 年`)
    ] };
}

// 雨温図を SVG でかく（棒＝降水量、折れ線＝気温）
function climateChart(c){
  const W = 330, H = 200, L = 34, R = 36, T = 14, B = 24, iw = W - L - R, ih = H - T - B;
  const pmax = Math.max(300, Math.ceil(Math.max(...c.p) / 100) * 100), bw = iw / 12;
  const ty = v => (T + ih * (30 - v) / 60).toFixed(1);
  const py = v => (T + ih * (1 - v / pmax)).toFixed(1);
  const g = [];
  [20, 0, -20].forEach(v => {
    g.push(`<line class="gl" x1="${L}" y1="${ty(v)}" x2="${L + iw}" y2="${ty(v)}"/>`);
    g.push(`<text class="ax" x="${L - 5}" y="${+ty(v) + 4}" text-anchor="end">${numText(v)}</text>`);
  });
  [0, pmax / 2, pmax].forEach(v => g.push(`<text class="ax" x="${L + iw + 5}" y="${+py(v) + 4}" text-anchor="start">${v}</text>`));
  c.p.forEach((v, i) => {
    const h = ih * v / pmax;
    g.push(`<rect class="bar" x="${(L + bw * i + bw * 0.15).toFixed(1)}" y="${(T + ih - h).toFixed(1)}" width="${(bw * 0.7).toFixed(1)}" height="${h.toFixed(1)}"/>`);
  });
  g.push(`<line class="axis" x1="${L}" y1="${T + ih}" x2="${L + iw}" y2="${T + ih}"/>`);
  g.push(`<polyline class="tl" points="${c.t.map((v, i) => `${(L + bw * i + bw / 2).toFixed(1)},${ty(v)}`).join(' ')}"/>`);
  c.t.forEach((v, i) => g.push(`<circle class="td" cx="${(L + bw * i + bw / 2).toFixed(1)}" cy="${ty(v)}" r="2.4"/>`));
  [0, 3, 6, 9, 11].forEach(i => g.push(`<text class="ax" x="${(L + bw * i + bw / 2).toFixed(1)}" y="${H - 7}" text-anchor="middle">${i + 1}</text>`));
  return `<svg class="ondan" viewBox="0 0 ${W} ${H}" role="img" aria-label="${c.city}の雨温図">${g.join('')}</svg>`;
}

/* ---- データから問題を作る ---- */

function termSteps(t){
  return [
    { say: `<b>${t.term}</b>：${t.desc}。` },
    ...(t.note ? [{ say: t.note }] : []),
    answerStep(t.term)
  ];
}
// 用語 → えらぶ
function termChoice(t){
  const pool = TERMS.filter(x => x.unit === t.unit && x.group === t.group).map(x => x.term);
  return { unit:t.unit, type:'choice', answer:t.term, choices:makeChoices(t.term, pool), item:'term:' + t.term, label:t.term,
    text: `${t.desc}を何といいますか。`, steps: termSteps(t) };
}
// 用語 → 思い出す
function termRecall(t){
  return { unit:t.unit, type:'recall', answer:t.term, item:'term:' + t.term, label:t.term,
    text: `${t.desc}を何といいますか。`, steps: termSteps(t) };
}
// 用語 → 漢字で書く（お手本とくらべて自分で ○×）
function termWrite(t){
  return { unit:t.unit, type:'write', answer:t.term, sub:`読み：${t.y}`, item:'term:' + t.term, label:t.term,
    text: `${t.desc}を何といいますか。<b>漢字</b>で右のマスに書きましょう。`,
    steps: [
      { say: 'お手本と、自分の書いた字を1字ずつくらべよう。<b>社会の用語は、漢字で正しく書けてこそ使える</b>ようになります。' },
      ...termSteps(t)
    ] };
}
// 分類 → えらぶ
function sortChoice(s){
  const names = Object.keys(s.cats), cat = pick(names), item = pick(s.cats[cat]);
  return { unit:s.unit, type:'choice', answer:cat, choices:makeChoices(cat, names),
    item: 'sort:' + SORTS.indexOf(s), label: '分類：' + names.join('・'),
    text: `${s.ask}<span class="item">${item}</span>`,
    steps: [
      { say: s.rule },
      { say: `「${item}」は <b>${cat}</b> に当てはまります。` },
      answerStep(cat)
    ] };
}
// 県庁所在地
function kenchoQuestion(k){
  k = k || pick(KENCHO);
  const pool = KENCHO.filter(x => x.k !== k.k).map(x => x.s);
  const steps = [
    { say: '<b>県名と県庁所在地の名前がちがう県</b>は、セットで覚えよう。' },
    { say: `<b>${k.k}</b> の県庁所在地は <b>${k.s}</b>。` },
    answerStep(k.s)
  ];
  if (Math.random() < 0.6){
    return { unit:'sekai', type:'choice', answer:k.s, choices:makeChoices(k.s, pool), item:'kencho:' + k.k, label:'県庁所在地：' + k.k,
      text: `${k.k}の県庁所在地はどこですか。`, steps };
  }
  return { unit:'sekai', type:'recall', answer:k.s, item:'kencho:' + k.k, label:'県庁所在地：' + k.k,
    text: `${k.k}の県庁所在地を思い出しましょう。`, steps };
}
// できごとの順番
function eventOrder(unit){
  const two = shuffle(EVENTS.filter(e => e.unit === unit)).slice(0, 2).sort((a, b) => a.y - b.y);
  const [a, b] = two;
  return { unit, type:'choice', answer:a.name, choices:shuffle([a.name, b.name]),
    item: 'event:' + unit, label: 'できごとの前後（' + (unit === 'kodai' ? '古代' : '武士の世') + '）',
    text: '次の2つのできごとのうち、<b>先に</b>起こったのはどちらですか。',
    steps: [
      { say: `<b>${a.name}</b>のは <b>${a.y}年</b>（${a.era}）。` },
      { say: `<b>${b.name}</b>のは <b>${b.y}年</b>（${b.era}）。` },
      { say: `${b.y} 年より ${a.y} 年のほうが前なので、先に起こったのは「${a.name}」です。` },
      answerStep(a.name)
    ] };
}
// 雨温図の資料から読みとる
function climateQuestion(src){
  src = src || pick(CLIMATE);
  // 数を少しだけゆらして、同じ都市でも毎回ちがうグラフにする
  const c = { ...src,
    t: src.t.map(v => v + rnd(-1, 1)),
    p: src.p.map(v => Math.round(v * (85 + rnd(0, 30)) / 100)) };
  const hot = Math.max(...c.t), cold = Math.min(...c.t), sum = c.p.reduce((s, v) => s + v, 0);
  const shiryo = { title: 'ある都市の雨温図', body: climateChart(c) };
  const read = { say: `グラフを読みとると、最も暖かい月は約 ${hot}℃、最も寒い月は約 ${numText(cold)}℃（差は ${hot - cold}℃）、年間の降水量は約 ${sum} mm です。` };
  const r = Math.random();
  if (r < 0.25){
    const ans = c.south ? '南半球' : '北半球';
    return { unit:'kurashi', type:'choice', answer:ans, choices:['北半球', '南半球'], shiryo, item:'climate:' + src.city, label:'雨温図：' + src.city,
      text: 'この雨温図の都市は、北半球と南半球のどちらにありますか。',
      steps: [
        { say: '<b>北半球と南半球では季節が逆</b>になります。気温のグラフの山が、いつできているかを見ます。' },
        { say: `このグラフで気温が高いのは ${c.south ? '12〜2月ごろで、7〜8月ごろが最も低くなっています' : '7〜8月ごろで、12〜2月ごろが最も低くなっています'}。` },
        { say: `${c.south ? '日本と反対の季節なので' : '日本と同じ季節なので'} <b>${ans}</b> です。` },
        answerStep(ans)
      ] };
  }
  if (r < 0.45){
    const pool = CLIMATE.filter(x => x.zone !== c.zone).map(x => x.city);
    return { unit:'kurashi', type:'choice', answer:c.city, choices:makeChoices(c.city, pool), shiryo, item:'climate:' + src.city, label:'雨温図：' + src.city,
      text: 'この雨温図に当てはまる都市はどれですか。',
      steps: [
        { say: '<b>まず気温</b>（最も暖かい月・最も寒い月・その差）、<b>つぎに降水量</b>の多い時期を読みとって、気候帯を決めます。' },
        read,
        { say: c.why },
        { say: `選択肢の中で ${c.zone}（${c.sub}）に当てはまるのは <b>${c.city}</b> です。` },
        answerStep(c.city)
      ] };
  }
  return { unit:'kurashi', type:'choice', answer:c.zone, choices:makeChoices(c.zone, ['熱帯', '乾燥帯', '温帯', '亜寒帯', '寒帯']), shiryo, item:'climate:' + src.city, label:'雨温図：' + src.city,
    text: 'この雨温図に当てはまる気候帯はどれですか。',
    steps: [
      { say: '<b>まず気温</b>を見ます。最も寒い月が18℃以上 → 熱帯、最も暖かい月が10℃未満 → 寒帯、冬が−3℃より低く夏が暖かい → 亜寒帯、四季がはっきり → 温帯。<b>降水量がとても少なければ乾燥帯</b>です。' },
      read,
      { say: c.why },
      answerStep(`${c.zone}（${c.sub}）`)
    ] };
}

  calcTimeDiff:'時差の計算', calcLocalTime:'現地の時刻の計算', calcMeridian:'標準時子午線の計算', calcScale:'縮尺の計算',
  calcDensity:'人口密度の計算', calcShare:'割合の計算', calcCentury:'何世紀かの計算', calcYearGap:'年数の計算'
};
const CALC_ALL = {};
Object.keys(CALC).forEach(u => CALC[u].forEach(f => { CALC_ALL[f.name] = f; }));
function calcQuestion(f, unit){
  const q = f(unit);
  q.item = 'calc:' + f.name + ':' + unit;
  q.label = (CALC_LABEL[f.name] || f.name);
  return q;
}
// 復習ボックスの項目から、同じきまりの新しい問題を作りなおす
function regenFor(key){
  if (key.slice(0, 2) === 'a:') return regenAdv(key);   // 応用の問題は、応用のまま作りなおす
  const i = key.indexOf(':'), kind = key.slice(0, i), id = key.slice(i + 1);
  if (kind === 'term'){
    const t = TERMS.find(x => x.term === id);
    if (!t) return null;
    const r = Math.random();
    return r < 0.5 ? termChoice(t) : (r < 0.75 && t.y ? termWrite(t) : termRecall(t));
  }
  if (kind === 'sort'){ const s = SORTS[Number(id)]; return s ? sortChoice(s) : null; }
  if (kind === 'kencho'){ const k = KENCHO.find(x => x.k === id); return k ? kenchoQuestion(k) : null; }
  if (kind === 'climate'){ const c = CLIMATE.find(x => x.city === id); return c ? climateQuestion(c) : null; }
  if (kind === 'event'){ return EVENTS.some(e => e.unit === id) ? eventOrder(id) : null; }
  if (kind === 'calc'){
    const at = id.indexOf(':'), f = CALC_ALL[id.slice(0, at)];
    return f ? calcQuestion(f, id.slice(at + 1)) : null;
  }
  return null;
}

// えらぶ問題は、用語・分類・その分野だけの問題（県庁所在地／雨温図／できごとの順番）をまぜて出す
function choiceQuestion(unit){
  const sorts = SORTS.filter(s => s.unit === unit);
  const r = Math.random();
  if (r < 0.28){
    if (unit === 'sekai') return kenchoQuestion();
    if (unit === 'kurashi') return climateQuestion();
    return eventOrder(unit);
  }
  if (r < 0.58 && sorts.length) return sortChoice(pick(sorts));
  return termChoice(pick(TERMS.filter(t => t.unit === unit)));
}

function genShakai(unit){
  const calcs = CALC[unit] || [];
  const terms = TERMS.filter(t => t.unit === unit);
  const writables = terms.filter(t => t.y);   // 読みをつけた用語だけ「漢字で書く」問題にする
  const r = Math.random();
  if (r < TYPE_RATE.num && calcs.length) return calcQuestion(pick(calcs), unit);
  if (r < TYPE_RATE.num + TYPE_RATE.choice) return choiceQuestion(unit);
  if (r < TYPE_RATE.num + TYPE_RATE.choice + TYPE_RATE.write && writables.length) return termWrite(pick(writables));
  return termRecall(pick(terms));
}

// 時差と飛行時間を組み合わせて、到着時の現地時刻を求める
function advTimeFlight(){
  const c = pick(CITIES.filter(x => x.e !== JP_LON));
  const diff = (JP_LON - c.e) / 15;            // 日本が進んでいる時間（負なら日本がおくれている）
  const dep = rnd(6, 22), fly = rnd(2, 13);
  const tokyo = dep + fly, tokyoH = tokyo % 24;    // 東京の時刻のままの到着時刻
  const raw = tokyoH - diff;
  const local = ((raw % 24) + 24) % 24;
  return { unit:'sekai', type:'num', suffix:'時', answer:local,
    text: `東京（東経135度）を5月10日の ${dep} 時に出発する飛行機が、${fly} 時間かけて${c.n}（${lonText(c.e)}）に着きます。着いたときの<b>現地の時刻</b>は何時ですか。24時制で答えましょう。`,
    steps: [
      { say: '<b>①「出発地の時刻のまま到着時刻を出す」→ ②「時差を使って現地時刻に直す」</b>の順で考えると、こんがらがりません。' },
      { say: '① 東京の時刻のままなら、到着は何時かを出します。',
        math: tokyo >= 24 ? [`${dep} ＋ ${fly} ＝ ${tokyo}`, `24 をこえたので ${tokyo} － 24 ＝ ${tokyo - 24}（翌日の ${tokyo - 24} 時）`] : `${dep} ＋ ${fly} ＝ ${tokyo}（東京の時刻）` },
      { say: '② 時差を出します。<b>経度15度で1時間</b>。', math: [lonGapMath(c.e), `${lonGap(c.e)} ÷ 15 ＝ ${Math.abs(diff)}（時間）`] },
      { say: `<b>東にある地点ほど時刻が進んでいる</b>。${diff > 0 ? `${c.n}は東京より ${diff} 時間おくれているので、東京の時刻から ${diff} をひきます。` : `${c.n}は東京より ${Math.abs(diff)} 時間進んでいるので、東京の時刻に ${Math.abs(diff)} をたします。`}`,
        math: raw === local
          ? `${tokyoH} ${diff > 0 ? '－ ' + diff : '＋ ' + Math.abs(diff)} ＝ ${local}`
          : [`${tokyoH} ${diff > 0 ? '－ ' + diff : '＋ ' + Math.abs(diff)} ＝ ${numText(raw)}`,
             raw < 0 ? `0時より前になったので 24 をたして ${local} 時（前の日）` : `24時をこえたので 24 をひいて ${local} 時（次の日）`] },
      answerStep(`${local} 時`)
    ] };
}

function makeQuestions(unitId, n, lv){
  const list = [];
  const units = unitId === 'mix' ? UNITS.filter(u => u.id !== 'mix').map(u => u.id) : [unitId];
  const seen = new Set();
  let guard = 0;
  while (list.length < n && guard < n * 80){
    guard++;
    const u = pick(units);
    const q = useAdv(lv, u) ? makeAdv(u) : genShakai(u);
    const key = q.type + q.text.replace(/<[^>]*>/g, '');
    if (seen.has(key)) continue;   // 同じ問題が重ならないように
    seen.add(key);
    list.push(q);
  }
  return list;
}

const BOX_KEY = 'study-drill-review-shakai';   // 復習ボックスの記録（この端末だけ）

/* ============================================================
   1-2. 復習ボックス（5つのアプリで共通。まちがえた問題を、日をあけて出しなおす）
      とき方を読むだけでは、記憶に残りにくい（読むと「わかった気」になりやすい）。
      <b>自分の力でもう一度思い出すこと</b>と、<b>間をあけてくり返すこと</b>で、
      記憶はいちばん強くなる（検索練習・分散学習）。そこで、
        ・まちがえた問題の「きまり（項目）」をこの端末に記録する
        ・1日後 → 3日後 → 1週間後 → 16日後 → 35日後 と、間かくをのばして出しなおす
        ・出すのは同じ問題ではなく、同じきまりから作った<b>新しい問題</b>（regenFor）
          問題文ごと覚えてしまうと「解けた気」になるだけで、考え方が身につかないため
        ・正解しても、同じ日のうちは間かくを進めない（間をあけることに意味があるため）
        ・BOX_STEPS ぶん正解できたら、その項目は卒業（記録から消える）
      記録はこの端末（localStorage）だけに残る。Safari のサイトデータを消すと、記録も消える。
   ============================================================ */
const BOX_STEPS = [1, 3, 7, 16, 35];   // 正解するたびに、つぎの復習までの日数をのばす

// 今日が「1970年から何日目か」。時こくを気にせず日づけの計算ができるようにする
function today(){
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return Math.round(d.getTime() / 86400000);
}
let box = null;
function getBox(){
  if (!box){
    try { box = JSON.parse(localStorage.getItem(BOX_KEY)); } catch (e) { box = null; }
    if (!box || typeof box !== 'object') box = {};
  }
  return box;
}
function saveBox(){ try { localStorage.setItem(BOX_KEY, JSON.stringify(getBox())); } catch (e) {} }

// まちがえた → 箱をいちばん最初にもどして、あした もう一度
function boxMiss(q){
  if (!q.item) return;
  const b = getBox(), t = today();
  const it = b[q.item] || (b[q.item] = { n: 0, ng: 0 });
  it.n = 0;
  it.due = t + 1;
  it.d = t;
  it.ng = (it.ng || 0) + 1;
  it.label = q.label || it.label || q.item;
  saveBox();
}
// 正解した → つぎの復習までの間かくをのばす。卒業したら true
function boxHit(q){
  if (!q.item) return false;
  const b = getBox(), t = today(), it = b[q.item];
  if (!it || it.d === t) return false;   // 記録がない、または同じ日にもう進めたときは何もしない
  it.n++;
  it.d = t;
  if (it.n >= BOX_STEPS.length){ delete b[q.item]; saveBox(); return true; }
  it.due = t + BOX_STEPS[it.n];
  saveBox();
  return false;
}
// 今日出す分（間かくが来たもの）。まちがえた回数が多いものを先に
function dueKeys(){
  const b = getBox(), t = today();
  return Object.keys(b).filter(k => b[k].due <= t).sort((x, y) => b[x].due - b[y].due || b[y].ng - b[x].ng);
}
function boxSize(){ return Object.keys(getBox()).length; }
function nextDueDay(){
  const b = getBox(), ds = Object.keys(b).map(k => b[k].due);
  return ds.length ? Math.min(...ds) : null;
}
// 日づけを「今日」「あした」「9月20日」のように表す
function dayText(d){
  const t = today();
  if (d <= t) return '今日';
  if (d === t + 1) return 'あした';
  const dt = new Date();
  dt.setHours(0, 0, 0, 0);
  dt.setDate(dt.getDate() + (d - t));
  return (dt.getMonth() + 1) + '月' + dt.getDate() + '日';
}
// 復習の問題を作る（記録した項目から、新しい問題を作りなおす）
function makeReviewQuestions(n){
  const list = [];
  for (const key of dueKeys()){
    if (list.length >= n) break;
    const q = regenFor(key);
    if (q){ q.item = key; q.review = true; list.push(q); }
  }
  return list;
}
// 結果画面に出す、復習ボックスのようす
function boxStateHTML(grad){
  const next = nextDueDay(), n = boxSize();
  const g = grad ? `<b>${grad}問</b>が復習ボックスを卒業しました（${BOX_STEPS.length}回、間をあけて正解できました）。<br>` : '';
  if (!n) return `<p class="box-state">${g}復習ボックスは空です。まちがえた問題は、ここに入って あした からもう一度出ます。</p>`;
  return `<p class="box-state">${g}復習ボックス：<b>${n}問</b>／つぎの復習は <b>${dayText(next)}</b>。<br>同じ日にくり返すより、<b>日をあけて思い出す</b>ほうが忘れにくくなります。</p>`;
}

const SUBJECT = 'shakai';                        // 教科のID（記録につける）
const LOG_KEY = 'study-drill-log-shakai';   // 学習の記録（この端末だけ）

// この教科にある項目（進み具合の分母になる）
const ALL_ITEMS = [
  ...TERMS.map(t => 'term:' + t.term),
  ...SORTS.map((s, i) => 'sort:' + i),
  ...KENCHO.map(k => 'kencho:' + k.k),
  ...CLIMATE.map(c => 'climate:' + c.city),
  'event:kodai', 'event:chusei',
  ...[].concat(...Object.keys(CALC).map(u => CALC[u].map(f => `calc:${f.name}:${u}`))),

/* ============================================================
   1-3. 学習の記録と送信（5つのアプリで共通）
      子どもの「がんばりの記録」（kiroku.html）と保護者ページ（oya.html）で使う。
        ・記録はこの端末（localStorage）に残す。ドリル本体はこれまでどおりオフラインで動く。
        ・送信先（Google Apps Script の URL）を設定したときだけ、記録を送る。
          設定していなければ、送るものをためておくだけで、動きは何も変わらない。
        ・送信は勉強のじゃまをしない（失敗しても、次に成功したときにまとめて送る）。
      記録するのは学習の中身だけ。名前などの個人情報は入れない。
   ============================================================ */
const LOG_VER = 1;
let log = null;
function getLog(){
  if (!log){
    try { log = JSON.parse(localStorage.getItem(LOG_KEY)); } catch (e) { log = null; }
    if (!log || typeof log !== 'object') log = {};
  }
  if (!Array.isArray(log.ses)) log.ses = [];    // 1回ごと：[日, 分野, 復習か, 出題数, 正解数, 秒]
  if (!log.item || typeof log.item !== 'object') log.item = {};   // 項目ごと：[出題数, 正解数, まちがい, 最後の日, 卒業した日, 分野]
  if (!log.label || typeof log.label !== 'object') log.label = {};
  if (!log.day || typeof log.day !== 'object') log.day = {};    // 項目ごと：別々の日に正解した回数（ランクに使う。送信はしない）
  if (!log.rec || typeof log.rec !== 'object') log.rec = {};    // 分野ごと：直近20問の正誤（じどうレベルに使う。送信はしない）
  if (!log.up || typeof log.up !== 'object') log.up = {};       // じどうで「おうよう」に上がったことを知らせた分野
  log.v = LOG_VER;
  log.total = ALL_ITEMS.length;                 // この教科の項目の総数（進み具合の分母）
  return log;
}
function saveLog(){ try { localStorage.setItem(LOG_KEY, JSON.stringify(getLog())); } catch (e) {} }

// 1問ごとの記録（grad は、この正解で復習ボックスを卒業したかどうか）
function logQuestion(q, ok, grad){
  if (!q.item) return;
  const L = getLog(), t = today();
  const r = L.item[q.item] || (L.item[q.item] = [0, 0, 0, 0, 0, '']);
  // 「別々の日に正解した回数」は、その日の1回目だけ数える（同じ日にくり返しても増やさない）
  const firstToday = r[3] !== t, base = okDays(q.item);
  r[0]++;
  if (ok) r[1]++; else r[2]++;
  if (ok && firstToday) L.day[q.item] = base + 1;
  r[3] = t;
  if (grad) r[4] = t;
  r[5] = q.unit || r[5] || '';
  L.label[q.item] = q.label || q.item;
  saveLog();
  queueRow(['i', SUBJECT, q.item, L.label[q.item], r[0], r[1], r[2], r[3], r[4], r[5]]);
}
// 1回ぶんの記録
function logSession(unit, mode, n, right, ms){
  const L = getLog(), t = today(), sec = Math.round(ms / 1000), rv = mode === 'review' ? 1 : 0;
  L.ses.push([t, unit, rv, n, right, sec]);
  saveLog();
  queueRow(['s', SUBJECT, t, unit, rv, n, right, sec]);
  queueRow(['t', SUBJECT, ALL_ITEMS.length]);
  syncFlush();
}

/* ---- 送信（設定したときだけ動く）---- */
const SYNC_KEY = 'study-drill-sync';   // 送信先の設定と、まだ送れていない記録（5教科で共通）
function getSync(){
  let s = null;
  try { s = JSON.parse(localStorage.getItem(SYNC_KEY)); } catch (e) { s = null; }
  if (!s || typeof s !== 'object') s = {};
  if (!Array.isArray(s.q)) s.q = [];
  return s;
}
function saveSync(s){ try { localStorage.setItem(SYNC_KEY, JSON.stringify(s)); } catch (e) {} }
// 送るものをためる。項目の記録は「最新の状態」だけでよいので、同じ項目の古い行は消す
function queueRow(row){
  const s = getSync();
  if (row[0] === 'i' || row[0] === 't'){
    s.q = s.q.filter(r => !(r[0] === row[0] && r[1] === row[1] && r[2] === row[2]));
  }
  s.q.push(row);
  if (s.q.length > 4000) s.q = s.q.slice(-4000);   // 増えすぎたら古いものから捨てる
  saveSync(s);
}
// たまっている記録を送る。勉強の動きは止めない（失敗しても、次のときにまた送る）
function syncFlush(){
  const s = getSync();
  if (!s.url || !s.q.length) return;
  if (typeof navigator !== 'undefined' && navigator.onLine === false) return;
  const rows = s.q.slice(0, 500);
  const body = JSON.stringify({ k: s.key || '', name: s.name || '', rows });
  const done = () => {
    const t = getSync();
    t.q = t.q.slice(rows.length);
    t.at = Date.now();
    saveSync(t);
  };
  try {
    // ふつうに送って、返事が読めたら成功。読めないとき（CORS）は no-cors でもう一度送る
    fetch(s.url, { method: 'POST', body })
      .then(r => { if (r.ok) done(); })
      .catch(() => fetch(s.url, { method: 'POST', mode: 'no-cors', body }).then(done).catch(() => {}));
  } catch (e) {}
}

/* ============================================================
   2. 手書き数字の読みとり（数学ドリルと同じしくみ。時差や人口密度などの計算で使う）
      数字の見本の形と、書いた線を「点の集まり」にしてくらべ、
      いちばん近い数字を選ぶ（$P Point-Cloud Recognizer という方法）。
      読みまちがえた字をキーで直すと、その形を見本に追加して覚える。
   ============================================================ */
const INK_N = 32;             // 1文字を何個の点でくらべるか
const INK_LIMIT = 9;          // これより遠い形は「読みとれない」にする
const INK_KEY = 'math-drill-ink';

// 見本の形を作る部品（横0〜0.7、たて0〜1の枠で考える。角度は右が0°、下が90°）
function arc(cx, cy, rx, ry, t0, t1){
  const pts = [];
  for (let k = 0; k <= 24; k++){
    const t = (t0 + (t1 - t0) * k / 24) * Math.PI / 180;
    pts.push({ x: cx + rx * Math.cos(t), y: cy + ry * Math.sin(t) });
  }
  return pts;
}
function line(...xy){
  const pts = [];
  for (let k = 0; k < xy.length; k += 2) pts.push({ x: xy[k], y: xy[k + 1] });
  return pts;
}
// 数字ごとの書き方のパターン。[ 1画目, 2画目, … ]、1画は部品をつなげたもの
const SHAPES = {
  '0': [ [[arc(.35, .5, .33, .5, 270, 630)]], [[arc(.35, .5, .22, .5, 250, 610)]] ],
  '1': [ [[line(.35, 0, .35, 1)]], [[line(.22, .14, .4, 0, .4, 1)]], [[line(.22, .14, .4, 0, .4, 1)], [line(.12, 1, .68, 1)]] ],
  '2': [ [[arc(.35, .3, .32, .3, 190, 360), line(.67, .3, .02, 1, .7, 1)]], [[arc(.35, .3, .32, .3, 200, 400), line(.02, 1, .7, 1)]] ],
  '3': [ [[arc(.33, .26, .3, .26, 200, 450), arc(.33, .74, .34, .26, 270, 520)]], [[line(.05, 0, .65, 0, .3, .42), arc(.33, .71, .34, .29, 280, 520)]] ],
  '4': [ [[line(.5, 0, 0, .68, .72, .68)], [line(.52, .28, .52, 1)]], [[line(.12, 0, .05, .62, .72, .62)], [line(.55, 0, .55, 1)]], [[line(.55, 1, .55, 0, 0, .68, .72, .68)]] ],
  '5': [ [[line(.15, 0, .1, .44), arc(.36, .7, .32, .29, 235, 500)], [line(.15, 0, .65, 0)]], [[line(.65, 0, .15, 0, .1, .44), arc(.36, .7, .32, .29, 235, 500)]] ],
  '6': [ [[arc(.62, .72, .57, .72, 265, 180), arc(.35, .72, .3, .28, 180, -180)]] ],
  '7': [
    [[line(.02, 0, .68, 0, .25, 1)]], [[line(.02, .22, .02, 0, .68, 0, .3, 1)]], [[line(.02, .25, .02, 0)], [line(.08, 0, .68, 0, .3, 1)]],
    // 1画目に長いたて棒、右がほぼまっすぐ下におりる「7」
    [[line(.02, .5, .02, 0)], [line(.06, .06, .68, .04, .55, 1)]], [[line(.02, .5, .02, 0)], [line(.06, .06, .68, .04, .64, 1)]],
    [[line(.04, .45, .04, 0, .68, 0, .56, 1)]]
  ],
  '8': [ [[arc(.35, .25, .26, .25, 90, 450), arc(.35, .74, .33, .26, 270, 630)]] ],
  '9': [ [[arc(.35, .28, .3, .28, 0, -360), line(.65, .28, .62, 1)]], [[arc(.35, .28, .3, .28, 0, -360), arc(.2, .28, .45, .72, 0, 90)]] ]
};

function dist(p, q){ return Math.hypot(p.x - q.x, p.y - q.y); }

// 何画かの線を、INK_N 個の点に並べなおして、大きさと位置をそろえる
function cloud(strokes){
  const pts = [];
  strokes.forEach((s, id) => s.forEach(p => pts.push({ x: p.x, y: p.y, id })));
  let L = 0;
  for (let i = 1; i < pts.length; i++) if (pts[i].id === pts[i - 1].id) L += dist(pts[i - 1], pts[i]);
  const I = L / (INK_N - 1), out = [{ x: pts[0].x, y: pts[0].y }];
  let D = 0;
  for (let i = 1; I > 0 && i < pts.length; i++){
    if (pts[i].id !== pts[i - 1].id) continue;
    const d = dist(pts[i - 1], pts[i]);
    if (D + d >= I && d > 0){
      const t = (I - D) / d;
      const q = { x: pts[i - 1].x + t * (pts[i].x - pts[i - 1].x), y: pts[i - 1].y + t * (pts[i].y - pts[i - 1].y), id: pts[i].id };
      out.push(q);
      pts.splice(i, 0, q);
      D = 0;
    } else D += d;
  }
  const last = pts[pts.length - 1];
  while (out.length < INK_N) out.push({ x: last.x, y: last.y });
  out.length = INK_N;

  const xs = out.map(p => p.x), ys = out.map(p => p.y);
  const minX = Math.min(...xs), minY = Math.min(...ys);
  const size = Math.max(Math.max(...xs) - minX, Math.max(...ys) - minY) || 1;
  out.forEach(p => { p.x = (p.x - minX) / size; p.y = (p.y - minY) / size; });
  const cx = out.reduce((s, p) => s + p.x, 0) / INK_N, cy = out.reduce((s, p) => s + p.y, 0) / INK_N;
  return out.map(p => ({ x: p.x - cx, y: p.y - cy }));
}

function cloudDist(a, b, start, stop){
  const used = new Array(INK_N).fill(false);
  let sum = 0, i = start;
  do {
    let min = Infinity, idx = 0;
    for (let j = 0; j < INK_N; j++){
      if (used[j]) continue;
      const d = dist(a[i], b[j]);
      if (d < min){ min = d; idx = j; }
    }
    used[idx] = true;
    sum += (1 - ((i - start + INK_N) % INK_N) / INK_N) * min;
    if (sum >= stop) return sum;
    i = (i + 1) % INK_N;
  } while (i !== start);
  return sum;
}
function cloudDistance(a, b, stop){
  let best = stop;
  for (let i = 0; i < INK_N; i += Math.floor(Math.sqrt(INK_N))){
    best = Math.min(best, cloudDist(a, b, i, best), cloudDist(b, a, i, best));
  }
  return best;
}

// 覚えた形（localStorage が使えないときも、開いている間は覚えておく）
let learned = null;
function getLearned(){
  if (!learned){
    try { learned = JSON.parse(localStorage.getItem(INK_KEY)) || {}; } catch (e) { learned = {}; }
  }
  return learned;
}
let templates = null;
function getTemplates(){
  if (templates) return templates;
  templates = [];
  for (const label in SHAPES){
    SHAPES[label].forEach(v => templates.push({ label, pts: cloud(v.map(pieces => [].concat(...pieces))) }));
  }
  const l = getLearned();
  for (const label in l){
    l[label].forEach(pts => templates.push({ label, pts: pts.map(([x, y]) => ({ x, y })) }));
  }
  return templates;
}
// 読みまちがえた字の形を覚える（数字ごとに新しい5個まで）
function learn(label, pts){
  const l = getLearned();
  l[label] = (l[label] || []).concat([pts.map(p => [+p.x.toFixed(3), +p.y.toFixed(3)])]).slice(-5);
  try { localStorage.setItem(INK_KEY, JSON.stringify(l)); } catch (e) {}
  templates = null;
}

function classify(strokes){
  const pts = cloud(strokes);
  let best = '?', bestD = INK_LIMIT * 2;
  for (const t of getTemplates()){
    const d = cloudDistance(pts, t.pts, bestD);
    if (d < bestD){ bestD = d; best = t.label; }
  }
  return { label: bestD < INK_LIMIT ? best : '?', d: bestD, pts };
}

// となりあう線のまとまり（run）を1文字として読み、読みにくさ（cost）をつける
function readChar(run, ref, first){
  const flat = g => g.maxX - g.minX > (g.maxY - g.minY) * 2 && g.maxY - g.minY < ref * 0.3;
  const minX = Math.min(...run.map(g => g.minX)), maxX = Math.max(...run.map(g => g.maxX));
  const minY = Math.min(...run.map(g => g.minY)), maxY = Math.max(...run.map(g => g.maxY));
  const w = maxX - minX, h = maxY - minY;
  const strokes = [].concat(...run.map(g => g.strokes));
  let merge = 0;
  if (run.length === 1){
    if (Math.max(w, h) < ref * 0.12) return { label: '', cost: 0 };                  // ペン先がふれただけの点
    if (flat(run[0])) return first ? { label: '-', cost: 1, pts: null } : { label: '?', cost: INK_LIMIT, pts: null };  // 横線は「−」
  } else {
    if (run.some(flat)) return null;
    let right = run[0].maxX;
    for (const g of run.slice(1)){
      if (g.minX - right > ref * 0.2) return null;                                  // はなれすぎた線は、同じ字にしない
      right = Math.max(right, g.maxX);
    }
    if (w > ref * 1.2) return null;
    // いちばん高いまとまり以外も背が高いときは、別々の字の可能性が高い（「10」の 1 と 0 など）
    const tall = run.map(g => Math.max(0, (g.maxY - g.minY) / ref - 0.6) * 25);
    merge = tall.reduce((s, t) => s + t, 0) - Math.max(...tall);
  }
  // 字の高さにくらべて低いもの（「7」の1画目のたて棒だけ、など）は、1文字としては読みにくい
  const small = Math.max(0, 0.75 - h / ref) * 30;
  if (strokes.length === 1 && w < h * 0.25 && h > ref * 0.4) return { label: '1', cost: 1 + small, pts: cloud(strokes) };  // たての細い線は「1」
  const c = classify(strokes);
  return { label: c.label, cost: 1 + c.d + small + merge, pts: c.pts };
}

// 答えの欄の線を、左から1文字ずつに分けて読む
function readInk(strokes, boxH){
  const items = strokes.map(pts => {
    const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
    return { pts, minX: Math.min(...xs), maxX: Math.max(...xs), minY: Math.min(...ys), maxY: Math.max(...ys) };
  }).sort((p, q) => p.minX - q.minX);

  // たての位置が重なる線は、同じ字（「4」「5」の2画目など）
  const groups = [];
  for (const it of items){
    const cx = (it.minX + it.maxX) / 2;
    const g = groups.find(g => {
      const gx = (g.minX + g.maxX) / 2;
      return (cx >= g.minX - 3 && cx <= g.maxX + 3) || (gx >= it.minX - 3 && gx <= it.maxX + 3);
    });
    if (g){
      g.strokes.push(it.pts);
      g.minX = Math.min(g.minX, it.minX); g.maxX = Math.max(g.maxX, it.maxX);
      g.minY = Math.min(g.minY, it.minY); g.maxY = Math.max(g.maxY, it.maxY);
    } else {
      groups.push({ strokes: [it.pts], minX: it.minX, maxX: it.maxX, minY: it.minY, maxY: it.maxY });
    }
  }

  // 1文字の区切り方をいくつか試して、いちばん自然に読める区切り方を選ぶ
  // （「7」の左上のチョンや「4」「5」の2画目が、少しはなれて書かれても1文字として読むため）
  const ref = Math.max(boxH * 0.3, ...groups.map(g => g.maxY - g.minY));
  const best = [{ cost: 0, chars: [] }];
  for (let i = 1; i <= groups.length; i++){
    best[i] = { cost: Infinity, chars: [] };
    for (let j = Math.max(0, i - 3); j < i; j++){
      const ch = readChar(groups.slice(j, i), ref, best[j].chars.length === 0);
      if (!ch || best[j].cost + ch.cost >= best[i].cost) continue;
      best[i] = { cost: best[j].cost + ch.cost, chars: ch.label ? best[j].chars.concat([ch]) : best[j].chars };
    }
  }
  const chars = best[groups.length].chars;
  return { text: chars.map(c => c.label).join(''), groups: chars };
}

/* ============================================================
   3. 手書きの線をかく（計算スペース・答えの欄）
   ============================================================ */
let lastPen = 0;   // Apple Pencil を最後に使った時刻（手のひらがふれても線をかかないため）
let inks = [];

function createInk(wrap, opt){
  const canvas = document.createElement('canvas');
  wrap.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  const ink = { strokes: [], tool: 'pen' };
  let cur = null;

  function style(){
    ctx.strokeStyle = opt.color; ctx.lineWidth = opt.width;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  }
  function redraw(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    style();
    for (const s of ink.strokes){
      ctx.beginPath();
      ctx.moveTo(s[0].x, s[0].y);
      if (s.length === 1) ctx.lineTo(s[0].x + 0.1, s[0].y);
      for (let i = 1; i < s.length; i++) ctx.lineTo(s[i].x, s[i].y);
      ctx.stroke();
    }
  }
  function resize(){
    const r = wrap.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.round(r.width * dpr));
    canvas.height = Math.max(1, Math.round(r.height * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    redraw();
  }
  function at(e){
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  function erase(p){
    const n = ink.strokes.length;
    ink.strokes = ink.strokes.filter(s => !s.some(q => dist(p, q) < 14));
    if (ink.strokes.length !== n){ cur.changed = true; redraw(); }
  }
  function changed(){ if (opt.onChange) opt.onChange(); }

  canvas.addEventListener('pointerdown', e => {
    if (opt.locked && opt.locked()) return;
    if (e.pointerType === 'pen'){
      lastPen = Date.now();
      if (cur && cur.type !== 'pen'){             // 先にふれた手のひらの線は取り消す
        const i = ink.strokes.indexOf(cur.s);
        if (i >= 0) ink.strokes.splice(i, 1);
        cur = null;
        redraw();
      }
    } else if (e.pointerType === 'touch' && Date.now() - lastPen < 5000) {
      return;                                     // ペンを使っている間は、指や手のひらを無視
    }
    if (cur) return;
    e.preventDefault();
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    const p = at(e);
    if (opt.onStart) opt.onStart();
    cur = { id: e.pointerId, type: e.pointerType };
    if (ink.tool === 'eraser') erase(p);
    else { cur.s = [p]; ink.strokes.push(cur.s); redraw(); }
  });
  canvas.addEventListener('pointermove', e => {
    if (!cur || e.pointerId !== cur.id) return;
    if (cur.type === 'pen') lastPen = Date.now();
    const evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
    for (const ev of evs.length ? evs : [e]){
      const p = at(ev);
      if (!cur.s){ erase(p); continue; }
      const last = cur.s[cur.s.length - 1];
      if (dist(p, last) < 1) continue;
      cur.s.push(p);
      style();
      ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    }
  });
  const end = e => {
    if (!cur || e.pointerId !== cur.id) return;
    const done = cur;
    cur = null;
    if (done.s || done.changed) changed();
  };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
  // 長押ししたときに、拡大鏡や文字選択が出ないようにする
  canvas.addEventListener('touchstart', e => e.preventDefault(), { passive: false });

  ink.clear = () => { ink.strokes = []; redraw(); changed(); };
  ink.undo = () => { if (ink.strokes.length){ ink.strokes.pop(); redraw(); changed(); } };
  ink.setTool = t => { ink.tool = t; };

  const ro = window.ResizeObserver ? new ResizeObserver(resize) : null;
  if (ro) ro.observe(wrap); else window.addEventListener('resize', resize);
  ink.destroy = () => { if (ro) ro.disconnect(); else window.removeEventListener('resize', resize); };
  resize();
  inks.push(ink);
  return ink;
}

/* ============================================================
   4. 画面の状態
   ============================================================ */
const app = document.getElementById('app');
/* ============================================================
   1-4. 習得ポイントとランク（5つのアプリで共通。どれかを直したら、ほかの4つにも同じ修正を入れる）
      「レベルが上がる」しくみは、点数やコインのごほうびにはしない。
      外からのごほうびをつけると、もともとあったやる気のほうが弱くなってしまうため。
      そこでランクは、<b>いまの力をうつす鏡</b>にする。元にするのは、
        ・卒業した項目（間をあけて5回思い出せた）
        ・復習ボックスの進みぐあい（日をあけて思い出せた回数）
        ・まちがえずに、別々の日に正解できた回数
      の3つ。どれも<b>同じ日にくり返しても増えない</b>ので、たくさん解くだけでは上がらない。
      ランクはいちど上がったら下がらない（下がると、むずかしい問題をさけるようになるため）。
   ============================================================ */
const MP_MAX = 5;                                                 // 項目1つの満点
const RANK_AT = [0, .015, .05, .11, .20, .32, .46, .62, .82];     // 満点にたいする割合（はじめは細かく、あとはゆっくり）
const RANK_KEY = 'study-drill-rank';                              // 到達した最高ランク（5教科ぶんをまとめて持つ）
const RANK_WORLD = '世界と時代の旅';
const RANKS = ['旅のしたく', '地図読み', '旅人', '探検家', '世界を知る人', '時代をたどる人', '歴史をよむ人', '世界をめぐる人', '語り部'];
const RANK_SUB = ['', '', '', '', '', '', '', '', ''];

function escAttr(s){ return String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' })[c]); }
function labelOf(key){ return getLog().label[key] || key; }

// 「別々の日に正解した回数」。古い記録には入っていないので、そのときは正解数（多くても3）で見なす
function okDays(key){
  const L = getLog();
  if (L.day[key] != null) return L.day[key];
  const r = L.item[key];
  return r ? Math.min(r[1], 3) : 0;
}
// 項目1つの習得ポイント（0〜5）
function mpOf(key){
  const r = getLog().item[key];
  if (!r) return 0;                                 // まだ出ていない
  if (r[4] > 0) return MP_MAX;                      // 卒業した
  const b = getBox()[key];
  if (b) return Math.min(1 + (b.n || 0), 4);        // 復習ボックスの中（日をあけて思い出すほど上がる）
  return Math.min(okDays(key), MP_MAX);             // まだ一度もまちがえていない
}
function mpTotal(){ let s = 0; for (const k of ALL_ITEMS) s += mpOf(k); return s; }
function mpMax(){ return ALL_ITEMS.length * MP_MAX; }
// 習得ポイントから、いまのランク（0から数える）
function rankIndex(mp){
  const max = mpMax();
  let i = 0;
  for (let k = 0; k < RANK_AT.length; k++) if (mp >= RANK_AT[k] * max) i = k;
  return i;
}
function getRanks(){
  let r = null;
  try { r = JSON.parse(localStorage.getItem(RANK_KEY)); } catch (e) {}
  return (r && typeof r === 'object') ? r : {};
}
// いまのランク（いちど上がったら下がらない）
function myRank(){ return Math.max(rankIndex(mpTotal()), getRanks()[SUBJECT] || 0); }
// ランクが上がったかどうかを見る。上がっていたら { from, to } を返して、覚えておく
function bumpRank(){
  const r = getRanks(), before = r[SUBJECT] || 0, now = rankIndex(mpTotal());
  if (now <= before) return null;
  r[SUBJECT] = now;
  try { localStorage.setItem(RANK_KEY, JSON.stringify(r)); } catch (e) {}
  return { from: before, to: now };
}
// つぎのランクまで、あといくつ
function toNextRank(){
  const i = myRank();
  if (i >= RANKS.length - 1) return null;
  return { need: Math.max(1, Math.ceil(RANK_AT[i + 1] * mpMax()) - mpTotal()), name: RANKS[i + 1] };
}
// トップ画面のいちばん上に出すランクの帯
function rankHTML(){
  const i = myRank(), mp = mpTotal(), max = mpMax(), nx = toNextRank();
  const from = RANK_AT[i] * max, to = nx ? RANK_AT[i + 1] * max : max;
  const pct = Math.max(4, Math.min(100, Math.round((mp - from) / Math.max(1, to - from) * 100)));
  return `
    <div class="rank">
      <span class="rank-no num">${i + 1}</span>
      <span class="rank-body">
        <b>${RANKS[i]}${RANK_SUB[i] ? `<i>${RANK_SUB[i]}</i>` : ''}</b>
        <span class="rank-bar"><u style="width:${pct}%"></u></span>
        <i>${nx ? `あと ${nx.need} すすむと「${nx.name}」` : RANK_WORLD + 'の いちばん上です'}</i>
      </span>
    </div>`;
}
// 結果画面に出す、ランクが上がったときの知らせ（上がった理由もそえる）
function rankUpHTML(up){
  if (!up) return '';
  const why = state.grad ? `${state.grad}つの項目が、間をあけて思い出せて身についたからです。`
    : state.recalled ? `日をあけてから思い出せた問題が ${state.recalled}つ あったからです。`
    : '一つずつ、たしかめながら進められたからです。';
  return `
    <div class="rankup">
      <b>ランクが上がりました</b>
      <span>${RANKS[up.from]} → ${RANKS[up.to]}</span>
      <i>${why}</i>
    </div>`;
}

/* ---- 習得マップ（項目1つ＝丸1つ。どこが空いているかが見えると、つぎにやることを自分で決められる）----
   色の意味は、がんばりの記録・保護者ページと同じにそろえる。
     身についた＝こい青 ／ できている＝うすい青 ／ 復習中＝オレンジ ／ まだ＝グレー */
const STATE_NAME = { grad:'身についた', ok:'できている', review:'復習中', rest:'まだ' };
function itemState(key){
  const r = getLog().item[key];
  if (!r) return 'rest';
  if (r[4] > 0) return 'grad';
  const b = getBox()[key];
  if (b && (b.n || 0) <= 1) return 'review';
  return 'ok';
}
function mapHTML(open){
  const g = {}, cnt = { grad:0, ok:0, review:0, rest:0 };
  ALL_ITEMS.forEach(k => {
    const u = unitOfItem(k) || 'other';
    (g[u] || (g[u] = [])).push(k);
    cnt[itemState(k)]++;
  });
  const rows = UNITS.filter(u => g[u.id]).map(u => [u.id, u.name]);
  if (g.other) rows.push(['other', 'そのほか']);
  const done = cnt.grad + cnt.ok + cnt.review;
  return `
    <details class="map"${open ? ' open' : ''}>
      <summary>習得マップ（${ALL_ITEMS.length}この項目のうち、${done}こに手がついています）</summary>
      <div class="map-body">
        ${rows.map(r => `
          <div class="map-row">
            <span class="map-name">${r[1]}</span>
            <span class="map-dots">${g[r[0]].map(k => `<i class="s-${itemState(k)}${open && state.touched && state.touched.has(k) ? ' hit' : ''}" title="${escAttr(labelOf(k))}"></i>`).join('')}</span>
          </div>`).join('')}
        <div class="map-key">
          ${Object.keys(STATE_NAME).map(s => `<span><i class="s-${s}"></i>${STATE_NAME[s]} <b class="num">${cnt[s]}</b></span>`).join('')}
        </div>
        <p class="map-note">丸ひとつが「きまり」ひとつです。日をあけて思い出せるたびに色がこくなり、5回できると<b>身についた</b>になります。</p>
      </div>
    </details>`;
}

/* ---- 今日のメニュー（3つから自分でえらぶ）----
   やることを自分で決められると、やらされている感じがへって続きやすい。
   えらべる形にしつつ、下の分野ボタンもそのまま残す。 */
function sampleKeys(a, n){
  const b = a.slice();
  for (let i = b.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); const t = b[i]; b[i] = b[j]; b[j] = t; }
  return b.slice(0, n);
}
// にがて：まちがえた回数が多い順（今日の復習に出るものは、かさならないように外す）
function weakKeys(){
  const L = getLog(), due = new Set(dueKeys()), all = new Set(ALL_ITEMS);
  return Object.keys(L.item)
    .filter(k => all.has(k) && !due.has(k) && L.item[k][2] > 0 && !L.item[k][4])
    .sort((a, b) => L.item[b][2] - L.item[a][2] || L.item[a][3] - L.item[b][3]);
}
// まだ一度も出ていない項目
function freshKeys(){
  const L = getLog();
  return ALL_ITEMS.filter(k => !L.item[k]);
}
// 項目のキーから問題を作る（作れないものはとばす）
function makeFromKeys(keys, n){
  const list = [];
  for (const k of keys){
    if (list.length >= n) break;
    const q = regenFor(k);
    if (q){ q.item = k; q.label = q.label || labelOf(k); list.push(q); }
  }
  return list;
}
function menuHTML(){
  const due = dueKeys().length, weak = weakKeys().length, fresh = freshKeys().length, next = nextDueDay();
  const card = (id, mark, title, note) =>
    `<button class="pick" id="${id}"><span class="mark">${mark}</span><span><b>${title}</b><i>${note}</i></span></button>`;
  let h = '';
  if (due) h += card('go-review', '⟳', `今日の復習　${Math.min(due, state.total)}問`,
    'まちがえた問題を、わすれたころに出しています。同じきまりの新しい問題です。');
  if (weak) h += card('go-weak', '▲', `にがて集中　${Math.min(weak, state.total)}問`,
    'まちがえた回数が多いものを集めました。あと少しで身につきます。');
  if (fresh) h += card('go-fresh', '＋', `新しいところ　${Math.min(fresh, state.total)}問`,
    `まだやっていない ${fresh}この項目から出します。`);
  if (!h) return '';
  const none = (!due && next !== null)
    ? `<p class="review-none">今日の復習はおわりました。<i>つぎの復習は ${dayText(next)}（${boxSize()}問）。</i></p>` : '';
  return `${none}<p class="pick-h">今日はどれにする？</p><div class="picks">${h}</div>`;
}
// トップ画面で、3つのカードにボタンの動きをつける
function bindMenu(){
  // 1問も作れなかったときは何もしない（画面がこわれないように）
  const go = (unit, qs, mode) => { if (qs.length){ state.unit = unit; startQuiz(qs, mode); } };
  const rv = document.getElementById('go-review');
  if (rv) rv.onclick = () => go('review', makeReviewQuestions(state.total), 'review');
  const wk = document.getElementById('go-weak');
  if (wk) wk.onclick = () => go('weak', makeFromKeys(weakKeys(), state.total), 'review');
  const fr = document.getElementById('go-fresh');
  if (fr) fr.onclick = () => go('fresh', makeFromKeys(sampleKeys(freshKeys(), state.total), state.total));
}

/* ---- じどうレベル（分野ごとに、ちょうどよい difficulty に合わせる）----
   正解が8〜9わりくらいのときに、学習はいちばん速く進む。
   そこで直近10問の正答率を見て、おうよう をまぜる割合を決める。
   上がったときだけ知らせて、下がったときは何も言わない（「下がった」と伝えると自信をけずるため）。 */
function advRate(unit){
  const a = getLog().rec[unit] || [];
  if (a.length < 10) return 0;
  const last = a.slice(-10), p = last.reduce((x, y) => x + y, 0) / last.length;
  return p >= .85 ? .7 : p >= .7 ? .3 : 0;
}
function useAdv(lv, unit){
  if (lv === 'adv') return true;
  if (lv !== 'auto') return false;
  return Math.random() < advRate(unit);
}
// 直近の正誤をためる（じどうレベルの判断だけに使う。送信はしない）
function pushRec(unit, ok){
  if (!unit) return;
  const L = getLog(), a = L.rec[unit] || (L.rec[unit] = []);
  a.push(ok ? 1 : 0);
  if (a.length > 20) a.splice(0, a.length - 20);
  saveLog();
}
// じどうで「おうよう」に上がった分野を、はじめの1回だけ知らせる
function advNewsHTML(){
  if (state.level !== 'auto') return '';
  const L = getLog(), news = [];
  UNITS.forEach(u => {
    if (!ADV[u.id] || !ADV[u.id].length) return;
    if (advRate(u.id) >= .7 && !L.up[u.id]){ L.up[u.id] = 1; news.push(u.name); }
  });
  if (!news.length) return '';
  saveLog();
  return `<p class="lv-note">${news.join('・')} が よくできているので、これからは <b>すこしむずかしい問題</b> を まぜます。</p>`;
}

// 項目のキーから、その項目がどの分野のものかを知る（習得マップで使う）
const ADV_UNIT = {};
Object.keys(ADV).forEach(u => ADV[u].forEach(f => { ADV_UNIT[f.name] = u; }));
function unitOfItem(key){
  const i = key.indexOf(':'), kind = key.slice(0, i), id = key.slice(i + 1);
  if (kind === 'a') return ADV_UNIT[id] || '';
  if (kind === 'term'){ const t = TERMS.find(x => x.term === id); return t ? t.unit : ''; }
  if (kind === 'sort'){ const s = SORTS[Number(id)]; return s ? s.unit : ''; }
  if (kind === 'kencho') return 'sekai';
  if (kind === 'climate') return 'kurashi';
  if (kind === 'event') return id;
  if (kind === 'calc'){ const at = id.indexOf(':'); return at < 0 ? '' : id.slice(at + 1); }
  return '';
}

const state = { unit:null, mode:'normal', level:getLevel(), total:10, qs:[], i:0, input:'', read:null, choice:null, locked:false, results:[], t0:0, retried:new Set(), grad:0, touched:new Set(), recalled:0 };
let workInk = null, ansInk = null, readTimer = null, nextTimer = null;
const READ_WAIT = 900;   // ペンをはなしてから、答えを読みとるまでの時間（ミリ秒）
const TYPE_TAG = { num: '計算', choice: 'えらぶ', recall: '思い出す', write: '漢字で書く' };

function fmtTime(ms){
  const s = Math.round(ms / 1000);
  return Math.floor(s / 60) + '分' + String(s % 60).padStart(2, '0') + '秒';
}

// 画面を切りかえる前に、手書きの後かたづけをする
function resetScreen(className){
  inks.forEach(i => i.destroy());
  inks = [];
  clearTimeout(readTimer);
  clearTimeout(nextTimer);
  readTimer = nextTimer = null;
  ansInk = null;
  app.className = className;
}

/* ---- とき方の表示 ---- */
function mathLines(m){
  // 長い式は「＝」のところで改行する
  return [].concat(m).flatMap(s => s.length <= 22 ? [s] : s.split(' ＝ ').map((p, i) => (i ? '＝ ' : '') + p));
}
function stepsHTML(q){
  return '<ol class="steps">' + q.steps.map(s => `
    <li>
      ${s.say ? `<p>${s.say}</p>` : ''}
      ${s.math ? `<div class="m num">${mathLines(s.math).map(l => `<span>${l}</span>`).join('')}</div>` : ''}
    </li>`).join('') + '</ol>';
}
function hintFor(q){
  if (q.type === 'write') return '書けなかった漢字は、お手本を見ながら練習スペースに3回書いてから、つぎへ進もう。手を動かすと形が記憶に残りやすくなります。';
  if (q.type === 'recall') return '思い出そうとしたこと自体が、記憶を強くします。とき方を読んだら、目をとじて、もう一度言ってみよう。';
  if (q.shiryo) return 'まちがいは、のびるチャンス。資料のどこを見れば答えが決まるのか、とき方と見くらべてみよう。';
  if (q.type === 'choice') return 'まちがいは、のびるチャンス。とき方の<b>きまり</b>を読んで、どの言葉が手がかりになるかをたしかめよう。';
  return 'まちがいは、のびるチャンス。メモスペースに式を書きながら、とき方と1つずつくらべてみよう。';
}
// 「5 g/cm³」「光合成」のように、答えを表示用の文字にする
function answerText(q, v){
  if (v === null || v === undefined) return q.type === 'write' ? '書けなかった' : '思い出せなかった';
  return q.type === 'num' ? numText(v) + (q.suffix ? ' ' + q.suffix : '') : String(v);
}
function explainHTML(q, mine){
  return `
    <div class="ex-top">
      <span class="mine">きみの答え<b>${answerText(q, mine)}</b></span>
      <span class="correct">正しい答え<b>${answerText(q, q.answer)}</b></span>
    </div>
    <p class="hint">${hintFor(q)}</p>
    <div class="ex-h"><h3>とき方</h3><button class="all" type="button">ぜんぶ見る</button></div>
    ${stepsHTML(q)}`;
}
